---
# LE CONTRAT DE L'OFFRE « compte de service applicatif ».
#
# Écrit UNE SEULE FOIS, ici, dans le mécanisme natif d'Ansible. La CRD du produit
# en est DÉRIVÉE (`argspec-to-crd.py`) : l'auteur n'écrit jamais de CRD, comme un
# auteur de chart n'écrit que son `values.schema.json`.
#
# ⚠️ Ces noms sont AUSSI ceux des variables du sondage AWX et du playbook. Les
# trois doivent coïncider — AN3 a montré ce qu'un écart provoque : AWX refuse le
# lancement, et le produit devient inutilisable puis indestructible.
#
# Ce qui n'est PAS ici, volontairement :
#   · `account_state` — c'est l'affaire de l'opérateur (déclaré en `stateVar`),
#     pas du demandeur : personne ne « demande » l'absence de son propre compte,
#     on retire la demande ;
#   · la machine cible — elle est DÉCLARÉE par la promesse (inventaire figé).
#     Un demandeur qui choisirait son serveur rendrait inutile le verrou sur le
#     job template : le risque se déplacerait, il ne disparaîtrait pas.
argument_specs:
  main:
    short_description: Compte de service applicatif sur un serveur du parc
    description:
      - Crée un compte technique sur une machine qui n'a aucune API déclarative.
      - Kubernetes réconcilie, AWX exécute, la plateforme garde la trace.
      - Retirer la demande supprime le compte, sa clé et son droit sudo.
    options:
      account_name:
        type: str
        required: true
        description:
          - Nom du compte technique sur la machine cible.
          - Minuscules, chiffres et tirets ; c'est aussi le nom du fichier sudoers.
      ssh_public_key:
        type: str
        required: true
        description:
          - Clé publique SSH autorisée à ouvrir une session sur ce compte.
          - La clé PRIVÉE reste chez le demandeur — la plateforme ne la voit jamais.
      sudo_command:
        type: str
        required: false
        default: ""
        description:
          - Commande unique que le compte peut exécuter en sudo, sans mot de passe.
          - Laisser vide pour n'accorder aucun droit d'élévation (le cas par défaut).
          - Le fichier sudoers est validé par visudo avant d'être posé.
