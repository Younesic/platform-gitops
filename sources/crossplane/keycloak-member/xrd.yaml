# Promesse `keycloak-member` — rend des users (usernames) membres d'un groupe.
# Sous-jacent : MR Memberships (= keycloak_group_memberships), qui accepte des
# USERNAMES (aucun UUID à fournir — marche aussi pour les users fédérés LDAP)
# mais est AUTORITAIRE sur LA liste des membres du groupe → règle plateforme :
# UN SEUL claim KeycloakMember par groupe (l'API en liste dit exactement ça).
# ⚠️ `group`/`realm` : schémas BYTE-IDENTIQUES à keycloak-group (fusion des
# homonymes par le composer) — ne pas les faire diverger.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xkeycloakmembers.crossplane.platform.example.io
spec:
  scope: Namespaced
  group: crossplane.platform.example.io
  names:
    kind: XKeycloakMember
    plural: xkeycloakmembers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - group
                - users
              properties:
                group:
                  type: string
                  pattern: ^[a-z][a-z0-9-]*$
                  maxLength: 63
                  description: Nom du groupe Keycloak géré par la plateforme (ex. team-vente).
                users:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                    maxLength: 63
                  description: Usernames Keycloak membres du groupe — ce claim gère LA liste complète (1 claim par groupe).
                realm:
                  type: string
                  default: platform
                  description: Realm Keycloak.
                liaison:
                  type: string
                  maxLength: 63
                  description: ADOPTION — identifiant du groupe Keycloak EXISTANT dont on reprend
                    les membres (le même UUID que la liaison du claim keycloak-group frère).
                    Omis = création classique.
                mode:
                  type: string
                  enum:
                    - observe
                    - gere
                  default: gere
                  description: 'Niveau d''adoption. observe = « La plateforme voit les membres
                    réels et la dérive ; elle ne modifie rien, par construction. » · gere = « La
                    plateforme est la source de vérité : ce claim gère LA liste complète des
                    membres. » ⚠️ Le niveau Gouverné n''est pas offert sur ce moteur (le provider
                    crossplane converge seul — règle « rien ne converge sans déclenchement
                    humain », ADOPTION-STANDARD §4).'
              x-kubernetes-validations:
                # ⚠️ AU4 — un « observé » SANS liaison serait un full-management SILENCIEUX :
                # sans identifiant, crossplane n'a rien à observer et créerait. Fermé à
                # l'ADMISSION, pas au runtime.
                - rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison) && self.liaison != '''')'
                  message: "adoption : le niveau « observe » exige « liaison » (l'UUID du groupe Keycloak existant dont on reprend les membres). Sans lui, la plateforme n'aurait rien à observer et créerait."

