# Compose la MR Group NAMESPACÉE (auth : ClusterProviderConfig `default`,
# manifests/crossplane-providers/ — le kind est REQUIS sur les refs des MRs .m.).
# CONTRAT DE NOMMAGE : la MR s'appelle `kc-group-<groupe>` (déterministe) —
# keycloak-member reconstruit ce nom pour son groupIdRef : c'est le câblage
# cross-promesse SANS UUID (résolution/attente par les retries de refs Crossplane).
# Bonus : 2 claims sur le même groupe = conflit d'ownership sur la MR (unicité).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xkeycloakgroup-keycloak
spec:
  compositeTypeRef:
    apiVersion: crossplane.platform.example.io/v1alpha1
    kind: XKeycloakGroup
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: group
            base:
              apiVersion: group.keycloak.m.crossplane.io/v1alpha1
              kind: Group
              spec:
                forProvider:
                  realmId: platform
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.group
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format   # requis par la function p-and-t (≠ patches v1)
                      fmt: kc-group-%s
              - type: FromCompositeFieldPath
                fromFieldPath: spec.group
                toFieldPath: spec.forProvider.name
              # propagation du label fiche→MR : le nom du XR EST le nom du claim,
              # l'onglet Kubernetes de la fiche montre alors la MR (pas que le XR)
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels['backstage.io/kubernetes-id']
              - type: FromCompositeFieldPath
                fromFieldPath: spec.realm
                toFieldPath: spec.forProvider.realmId
              # rôle de gouvernance → attribut du groupe Keycloak (Optional : omis = pas d'attribut)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.role
                toFieldPath: spec.forProvider.attributes.role
                policy:
                  fromFieldPath: Optional
              # ── ADOPTION (AU4) : LA TABLE UNIQUE (mode, liaison) → managementPolicies.
              # ⚠️ deletionPolicy N'EXISTE PAS sur les MRs namespacés v2 (constaté au banc :
              # « field not declared in schema ») — la non-destruction d'un ADOPTÉ = des
              # policies SANS Delete (contrat §3 v1 : oubli à tous les niveaux).
              # liaison ABSENTE ⇒ combine skippé ⇒ policies absentes = full (greenfield
              # intact à l'octet) ; observe sans liaison = FERMÉ PAR CEL à l'admission.
              - type: CombineFromComposite
                combine:
                  strategy: string
                  string: { fmt: "%s|%s" }
                  variables:
                    - fromFieldPath: spec.mode
                    - fromFieldPath: spec.liaison
                toFieldPath: spec.managementPolicies
                transforms:
                  - type: match
                    match:
                      patterns:
                        - type: regexp
                          regexp: '^observe\|.*'
                          result: ["Observe"]
                        - type: regexp
                          regexp: '^gere\|.+'
                          result: ["Observe", "Create", "Update", "LateInitialize"]
                      fallbackValue: ["*"]
                      fallbackTo: Value
              # liaison → l'identité de l'EXISTANT (Optional : absent = création)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.liaison
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy: { fromFieldPath: Optional }
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.groupId
