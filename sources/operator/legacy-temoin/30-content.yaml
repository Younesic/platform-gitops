# ─────────────────────────────────────────────────────────────────────────────
# LE CONTENU ANSIBLE DU CONTRÔLEUR — en ConfigMap, pas dans une image.
#
# C'est le point qui décide de toute la suite : puisque **AWX exécute**, ce que
# porte le contrôleur est minuscule et GÉNÉRIQUE — « lance ce job template avec le
# spec du CR en variables, attends, remonte le résultat ». Une trentaine de lignes,
# identiques pour tous les produits. Le vrai contenu Ansible reste chez le client,
# dans ses projets AAP.
#
# Conséquence : l'image du contrôleur est celle, publique, d'operator-sdk
# (`ansible-operator`, épinglée par empreinte). **Aucune image par produit** — le
# levier revendiqué du projet est préservé.
#
# ⚠️ FAIT VÉRIFIÉ SUR CE CLUSTER : l'image `ansible-operator:v1.42.3` n'embarque
# AUCUNE collection (`ansible-galaxy collection list` → « None of the provided
# paths were usable »). `operator_sdk.util.k8s_status` et `kubernetes.core.k8s`
# n'existent donc pas : operator-sdk attend qu'on les installe dans SON image, au
# moment du build. Comme on ne construit pas d'image, tout passe par
# `ansible.builtin.uri` et le jeton de compte de service du pod — c'est-à-dire par
# l'API Kubernetes, en clair, avec l'identité du contrôleur. Plus explicite, et
# sans aucune dépendance à Galaxy au démarrage.
#
# ⚠️ Modifier ce contenu → incrémenter `content-revision` dans 40-deployment.yaml :
# ArgoCD ne redémarre pas un pod parce qu'une ConfigMap a changé.
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-operator-content
  namespace: awx
data:
  watches.yaml: |
    ---
    # La CRD → le playbook. `reconcilePeriod` est ce qui distingue cette
    # architecture d'un simple lancement de playbook : toutes les 2 minutes, l'état
    # déclaré est re-imposé à la cible, donc la dérive est corrigée SANS personne.
    - version: v1alpha1
      group: temoin.ansible.example.io
      kind: LegacyService
      playbook: /opt/ansible/temoin/provision.yml
      reconcilePeriod: 120s
      # Le finalizer : à la suppression, un playbook de DÉ-PROVISIONNEMENT est joué
      # pour de vrai. Tant qu'il échoue, la ressource ne part pas (défaut fermé).
      finalizer:
        name: temoin.ansible.example.io/deprovision
        playbook: /opt/ansible/temoin/deprovision.yml

  provision.yml: |
    ---
    # Réconciliation : imposer l'état déclaré à une machine sans API déclarative.
    - name: Reconcilier un service legacy
      hosts: localhost
      connection: local
      gather_facts: false
      vars:
        marker_state: present
        awx_url: "{{ lookup('env', 'AWX_URL') }}"
        awx_token: "{{ lookup('env', 'AWX_TOKEN') | trim }}"
        awx_job_template_name: "{{ lookup('env', 'AWX_JOB_TEMPLATE') }}"
        claim_api_version: "{{ lookup('env', 'CLAIM_API_VERSION') }}"
        claim_plural: "{{ lookup('env', 'CLAIM_PLURAL') }}"
        # L'API Kubernetes, avec l'identite du controleur (son compte de service).
        k8s_api: https://kubernetes.default.svc
        k8s_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        k8s_token: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}"
        cr_url: "https://kubernetes.default.svc/apis/temoin.ansible.example.io/v1alpha1/namespaces/{{ ansible_operator_meta.namespace }}/legacyservices/{{ ansible_operator_meta.name }}"
      tasks:
        - name: Le contrat d'execution est-il complet
          ansible.builtin.assert:
            that:
              - awx_url | length > 0
              - awx_token | length > 0
              - awx_job_template_name | length > 0
            fail_msg: >-
              AWX_URL, AWX_TOKEN et AWX_JOB_TEMPLATE sont requis : sans eux le
              controleur ne peut RIEN executer, et ne doit surtout pas se declarer sain.

        - name: Resoudre le job template AWX declare
          ansible.builtin.uri:
            url: "{{ awx_url }}/api/v2/job_templates/?name={{ awx_job_template_name | urlencode }}"
            headers: { Authorization: "Bearer {{ awx_token }}" }
          register: jt
          no_log: true

        - name: Le job template declare existe-t-il
          # Liste en BLOC et non en flot : `[ ... default([]) ... ]` casse
          # l'analyse YAML (les crochets internes ferment la sequence).
          ansible.builtin.assert:
            that:
              - (jt.json.results | default([])) | length == 1
            fail_msg: "job template '{{ awx_job_template_name }}' introuvable dans AWX"

        - name: Lancer l'automatisation sur la cible
          ansible.builtin.uri:
            url: "{{ awx_url }}/api/v2/job_templates/{{ jt.json.results[0].id }}/launch/"
            method: POST
            headers: { Authorization: "Bearer {{ awx_token }}" }
            body_format: json
            body:
              extra_vars:
                service_name: "{{ service_name }}"
                marker_content: "{{ message | default('gere par la plateforme') }}"
                marker_state: "{{ marker_state }}"
            status_code: [201]
          register: launch
          no_log: true

        - name: Attendre la fin du job AWX
          ansible.builtin.uri:
            url: "{{ awx_url }}/api/v2/jobs/{{ launch.json.id }}/"
            headers: { Authorization: "Bearer {{ awx_token }}" }
          register: job
          until: job.json.status in ['successful', 'failed', 'error', 'canceled']
          retries: 60
          delay: 5
          no_log: true

        - name: Publier l'etat sur la ressource
          ansible.builtin.uri:
            url: "{{ cr_url }}/status"
            method: PATCH
            ca_path: "{{ k8s_ca }}"
            headers:
              Authorization: "Bearer {{ k8s_token }}"
              Content-Type: application/merge-patch+json
            body_format: json
            # Le corps est UNE SEULE expression Jinja : Ansible rend alors un vrai
            # dictionnaire, avec un ENTIER pour awxJobId. Ecrit champ par champ,
            # « {{ ... }} » produirait la CHAINE "12" et l'API refuse en 422
            # (« awxJobId in body must be of type integer » — verifie).
            body: >-
              {{ {'status': {
                   'awxJobId': (launch.json.id | int),
                   'awxJobStatus': job.json.status,
                   'lastRunAt': (job.json.finished | default('')),
                   'serviceState': ('configure' if job.json.status == 'successful' else 'en echec')
                 }} }}
            status_code: [200]
          no_log: true

        # ── La sante, par le mecanisme NATIF de la plateforme ──────────────────
        # Le runtime publie un HealthRecord ; Kratix l'agrege dans
        # `status.healthStatus` de la demande, que la console lit deja.
        - name: Retrouver la demande Kratix (aucun nom de promesse en dur)
          ansible.builtin.uri:
            url: "{{ k8s_api }}/apis/{{ claim_api_version }}/namespaces/{{ ansible_operator_meta.namespace }}/{{ claim_plural }}/{{ ansible_operator_meta.name }}"
            ca_path: "{{ k8s_ca }}"
            headers: { Authorization: "Bearer {{ k8s_token }}" }
            status_code: [200, 404]
          register: claim
          no_log: true
          when: claim_plural | length > 0

        - name: Publier la sante du produit
          ansible.builtin.uri:
            # Application cote serveur : cree si absent, met a jour sinon — un seul appel.
            url: "{{ k8s_api }}/apis/platform.kratix.io/v1alpha1/namespaces/{{ ansible_operator_meta.namespace }}/healthrecords/ansible-runtime-{{ ansible_operator_meta.name }}?fieldManager=ansible-operator-temoin&force=true"
            method: PATCH
            ca_path: "{{ k8s_ca }}"
            headers:
              Authorization: "Bearer {{ k8s_token }}"
              Content-Type: application/apply-patch+yaml
            body_format: json
            # Meme raison qu'au-dessus : une expression unique, pour que
            # `generation` et `lastRun` restent des ENTIERS.
            body: >-
              {{ {'apiVersion': 'platform.kratix.io/v1alpha1', 'kind': 'HealthRecord',
                  'metadata': {'name': 'ansible-runtime-' + ansible_operator_meta.name,
                               'namespace': ansible_operator_meta.namespace},
                  'data': {
                    'promiseRef': {'name': claim.json.metadata.labels['kratix.io/promise-name']},
                    'resourceRef': {'name': ansible_operator_meta.name,
                                    'namespace': ansible_operator_meta.namespace,
                                    'generation': (claim.json.metadata.generation | int)},
                    'state': ('healthy' if job.json.status == 'successful' else 'unhealthy'),
                    'lastRun': (lookup('pipe', 'date +%s') | int),
                    'details': {'source': 'ansible-operator-temoin', 'check': 'job-awx',
                                'reason': 'job AWX ' + (launch.json.id | string) + ' termine en '
                                          + job.json.status + ' (service ' + service_name
                                          + ' sur la cible legacy)'}
                  }} }}
            status_code: [200, 201]
          no_log: true
          when:
            - claim_plural | length > 0
            - claim.status | default(0) == 200

        # En DERNIER : le statut et la sante sont publies AVANT d'echouer, sinon
        # un echec ne laisserait aucune trace lisible.
        - name: Echouer si l'automatisation a echoue
          ansible.builtin.fail:
            msg: "job AWX {{ launch.json.id }} termine en {{ job.json.status }}"
          when: job.json.status != 'successful'

  deprovision.yml: |
    ---
    # Dé-provisionnement : joué par le finalizer, à la suppression de la ressource.
    # C'est ce qui manque à un playbook lancé dans un pipeline — là, la suppression
    # ne ferait RIEN sur la cible.
    - name: De-provisionner un service legacy
      hosts: localhost
      connection: local
      gather_facts: false
      vars:
        awx_url: "{{ lookup('env', 'AWX_URL') }}"
        awx_token: "{{ lookup('env', 'AWX_TOKEN') | trim }}"
        awx_job_template_name: "{{ lookup('env', 'AWX_JOB_TEMPLATE') }}"
        k8s_api: https://kubernetes.default.svc
        k8s_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        k8s_token: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}"
      tasks:
        - name: Resoudre le job template AWX declare
          ansible.builtin.uri:
            url: "{{ awx_url }}/api/v2/job_templates/?name={{ awx_job_template_name | urlencode }}"
            headers: { Authorization: "Bearer {{ awx_token }}" }
          register: jt
          no_log: true

        - name: Demander le retrait du service sur la cible
          ansible.builtin.uri:
            url: "{{ awx_url }}/api/v2/job_templates/{{ jt.json.results[0].id }}/launch/"
            method: POST
            headers: { Authorization: "Bearer {{ awx_token }}" }
            body_format: json
            body:
              extra_vars:
                service_name: "{{ service_name }}"
                # Le sondage du job template declare `marker_content` REQUIS : AWX
                # refuse un lancement qui n'apporte pas toutes les variables requises
                # (400, verifie). Le contrat du sondage s'impose donc AUSSI au
                # de-provisionnement, meme si la valeur n'y sert a rien.
                marker_content: "{{ message | default('retrait') }}"
                marker_state: absent
            status_code: [201]
          register: launch
          no_log: true

        - name: Attendre la fin du job AWX
          ansible.builtin.uri:
            url: "{{ awx_url }}/api/v2/jobs/{{ launch.json.id }}/"
            headers: { Authorization: "Bearer {{ awx_token }}" }
          register: job
          until: job.json.status in ['successful', 'failed', 'error', 'canceled']
          retries: 60
          delay: 5
          no_log: true

        # Si le retrait echoue, on ECHOUE : le finalizer n'est pas retire, la
        # ressource ne disparait pas, et personne ne croit a une suppression propre.
        - name: Echouer si le retrait a echoue
          ansible.builtin.fail:
            msg: "de-provisionnement : job AWX {{ launch.json.id }} termine en {{ job.json.status }}"
          when: job.json.status != 'successful'

        - name: Retirer la sante publiee
          ansible.builtin.uri:
            url: "{{ k8s_api }}/apis/platform.kratix.io/v1alpha1/namespaces/{{ ansible_operator_meta.namespace }}/healthrecords/ansible-runtime-{{ ansible_operator_meta.name }}"
            method: DELETE
            ca_path: "{{ k8s_ca }}"
            headers: { Authorization: "Bearer {{ k8s_token }}" }
            status_code: [200, 202, 404]
          no_log: true
