# Le contrôleur du produit : l'image PUBLIQUE d'operator-sdk, épinglée par
# empreinte, + les rôles PARTAGÉS + son seul watches.yaml.
#
# Tout ce qui autorise ce produit est ici, dans l'ENVIRONNEMENT — donc hors de
# portée du `spec` d'une demande. C'est ce qui fait tenir le verrou.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motd-operator
  namespace: awx
  labels: { app: motd-operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: motd-operator }
  template:
    metadata:
      labels: { app: motd-operator }
      annotations:
        roles-revision: "2"
    spec:
      serviceAccountName: motd-operator
      priorityClassName: platform-high
      volumes:
        - name: roles
          configMap: { name: ansible-operator-roles, items: [
            { key: awx-contrat.yml, path: awx-contrat/tasks/main.yml },
            { key: awx-runner.yml,  path: awx-runner/tasks/main.yml },
            { key: awx-remover.yml, path: awx-remover/tasks/main.yml } ] }
        - name: generic
          configMap: { name: ansible-operator-roles, items: [
            { key: provision.yml,   path: provision.yml },
            { key: deprovision.yml, path: deprovision.yml } ] }
        - name: produit
          configMap: { name: motd-temoin-watches }
        - name: runner
          emptyDir: {}
      containers:
        - name: operator
          image: quay.io/operator-framework/ansible-operator@sha256:96053ae3e045c4eb57350cbf1995dece22bf7d3bfe4cf875a20d8853963a3731 # v1.42.3
          command: [ansible-operator]
          args: [run, --watches-file=/opt/ansible/produit/watches.yaml, --leader-election-id=motd-operator]
          env:
            - { name: WATCH_NAMESPACE, value: "" }
            - { name: ANSIBLE_ROLES_PATH, value: /opt/ansible/roles }
            - { name: ANSIBLE_LOCAL_TEMP, value: /tmp/ansible }
            - { name: ANSIBLE_REMOTE_TEMP, value: /tmp/ansible }
            # ── Le CONTRAT D'EXÉCUTION du produit ────────────────────────────
            - { name: AWX_URL, value: "http://awx-service.awx.svc.cluster.local" }
            - { name: AWX_JOB_TEMPLATE, value: "legacy-motd" }      # le SEUL autorisé
            - { name: AWX_STATE_VAR,    value: "marker_state" }     # comment on dé-provisionne
            - { name: AWX_STATE_ABSENT, value: "absent" }
            - { name: AWX_ALLOWED_LIMITS, value: "" }               # le produit FIXE sa cible
            - { name: AWX_TIMEOUT_SECONDS, value: "600" }
            - name: AWX_TOKEN
              valueFrom:
                secretKeyRef:
                  # Le credential du fournisseur « indus » : son utilisateur AWX
                  # n'a le droit d'exécuter QUE legacy-motd.
                  name: awx-token-indus
                  key: token
            # ── De quoi être générique : l'opérande et la demande ─────────────
            - { name: OPERAND_GROUP,   value: "temoin.ansible.example.io" }
            - { name: OPERAND_VERSION, value: "v1alpha1" }
            - { name: OPERAND_PLURAL,  value: "motds" }
            - { name: CLAIM_API_VERSION, value: "platform.example.io/v1alpha1" }
            - { name: CLAIM_PLURAL,      value: "motdtemoins" }
          volumeMounts:
            - { name: roles,   mountPath: /opt/ansible/roles,   readOnly: true }
            - { name: generic, mountPath: /opt/ansible/generic, readOnly: true }
            - { name: produit, mountPath: /opt/ansible/produit, readOnly: true }
            - { name: runner,  mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 6789 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /readyz, port: 6789 }
            initialDelaySeconds: 10
            periodSeconds: 15
