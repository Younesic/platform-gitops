apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  # cascade : sans ce finalizer, retirer l'app du Git supprime l'objet ArgoCD
  # et LAISSE les ressources tourner (rien n'est libéré).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: "5.9.29"
      helm:
        valueFiles: [ $values/bootstrap/values/jenkins.yaml ]
    - repoURL: git@github.com:Younesic/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:Younesic/platform-gitops.git
      targetRevision: main
      path: bootstrap/manifests/jenkins
  destination: { server: https://kubernetes.default.svc, namespace: jenkins }
  syncPolicy:
    automated: { selfHeal: true, prune: false }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
