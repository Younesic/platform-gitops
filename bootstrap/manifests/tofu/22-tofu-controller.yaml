# tofu-controller v0.16.4 — vendorisé depuis l'artefact de release officiel
# (flux-iac/tofu-controller, `tofu-controller.deployment.yaml`).
#
# DEUX ÉCARTS avec l'amont, tous deux des pins par empreinte :
#   1. l'image du contrôleur ;
#   2. **l'image du RUNNER** (`RUNNER_POD_IMAGE`) — c'est une image DISTINCTE, et c'est
#      elle qui contient réellement OpenTofu. La pinner est le geste important : c'est
#      elle qui exécutera le code d'infrastructure.
#
# Le runner est un pod éphémère lancé par le contrôleur à chaque tour de réconciliation.
# ⚠️ Cela veut dire qu'un tour de détection de dérive coûte un POD, pas un appel d'API —
# c'est ce que TN2 (g) doit chiffrer avant d'aller plus loin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tofu-controller
  namespace: flux-system
  labels:
    control-plane: tofu-controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: tofu-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: tofu-controller
    spec:
      serviceAccountName: tf-controller
      priorityClassName: platform-high
      securityContext:
        fsGroup: 1337
      terminationGracePeriodSeconds: 250
      containers:
        - name: manager
          # ÉCART 1 : amont = `ghcr.io/flux-iac/tofu-controller:v0.16.4` (par tag).
          image: ghcr.io/flux-iac/tofu-controller:v0.16.4@sha256:7f95e82a29c6f0c49965a1e248f2c1713593053819175dd2624c474b05ef5263
          imagePullPolicy: IfNotPresent
          args:
            - --watch-all-namespaces
            - --log-level=info
            - --log-encoding=json
            - --enable-leader-election
            - --concurrent=1
            - --graceful-shutdown-timeout=240s
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # ÉCART 2 : amont = `ghcr.io/flux-iac/tf-runner:v0.16.4` (par tag).
            # C'est CETTE image qui embarque OpenTofu et qui exécute.
            - name: RUNNER_POD_IMAGE
              value: ghcr.io/flux-iac/tf-runner:v0.16.4@sha256:fc3af4d9b99f54cc92d4aec51d83117dcf373b79d8ed1dc6f69a4ac154184725
          ports:
            - { containerPort: 8080, name: http-prom }
            - { containerPort: 9440, name: healthz, protocol: TCP }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
          readinessProbe:
            httpGet: { path: /readyz, port: healthz }
          resources:
            requests: { cpu: 200m, memory: 64Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { mountPath: /tmp, name: temp }
      volumes:
        - { name: temp, emptyDir: {} }
