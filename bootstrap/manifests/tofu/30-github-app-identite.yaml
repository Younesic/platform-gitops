# L'IDENTITÉ GIT DU SOURCE-CONTROLLER — la même GitHub App que le reste de la plateforme.
#
# POURQUOI. Le source-controller doit cloner nos dépôts, qui sont PRIVÉS. Trois façons de
# lui donner un accès :
#   · une clé de déploiement par dépôt → un secret durable de plus, exactement ce qu'on
#     vient de supprimer côté fabrique. Écarté.
#   · un jeton d'installation recopié par un CronJob → il expire en une heure, il faudrait
#     le rafraîchir, et un secret périmé casserait les clones sans le dire. Écarté.
#   · `provider: github` — **le source-controller frappe le jeton LUI-MÊME et le renouvelle
#     tout seul**, à partir des identifiants de l'App. C'est le chemin natif, et c'est
#     celui-ci.
#
# Résultat : **aucun jeton ne circule et aucun jeton ne périme**. La portée reste celle de
# l'installation de l'App — un geste que le propriétaire du dépôt fait lui-même.
#
# ⚠️ LA CLÉ PRIVÉE NE TRANSITE PAS PAR UN HUMAIN. La tâche ci-dessous tourne DANS le
# cluster, lit le secret de l'App là où il vit déjà (namespace backstage) et écrit la forme
# attendue par flux dans `flux-system`. Rien n'est affiché, rien n'est journalisé.
# (Même geste que la recopie du mot de passe LDAP pour iTop.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-app-identite
  namespace: flux-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
# Lire LE secret de l'App, et lui seul, là où il vit.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-app-identite-lecture
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [backstage-github-app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-app-identite-lecture
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-app-identite-lecture }
subjects:
  - { kind: ServiceAccount, name: github-app-identite, namespace: flux-system }
---
# Écrire LE secret d'identité, et lui seul.
# `create` ne peut pas être restreint par nom : Kubernetes décide avant que le nom existe.
# Le reste (get/patch) est nominatif — ce compte ne peut relire aucun autre secret d'ici.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-app-identite-ecriture
  namespace: flux-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [github-app]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-app-identite-ecriture
  namespace: flux-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-app-identite-ecriture }
subjects:
  - { kind: ServiceAccount, name: github-app-identite, namespace: flux-system }
---
# Le secretRef d'un GitRepository ne lit que SON namespace : l'identité doit donc
# exister là où vivent les sources, c'est-à-dire avec les demandes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-app-identite-ecriture
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [github-app]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-app-identite-ecriture
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-app-identite-ecriture }
subjects:
  - { kind: ServiceAccount, name: github-app-identite, namespace: flux-system }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-app-identite
  namespace: flux-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  recopie.py: |
    """Recopie l'identité de la GitHub App dans la forme attendue par flux.

    Lit  : le Secret de l'App, dans SON namespace, PAR L'API.
    Écrit: le Secret `github-app` du namespace courant, avec les trois clés que
           source-controller réclame pour `provider: github`.

    ⚠️ POURQUOI PAR L'API ET PAS PAR UN MONTAGE (erreur payée en la posant) :
    un volume ne peut monter QUE des secrets de son PROPRE namespace. Le droit
    `get` accordé sur le namespace voisin autorise la LECTURE PAR L'API, pas le
    montage — le pod reste en ContainerCreating avec « secret not found », et
    le message n'explique pas que la cause est le namespace.

    Rien n'est affiché : ni la clé, ni un extrait, ni sa longueur.
    """
    import base64, json, os, pathlib, subprocess, sys, yaml

    SA   = pathlib.Path("/var/run/secrets/kubernetes.io/serviceaccount")
    # La cible peut différer de notre namespace : le secretRef d'un GitRepository
    # ne lit que SON namespace, et les sources vivent avec les demandes.
    NS   = os.environ.get("TARGET_NAMESPACE") or (SA / "namespace").read_text().strip()
    NOM  = os.environ.get("SECRET_NAME", "github-app")
    INST = os.environ["GITHUB_APP_INSTALLATION_ID"].strip()
    SRC_NS  = os.environ["SOURCE_NAMESPACE"].strip()
    SRC_NOM = os.environ["SOURCE_SECRET"].strip()
    SRC_CLE = os.environ["SOURCE_KEY"].strip()

    JETON = (SA / "token").read_text().strip()
    BASE  = (f"https://{os.environ.get('KUBERNETES_SERVICE_HOST','kubernetes.default.svc')}"
             f":{os.environ.get('KUBERNETES_SERVICE_PORT','443')}")

    def api(methode, url, corps=None, ctype="application/json"):
        cmd = ["curl", "-sS", "--cacert", str(SA / "ca.crt"), "-X", methode,
               "-H", f"Authorization: Bearer {JETON}", "-H", f"Content-Type: {ctype}",
               "-w", "\n%{http_code}"]
        if corps is not None:
            cmd += ["--data-binary", "@-"]
        cmd.append(url)
        r = subprocess.run(cmd, input=corps, capture_output=True, text=True, timeout=45)
        bout = r.stdout.rsplit("\n", 1)
        code = int(bout[-1]) if bout[-1].isdigit() else 0
        return code, bout[0]

    # ---- lire l'identité de l'App, là où elle vit ----
    code, brut = api("GET", f"{BASE}/api/v1/namespaces/{SRC_NS}/secrets/{SRC_NOM}")
    if code != 200:
        sys.exit(f"lecture de {SRC_NS}/{SRC_NOM} refusée ({code})")
    donnees = json.loads(brut).get("data", {})
    if SRC_CLE not in donnees:
        sys.exit(f"clé « {SRC_CLE} » absente de {SRC_NS}/{SRC_NOM} — clés présentes : {sorted(donnees)}")
    creds = yaml.safe_load(base64.b64decode(donnees[SRC_CLE]).decode())

    app_id = str(creds.get("appId") or "").strip()
    cle    = str(creds.get("privateKey") or "")
    if not app_id or "PRIVATE KEY" not in cle:
        sys.exit(f"{SRC_NS}/{SRC_NOM} : appId ou privateKey manquant")

    # ---- écrire la forme attendue par flux ----
    b64 = lambda s: base64.b64encode(s.encode()).decode()
    charge = json.dumps({
        "apiVersion": "v1", "kind": "Secret",
        "metadata": {"name": NOM, "namespace": NS},
        "type": "Opaque",
        "data": {
            "githubAppID":             b64(app_id),
            "githubAppInstallationID": b64(INST),
            "githubAppPrivateKey":     b64(cle),
        },
    })

    url = f"{BASE}/api/v1/namespaces/{NS}/secrets/{NOM}"
    code, _ = api("PATCH", url, charge, "application/merge-patch+json")
    if code in (200, 201):
        print(f"identité de l'App mise a jour dans {NS}/{NOM} (appId {app_id}, installation {INST})")
    elif code == 404:
        code, _ = api("POST", f"{BASE}/api/v1/namespaces/{NS}/secrets", charge)
        if code not in (200, 201):
            sys.exit(f"création refusée ({code})")
        print(f"identité de l'App créée dans {NS}/{NOM} (appId {app_id}, installation {INST})")
    else:
        sys.exit(f"écriture refusée ({code})")
---
# CronJob plutôt que Job, et c'est une leçon payée : un Job en hook PostSync s'est
# retrouvé bloqué (pod en échec de montage + finalizer ArgoCD), et ArgoCD ne rejoue pas
# un hook quand la synchro n'applique rien — il a fallu retirer le finalizer à la main.
#
# Un CronJob idempotent n'a aucun de ces défauts : il se rejoue tout seul, il n'est pas
# immuable, et si la clé de l'App était un jour remplacée, le secret suivrait sans geste.
# La cadence est lâche : cette identité ne change pas.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-app-identite
  namespace: flux-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "17 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: github-app-identite
          restartPolicy: Never
          priorityClassName: platform-high
          volumes:
            # ⚠️ PAS de volume vers le secret de l'App : il vit dans un AUTRE namespace, et un
            # volume ne peut monter que des secrets du sien. Le script le lit par l'API.
            - name: script
              configMap: { name: github-app-identite }
          containers:
            - name: recopie
              # MÊME image que la fabrique : mêmes outils, un seul digest à suivre.
              image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:f3d3788de99e2cf3d7a85a48ec6f76056e85f386dbbdbb86ee327b2d92717c6d
              command: [python, /script/recopie.py]
              env:
                # L'identifiant d'installation de l'App `attijari-portal` (BR16). Ce n'est pas
                # un secret : c'est un numéro d'ordre public côté GitHub.
                - { name: GITHUB_APP_INSTALLATION_ID, value: "147217432" }
                - { name: SECRET_NAME, value: github-app }
                # Le secretRef d'un GitRepository ne lit que SON namespace : l'identité
                # doit exister là où vivent les sources, donc avec les demandes.
                - { name: TARGET_NAMESPACE, value: default }
                - { name: SOURCE_NAMESPACE, value: backstage }
                - { name: SOURCE_SECRET, value: backstage-github-app }
                - { name: SOURCE_KEY, value: github-app-credentials.yaml }
              volumeMounts:
                - { name: script, mountPath: /script, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 300m, memory: 192Mi }
