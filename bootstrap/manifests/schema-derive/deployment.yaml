# schema-derive — service d'APERÇU du schéma d'une source pour le formulaire de
# création de promesse (le composer de présentation doit connaître les champs
# AVANT génération). Réutilise l'image de la factory (helm + git + scaffold) avec
# un entrypoint alternatif ; lecture seule, aucun effet de bord.
# ns `default` : le clone des sources privées se fait avec le JETON d'installation
# de la GitHub App (secret `github-app-token`, frappé toutes les 30 min, valable
# une heure) — plus avec une clé SSH durable. helm pull Harbor = anonyme.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-derive
  namespace: default
  labels: { app: schema-derive }
spec:
  replicas: 1
  selector:
    matchLabels: { app: schema-derive }
  template:
    metadata:
      labels: { app: schema-derive }
    spec:
      containers:
        - name: schema-derive
          image: harbor.212-47-226-56.nip.io/platform/schema-derive@sha256:bcd1694eb7d4e321b2191ceff94355b2435917130cd70a7d11ab17b6e6bf5c82
          command: ["python", "/app/derive_server.py"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: HOME, value: /tmp }        # helm/git écrivent dans $HOME
            # Identifiants de REGISTRE, au format dockerconfigjson (celui de
            # Kubernetes pour tirer une image). Posée sans condition : vérifié
            # sur helm 3.16, un fichier absent ou ne couvrant pas l'hôte laisse
            # le tirage anonyme intact. Seul un fichier MALFORMÉ casse tout —
            # la sonde d'accès le détecte et le nomme.
            - { name: HELM_REGISTRY_CONFIG, value: /kratix/secrets/registry/.dockerconfigjson }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: github-token, mountPath: /kratix/secrets/github, readOnly: true }
            - { name: registry-creds, mountPath: /kratix/secrets/registry, readOnly: true }
      volumes:
        # LA clé SSH de déploiement a été RETIRÉE : l'identité est désormais le
        # jeton d'installation de la GitHub App, frappé toutes les 30 min et
        # valable une heure.
        #
        # ⚠️ Pourquoi retirer le repli plutôt que le garder « au cas où » : un
        # repli SILENCIEUX masque exactement la panne qu'il faut voir. Si la
        # frappe s'arrêtait, tout aurait continué de marcher sur la clé, personne
        # n'aurait rien su — et le jour du retrait, tout serait tombé d'un coup.
        # Le secret `promise-factory-git` reste dans le cluster : revenir en
        # arrière, c'est un `git revert`.
        #
        # OPTIONNEL reste indispensable : sans ce mot, un jeton pas encore frappé
        # empêcherait le pod de DÉMARRER.
        - name: github-token
          secret:
            secretName: github-app-token
            optional: true
            defaultMode: 256
        # Optionnel : sans lui, on tire en anonyme — exactement comme avant.
        - name: registry-creds
          secret:
            secretName: registry-credentials
            optional: true
            defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  name: schema-derive
  namespace: default
  labels: { app: schema-derive }
spec:
  selector: { app: schema-derive }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
