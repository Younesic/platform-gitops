# ── LE JETON D'INSTALLATION DE LA GITHUB APP, FRAPPÉ DANS LE CLUSTER ─────────
#
# POURQUOI. La plateforme clonait et poussait avec UNE clé de déploiement SSH :
# durable, partagée par le service de dérivation et par la fabrique, et qu'il
# fallait faire installer À LA MAIN sur chaque dépôt par quelqu'un qui en a
# l'administration. Portée large, rotation big-bang, et aucune trace de « qui a
# cloné quoi » — c'était un trousseau, pas une gestion d'accès.
#
# Un jeton d'installation répond aux trois :
#   · il EXPIRE (une heure) — ce qui circule ne survit pas à la journée ;
#   · sa portée SUIT l'installation de l'App, et installer une App est un geste
#     que le propriétaire du dépôt fait LUI-MÊME. Le self-service passe de
#     « demandez une clé à la plateforme » à « autorisez-la » ;
#   · c'est la MÊME identité que celle qui ouvre les PR et pose les statuts iTop :
#     une seule chose à révoquer, une seule à auditer.
#
# ⚠️ CE QUE ÇA NE FAIT PAS, dit franchement : la clé privée de l'App reste un
# secret durable. On ne supprime pas les secrets — on réduit ce qui CIRCULE et on
# rétrécit sa portée. Et cette clé privée ne quitte PAS ce namespace : le CronJob
# tourne ici, auprès d'elle, et n'écrit que le jeton là où il sert.
#
# ⚠️ La cadence (30 min) doit rester nettement sous la durée de vie du jeton
# (60 min) : sinon une frappe ratée laisserait un jeton périmé, et TOUTE la
# fabrication de promesses s'arrêterait.
#
# ⚠️ IL N'Y A PLUS DE REPLI SSH (clé démontée le 2026-07-28) : ce chemin est le
# SEUL. C'est délibéré — un repli silencieux masque exactement la panne qu'il faut
# voir. Le secret `promise-factory-git` existe encore dans le cluster, donc revenir
# en arrière reste un `git revert`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-token
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Lire LA clé privée, et elle seule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-token-lecture
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [backstage-github-app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-token-lecture
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-token-lecture }
subjects:
  - { kind: ServiceAccount, name: github-token, namespace: backstage }
---
# Écrire LE jeton, et lui seul, là où la fabrique le lira.
# `create` sans `resourceNames` : Kubernetes ne sait pas restreindre une création
# par nom — le nom n'existe pas encore au moment de la décision. Le reste
# (get/patch) est nominatif, donc ce compte ne peut pas relire d'autres secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-token-ecriture
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    # Un secret PAR installation — un jeton d'installation ne couvre qu'un compte.
    #   github-app-token      → compte Younesic  (accès git de la fabrique)
    #   github-app-token-org  → organisation YounesicCo (création de dépôts)
    resourceNames: [github-app-token, github-app-token-org]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-token-ecriture
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-token-ecriture }
subjects:
  - { kind: ServiceAccount, name: github-token, namespace: backstage }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-token
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  # Un jeton périmé arrête la fabrication : on ne laisse pas une frappe traîner.
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: github-token
          restartPolicy: Never
          priorityClassName: platform-high
          volumes:
            - name: app
              secret:
                secretName: backstage-github-app
                defaultMode: 0400
          containers:
            - name: frappe
              # MÊME image que la fabrique : mêmes outils, même identité, un seul
              # digest à suivre. Le script n'affiche JAMAIS le jeton — il irait
              # dans les journaux du pod.
              image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:4420575c6349a3beffa9b658f347b24d74c81ba89321e9aba826f79c3d075109
              command: [python, /app/github_token.py]
              env:
                - { name: GITHUB_APP_CREDENTIALS, value: /app/github-app/github-app-credentials.yaml }
                - { name: TOKEN_SECRET_NAMESPACE, value: default }
                - { name: TOKEN_SECRET_NAME, value: github-app-token }
                # ⚠️ OBLIGATOIRE DEPUIS QU'IL Y A PLUS D'UNE INSTALLATION (2026-07-29).
                # L'App est installée sur DEUX comptes : `Younesic` (les 5 dépôts de la
                # plateforme) et `YounesicCo` (l'organisation, pour créer des dépôts).
                # Un jeton d'installation ne couvre QU'UNE installation — il n'y a pas
                # de jeton qui embrasse les deux. Sans cette épingle, `github_token.py`
                # REFUSE de deviner et échoue en nommant la cause ; c'est le bon
                # comportement, mais il faut lui répondre.
                #
                # Ici : l'installation du COMPTE, celle qui porte platform-gitops,
                # kratix-state et portal-templates — donc l'accès git de la fabrique.
                - { name: GITHUB_APP_INSTALLATION_ID, value: "147217432" }
              volumeMounts:
                - { name: app, mountPath: /app/github-app, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 300m, memory: 192Mi }
---
# ── LE JETON DE L'ORGANISATION ───────────────────────────────────────────────
# Même mécanisme, autre installation. Il ne s'agit PAS d'un doublon : un jeton
# d'installation d'App est lié à UNE installation, et une App installée sur deux
# comptes en a deux. Vouloir n'en frapper qu'un reviendrait à choisir lequel des
# deux usages on abandonne.
#
#   github-app-token      (compte Younesic)      → cloner platform-gitops,
#                                                   kratix-state, portal-templates
#   github-app-token-org  (org. YounesicCo)      → CRÉER des dépôts
#
# ⚠️ Pourquoi l'organisation est indispensable pour créer : GitHub réserve
# `POST /user/repos` aux jetons d'UTILISATEUR — un jeton d'App reçoit 403 sur un
# compte personnel même avec `administration: write` accordé (mesuré le
# 2026-07-29). Sur une organisation, `POST /orgs/{org}/repos` passe.
#
# Ce secret alimente l'environnement du runner terraform, qui le lit comme
# GITHUB_TOKEN — jamais comme variable terraform : une variable atterrit dans
# l'état et dans le plan.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-token-org
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: github-token
          restartPolicy: Never
          priorityClassName: platform-high
          volumes:
            - name: app
              secret:
                secretName: backstage-github-app
                defaultMode: 0400
          containers:
            - name: frappe
              image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:4420575c6349a3beffa9b658f347b24d74c81ba89321e9aba826f79c3d075109
              command: [python, /app/github_token.py]
              env:
                - { name: GITHUB_APP_CREDENTIALS, value: /app/github-app/github-app-credentials.yaml }
                - { name: TOKEN_SECRET_NAMESPACE, value: default }
                - { name: TOKEN_SECRET_NAME, value: github-app-token-org }
                # L'installation sur l'ORGANISATION YounesicCo.
                - { name: GITHUB_APP_INSTALLATION_ID, value: "149916529" }
              volumeMounts:
                - { name: app, mountPath: /app/github-app, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 300m, memory: 192Mi }

---
# ── LG7 — LE MÊME JETON D'ORG, AUSSI DANS LE NAMESPACE backstage ─────────────
# Le connecteur d'inventaire (httpEntities githubOrgRepos) lit le jeton DANS UN
# FICHIER monté (auth bearerFile) : un secret ne se monte que depuis SON namespace,
# et le pod backstage vit dans `backstage`. On ne déplace pas la clé privée, on ne
# rallonge pas la vie du jeton : on écrit la MÊME frappe à un second endroit.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-token-ecriture
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [github-app-token-org]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-token-ecriture
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-token-ecriture }
subjects:
  - { kind: ServiceAccount, name: github-token, namespace: backstage }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-token-org-backstage
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: github-token
          restartPolicy: Never
          priorityClassName: platform-high
          volumes:
            - name: app
              secret:
                secretName: backstage-github-app
                defaultMode: 0400
          containers:
            - name: frappe
              image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:4420575c6349a3beffa9b658f347b24d74c81ba89321e9aba826f79c3d075109
              command: [python, /app/github_token.py]
              env:
                - { name: GITHUB_APP_CREDENTIALS, value: /app/github-app/github-app-credentials.yaml }
                - { name: TOKEN_SECRET_NAMESPACE, value: backstage }
                - { name: TOKEN_SECRET_NAME, value: github-app-token-org }
                - { name: GITHUB_APP_INSTALLATION_ID, value: "149916529" }
              volumeMounts:
                - { name: app, mountPath: /app/github-app, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 300m, memory: 192Mi }
