# ── AU6 : LE DROIT DE L'ÉCHELLE D'ADOPTION — ClusterRole SÉPARÉ ─────────────────
#
# ⚠️ JAMAIS élargir `backstage-readonly` : un rôle nommé pour sa retenue doit la
# garder (la leçon TN4, déjà appliquée au plan-gate). Deux besoins, deux blocs :
#
# 1. LA DÉRIVE SE VOIT (exigence utilisateur de premier rang) : le backend lit
#    le status des Applications ArgoCD d'adoption (adoption-observe/gouverne) —
#    l'OutOfSync de leurs ressources EST la dérive d'un adopté k8s, remontée SUR
#    la fiche console. Lecture seule, namespace argocd.
#
# 2. LE KEEPER DE BASCULE (la découverte AU2 automatisée) : Kratix ne re-place
#    JAMAIS un workloadGroup déjà placé — après un merge de promotion, le
#    placement pointe l'ancienne destination pour toujours. Le keeper compare le
#    selector COURANT du work aux labels de la destination et supprime le
#    placement périmé (le scheduler Kratix re-place en <30 s — prouvé AU2/AU3
#    dans les deux sens). `delete` sur workplacements SEULEMENT — jamais works,
#    jamais destinations, jamais une ressource réelle (un workplacement est un
#    objet INTERNE de planification, même famille que le « Re-vérifier »).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-adoption-argocd-read
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get]
    resourceNames: [adoption-observe, adoption-gouverne]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-adoption-argocd-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-adoption-argocd-read
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-adoption-bascule
rules:
  - apiGroups: [platform.kratix.io]
    resources: [works, destinations]
    verbs: [get, list]
  - apiGroups: [platform.kratix.io]
    resources: [workplacements]
    verbs: [get, list, delete]
  # les niveaux qu'une offre sait tenir = l'enum de son CRD (la matrice vit dans
  # la donnée — crossplane sans gouverne, AU1/AU4) ; lecture seule.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  # ── LE DÉCLENCHEUR DU CANAL ANNOTATION (constaté en production, CL5) ──────────
  # Après le merge d'une promotion sur une offre OPERATOR, l'annotation du claim
  # passe bien à `gere` — et rien ne se passe : changer une ANNOTATION ne bumpe pas
  # `metadata.generation`, donc Kratix ne rejoue jamais le pipeline, le work garde
  # son ancien selector, et le keeper de bascule a RAISON de ne rien faire. Toute la
  # chaîne d'aval est saine ; elle travaille sur une donnée périmée. (Le canal spec
  # n'a pas ce trou : `spec.mode` change ⇒ la génération bouge ⇒ tout s'enchaîne.)
  #
  # Le keeper pose donc le label `kratix.io/manual-reconciliation` — le levier
  # DOCUMENTÉ de Kratix, que la plateforme utilise déjà à la main — sur les seuls
  # claims dont le niveau déclaré diverge du selector courant de leur work.
  #
  # ⚠️ LIMITE DITE FRANCHEMENT : Kubernetes n'offre pas de « patch de CE label
  # seulement ». `patch` sur ces familles est donc plus large que le besoin. Ce qui
  # borne réellement le geste est le CODE (rayon aux seuls adoptés divergents) et
  # le fait que ces deux familles sont celles de la plateforme, déjà lisibles par
  # `backstage-readonly`. Aucune autre famille n'est ouverte.
  - apiGroups: [platform.example.io, crossplane.platform.example.io]
    resources: ['*']
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-adoption-bascule
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-adoption-bascule
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
