apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.yaml: |
    app:
      title: Attijari Portal
      baseUrl: https://backstage.212-47-226-56.nip.io
    organization:
      name: Attijari

    # G3 — politique de validation des logos (frontend, lue par le plugin kratix-marketplace
    # via configApi ; déclarée @deepVisibility frontend dans son config.d.ts). Allowlist d'hôtes
    # MIROIR de backend.csp.img-src : le plugin ne rend un <img> QUE pour un hôte autorisé (sinon
    # placeholder propre, pas d'image cassée) → les 2 gates (plugin client + CSP navigateur) s'accordent.
    # BR9 — sources PLATEFORME des pickers du Studio (partagées par tous les
    # navigateurs ; frontend-visible via le config.d.ts du plugin kratix-studio).
    # Ajouter une source = 1 entrée ici + restart (ZÉRO rebuild) ; les Settings
    # du Studio restent des overrides LOCAUX additifs (badge « locale »).
    kratixStudio:
      sources:
        - id: harbor-platform
          kind: helm
          label: Harbor · platform
          host: harbor.212-47-226-56.nip.io
          project: platform
        - id: git-platform-gitops
          kind: git
          label: GitHub · platform-gitops
          host: github.com
          repo: Younesic/platform-gitops
        # 3e source ABSENTE des défauts embarqués = la preuve vivante que la
        # liste vient de LA CONFIG (BR9 DoD a/b).
        - id: git-kratix-state
          kind: git
          label: GitHub · kratix-state
          host: github.com
          repo: Younesic/kratix-state
      # IT3 — classes de tickets ITSM qu'une offre peut déclarer dans sa politique
      # d'approbation. MIROIR des clés de `itop.classes` (plus bas) : proposer ici
      # une classe non déclarée là-bas produirait un refus à l'exécution.
      approvalClasses:
        - NormalChange
        - RoutineChange
        - UserRequest

    kratixMarketplace:
      logo:
        requireHttps: true
        allowedHosts:
          - harbor.212-47-226-56.nip.io

    # === iTop — LE SEUL ENDROIT OÙ DES ÉTATS ITOP ONT LE DROIT D'EXISTER ======
    # La question « est-ce approuvé ? » n'est PAS un test d'égalité écrit dans le
    # code : c'est cette requête OQL. Les clients personnalisent lourdement leurs
    # cycles de vie — chez eux, on change la requête, pas notre code.
    # `packages/backend/src/modules/itop.ts` ne contient AUCUN nom d'état (vérifiable
    # par grep) et refuse toute requête qui ne cite pas :ref (sinon elle renverrait
    # des tickets étrangers, donc du vert imméritè).
    itop:
      baseUrl: ${ITOP_BASE_URL}
      auth:
        user: ${ITOP_USER}
        password: ${ITOP_PASSWORD}
      # La référence est INTERPOLÉE dans l'OQL (l'API REST d'iTop n'a pas de
      # requête préparée) : ce motif est le rempart, appliqué AVANT tout appel réseau.
      # Références natives iTop : Change C-000123 · UserRequest R-000123 · Incident I-000123.
      refPattern: '^[A-Z]{1,4}-\d{4,10}$'
      apiVersion: '1.3'
      timeoutMs: 10000
      classes:
        # ⚠️ En mode ITIL, `Change` est ABSTRAITE : on CRÉE un NormalChange ou un
        # RoutineChange, mais on INTERROGE `Change` (la requête renvoie la sous-classe).
        # États réels de cette instance (lus dans le modèle de données 3.2.3-1) :
        #   new, validated, rejected, assigned, plannedscheduled, approved,
        #   notapproved, implemented, monitored, closed
        # Noter « plannedscheduled » et NON « planned » : exactement l'écart qui
        # condamnerait un code qui coderait les états en dur.
        #
        # C'EST ICI QUE SE RÈGLE LE DOSAGE (IT3). Le même code sert les trois
        # niveaux ; seule la requête change :
        NormalChange:
          # CAB : le changement n'est vert qu'APRÈS `ev_approve`. `plannedscheduled`
          # est volontairement EXCLU — dans le cycle ITIL il PRÉCÈDE l'approbation
          # (new → validated → assigned → plannedscheduled → approved). L'inclure
          # laisserait passer un changement planifié mais non encore approuvé.
          approvedWhen: >-
            SELECT Change WHERE ref = :ref
            AND status IN ('approved','implemented','monitored','closed')
        RoutineChange:
          # Changement standard PRÉ-APPROUVÉ : son cycle de vie ne passe même pas
          # par l'état `approved` (new → assigned → plannedscheduled → implemented).
          # Le feu vert, ici, c'est la prise en charge. Aucun code ne le sait :
          # c'est cette requête qui le dit.
          approvedWhen: >-
            SELECT Change WHERE ref = :ref
            AND status IN ('assigned','plannedscheduled','implemented','monitored','closed')
        UserRequest:
          approvedWhen: >-
            SELECT UserRequest WHERE ref = :ref
            AND status IN ('approved','assigned','resolved','closed')
      # IT5 — LE PORTIER. Sans `repos`, il est INACTIF : la plateforme se comporte
      # exactement comme avant. Le `context` est le nom du contrôle qui apparaît
      # sur la demande — c'est LUI qu'exigera la protection de branche.
      gate:
        context: itop
        frequencyMinutes: 5
        repos:
          - Younesic/portal-templates
          # Dépôt TÉMOIN public : la protection de branche y est disponible (elle
          # ne l'est pas sur un dépôt privé d'un plan gratuit — cf. §6 du brief).
          # Il ne contient aucune donnée réelle ; il sert à prouver que le contrôle
          # VERROUILLE vraiment le merge.
          - Younesic/itop-gate-demo
        # 1er groupe = l'OFFRE (on y lit sa politique), 2e = le nom de la demande.
        claimPathPattern: '^requests/([^/]+)/([^/]+)/claim\.ya?ml$'
        refAnnotation: platform.kratix.io/itop-ref
        # IT6 — contrôle DÉTECTIF : classe iTop des incidents ouverts quand une
        # demande a été fusionnée SANS contrôle au vert. Vide = contrôle inactif.
        # Contrepartie assumée du mur : tant que la protection de branche ne peut
        # pas s'appliquer, un merge non approuvé doit au moins se VOIR.
        incidentClass: Incident
        mergeLookbackDays: 7
        # Champs OBLIGATOIRES de la classe d'incident — ils varient d'un client à
        # l'autre (constaté : iTop refuse un Incident sans org_id). Ils viennent
        # donc de la configuration, jamais du code.
        incidentFields:
          org_id: { name: Plateforme }
        # Ne rien signaler AVANT l'activation du contrôle : les fusions
        # antérieures n'avaient aucun moyen d'être au vert. Les signaler serait un
        # faux positif de masse — et un contrôle qui crie pour rien est un contrôle
        # mort au bout d'une semaine.
        detectiveSince: '2026-07-26T17:00:00Z'

    backend:
      baseUrl: https://backstage.212-47-226-56.nip.io
      listen:
        port: 7007
        host: 0.0.0.0
      csp:
        connect-src: ["'self'", 'http:', 'https:']
        # G3 — logos produits/providers déclarés (spec.curation.logo-url → annotation
        # platform.kratix.io/logo-url) : la CSP par défaut de Backstage est img-src 'self' data:
        # → tout hôte EXTERNE est bloqué par le navigateur (le logo ne s'affiche pas). On ouvre
        # une ALLOWLIST SERRÉE (jamais img-src * ni https: large) : self + data: + Harbor (registre
        # self-hosted, hôte de confiance où les providers déposent leurs logos). Ajouter un hôte
        # = une ligne ici (miroir de kratixMarketplace.logo.allowedHosts côté plugin).
        img-src: ["'self'", 'data:', 'https://harbor.212-47-226-56.nip.io']
        # CF5 — Open Sans AUTO-HÉBERGÉ (packages/app/public/fonts, servi en 'self') : la police
        # est même-origine, aucun CDN. On déclare font-src explicitement (self + data:), jamais
        # d'hôte de police externe (règle sécurité web : self-host, pas de CDN runtime).
        font-src: ["'self'", 'data:']
      cors:
        origin: https://backstage.212-47-226-56.nip.io
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
      database:
        client: pg
        pluginDivisionMode: schema
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DATABASE}

    integrations:
      github:
        - host: github.com
          # BR16 — GitHub App « attijari-portal » (appId 4324425, installée sur
          # kratix-state/portal-templates/platform-gitops/backstage) : bucket
          # rate-limit DÉDIÉ par installation, séparé du compte user (le PAT
          # partagé s'épuisait — vécu). Backstage PRÉFÈRE l'App sur les repos
          # où elle est installée ; le token reste le FALLBACK (autres repos)
          # jusqu'à la révocation (étape 3 de BR16 — le proxy /github-api
          # devra alors être re-crédentialisé aussi).
          # App SEULE — MESURÉ (16:27Z) : avec apps+token configurés, l'UrlReader
          # prend le TOKEN (le bucket user encaissait la vague de processing).
          # Retirer le fallback force l'App ; un repo non couvert = erreur VISIBLE
          # au catalogue → le fix est d'installer l'App dessus (gouvernance).
          # (Le proxy /github-api garde SON token fine-grained via env, hors integrations.)
          apps:
            - $include: /app/github-app/github-app-credentials.yaml

    # aperçu de schéma pour le composer de présentation (dérive les champs d'une
    # source helm/crossplane À LA CRÉATION) — service in-cluster, reléguée derrière
    # le proxy authentifié (le navigateur ne joint pas un ClusterIP directement).
    proxy:
      endpoints:
        '/schema-derive':
          target: http://schema-derive.default.svc.cluster.local:8080
          allowedMethods: [POST]
          # défaut = exige un utilisateur Backstage authentifié (anti-SSRF) ;
          # le frontend attache l'identité via fetchApi.
        '/harbor':
          # Registry Helm : le Studio liste les charts/versions (picker OCI de Settings).
          # Lecture anonyme (projet platform PUBLIC) ; GET seul ; pas de secret exposé
          # → on lève l'exigence d'auth backstage du proxy (sinon 401 « Missing credentials »).
          target: https://harbor.212-47-226-56.nip.io
          allowedMethods: [GET]
          credentials: dangerously-allow-unauthenticated
          changeOrigin: true
        '/github-api':
          # API GitHub : le Studio liste les TAGS d'un repo (picker Crossplane de Settings).
          # Injecte le token plateforme (repos privés) → DOIT rester AUTHENTIFIÉ (défaut) :
          # sinon proxy ouvert qui prête le token. GET seul ; le frontend attache l'identité
          # backstage via fetchApi.
          target: https://api.github.com
          allowedMethods: [GET]
          changeOrigin: true
          headers:
            # BR16 : PAT fine-grained DÉDIÉ (attijari-portal-proxy — lecture seule,
            # 4 repos, exp. 90 j) ; le PAT classic n'est plus référencé nulle part.
            Authorization: token ${GITHUB_PROXY_TOKEN}
            Accept: application/vnd.github+json

        '/awx-api':
          # Le wizard Ansible du Studio propose les job templates et les inventaires
          # au lieu de les faire taper de mémoire (« jamais saisi de mémoire »).
          # DEUX verrous, pas un :
          #  · ici, GET seul et proxy AUTHENTIFIÉ (défaut) — le jeton n'est jamais
          #    prêté à un anonyme, le frontend attache l'identité via fetchApi ;
          #  · côté AWX, le jeton appartient à `portail-lecture` (auditeur système,
          #    portée `read`) : même si un POST passait, AWX répondrait 403 — vérifié.
          target: http://awx-service.awx.svc.cluster.local
          allowedMethods: [GET]
          changeOrigin: true
          headers:
            Authorization: Bearer ${AWX_API_TOKEN}

    # === Sign-in : Guest + Keycloak (les 2 cartes, comme en local) ===
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        guest: {}
        oidc:
          production:
            metadataUrl: https://keycloak.212-47-226-56.nip.io/realms/platform/.well-known/openid-configuration
            clientId: backstage
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            callbackUrl: https://backstage.212-47-226-56.nip.io/api/auth/oidc/handler/frame
            additionalScopes: groups
            signIn:
              resolvers:
                # One-identity : la session se résout par le USERNAME Keycloak
                # (preferred_username OIDC = le nom d'entité User projeté par
                # http-entities) — l'email n'a AUCUN rôle dans l'identité.
                # Résolveur CUSTOM du module local `oidcProvider.ts` (image
                # ≥ 20260722-0004) — les résolveurs stock de cette version sont
                # email-only, et un nom inconnu TUE le plugin auth au boot (vécu).
                - resolver: preferredUsernameMatchingUserEntityName
                # repli : emails de la forme username@… (utilisateurs pas encore
                # projetés au catalogue = échec BRUYANT — le flag dangerously* est
                # RETIRÉ : il fabriquait des sessions PENDANTES silencieuses
                # (vécu cloud_user : portail vide inexplicable).
                - resolver: emailLocalPartMatchingUserEntityName

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local

    catalog:
      # Modèle Syntasso PUSH : Backstage lit les Components que les WORKFLOWS Kratix poussent
      # dans kratix-state/backstage/ (Resource Configure -> Component du provisionné).
      # BR1 (2026-07-17) — ANTI-CHURN GitHub : chaque (re)processing d'une location github coûte
      # des appels API. À l'époque le catalogue lisait GitHub via le PAT plateforme (bucket 5000/h
      # PARTAGÉ au niveau du compte) → à 1-2 min le bucket s'épuisait (VÉCU : generate Studio en
      # 500) → cadences portées à 30 min.
      # 2026-07-21 — RAMENÉ À 1 MIN (demande user, itération rapide). SÛR désormais : depuis BR16
      # le catalogue lit GitHub via la GitHub App `attijari-portal` (limite 5000/h PROPRE à
      # l'installation, PAS le bucket PAT partagé) → le churn du catalogue n'affecte plus le PAT.
      # NB : les PROVIDERS github (kratixCatalog, portalSquads) restent à 30/10 min ci-dessous
      # (dis-le si tu veux aussi les baisser). Pour un one-shot immédiat, nudge en base :
      #   update catalog.refresh_state set next_update_at=now() where entity_ref like 'location:%';
      processingInterval: { minutes: 1 }
      providers:
        github:
          kratixCatalog:
            organization: Younesic
            # ANCRÉ sur le sous-dossier backstage/ écrit par le conteneur push :
            #   resources/…    (Resource Configure -> fiches Component+Resource)
            #   dependencies/… (Promise Configure  -> Templates poussés)
            # ⚠️ Kratix écrit aussi ses CANARIES (kratix-canary-{namespace,configmap}.yaml,
            # manifestes k8s bruts) sous backstage/ — un glob trop large les matche, le
            # catalogue les rejette (kind Namespace/ConfigMap interdit) et TOUTE la
            # location tombe en erreur -> plus AUCUNE ingestion depuis kratix-state.
            # Le squelette de claim (skeleton/claim.yaml) est lui aussi hors-glob à dessein.
            catalogPath: /backstage/*/**/backstage/*.yaml
            filters:
              repository: kratix-state
            schedule:
              # BR1 : 1 min -> 30 min (le scan par minute était le 1er brûleur du bucket)
              frequency: { minutes: 30 }
              timeout: { minutes: 2 }
          # G2 — GROUPES d'org déclarés (Portal, produit « Create Group ») : Groups NATIFS typés
          # <type>-<slug> (organization|department|domain|tribe|squad) poussés en PR sous
          # portal-templates/groups/<type>-<slug>/catalog-info.yaml, ingérés ICI après merge
          # (= décision d'admission). NON-Kratix. spec.parent → hiérarchie native au catalogue.
          # Ref <type>-<slug> ≠ team-<slug> → pas de collision avec la projection Keycloak (O2).
          portalSquads:
            organization: Younesic
            catalogPath: /groups/**/catalog-info.yaml
            filters:
              repository: portal-templates
            schedule:
              # BR1 : 2 min -> 30 min (même trade-off fraîcheur/quota que kratixCatalog)
              frequency: { minutes: 30 }
              timeout: { minutes: 2 }
        # Connecteur UNIVERSEL http-entities (module local du backend) : chaque
        # source de données = UN BLOC DE CONFIG (url + auth + mapping gabarits),
        # JAMAIS du code — Keycloak n'est que la première source ; AD/Harbor/API
        # client = un bloc de plus ici. Creds via env (SealedSecret
        # backstage-http-entities). NB : config lue au boot → rollout au changement.
        httpEntities:
          keycloakUsers:
            # briefRepresentation=false : renvoie les ATTRIBUTS du user (dont `tech-lead`,
            # projeté en annotation ci-dessous — gate SL2, même mécanisme que le rôle O2).
            url: https://keycloak.212-47-226-56.nip.io/admin/realms/platform/users?max=500&briefRepresentation=false
            auth:
              type: oauth2ClientCredentials
              tokenUrl: https://keycloak.212-47-226-56.nip.io/realms/master/protocol/openid-connect/token
              clientId: ${HTTP_ENTITIES_KC_CLIENT_ID}
              clientSecret: ${HTTP_ENTITIES_KC_CLIENT_SECRET}
            entity:
              kind: User
              name: '{username}'
              title: '{firstName} {lastName}'
              # SL2 — statut tech-lead PROJETÉ depuis l'attribut Keycloak (stocké en TABLEAU
              # → index .0) vers l'annotation lue par la permission-policy. Attribut absent
              # → gabarit '' → annotation OMISE (le module skip les vides : non-régression).
              annotations:
                platform.kratix.io/tech-lead: '{attributes.tech-lead.0}'
            schedule:
              frequency: { minutes: 10 }
              timeout: { minutes: 2 }
          keycloakGroups:
            # briefRepresentation=false : sinon Keycloak ne renvoie PAS les attributs
            # du groupe (dont `role`, posé par la promesse keycloak-group — onboarding O1).
            url: https://keycloak.212-47-226-56.nip.io/admin/realms/platform/groups?max=200&briefRepresentation=false
            auth:
              type: oauth2ClientCredentials
              tokenUrl: https://keycloak.212-47-226-56.nip.io/realms/master/protocol/openid-connect/token
              clientId: ${HTTP_ENTITIES_KC_CLIENT_ID}
              clientSecret: ${HTTP_ENTITIES_KC_CLIENT_SECRET}
            # Sous-ressource Keycloak : les MEMBRES du groupe. Rangés sous
            # _expand.members, projetés en Group.spec.members (slugifiés pour matcher
            # les User.name émis par la source keycloakUsers) → Backstage dérive les
            # relations memberOf sur les users → ownershipEntityRefs (base du RBAC).
            expand:
              members:
                url: https://keycloak.212-47-226-56.nip.io/admin/realms/platform/groups/{id}/members?max=500
            entity:
              kind: Group
              name: '{name}'
              # rôle de gouvernance PROJETÉ depuis l'attribut Keycloak (stocké en TABLEAU
              # → index .0) vers l'annotation lue par la permission-policy (onboarding O3).
              # Gabarit vide (groupe sans rôle) → annotation OMISE (module : skip si vide).
              annotations:
                platform.kratix.io/role: '{attributes.role.0}'
              specLists:
                members:
                  path: _expand.members
                  template: '{username}'
                  slugify: true
            schedule:
              frequency: { minutes: 10 }
              timeout: { minutes: 2 }
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Domain, Group, User]
      # (les locations examples/* du scaffold ont été retirées : absentes de l'image,
      # elles échouaient en NotFoundError à chaque cycle de processing)
      locations:
        # CT4 (loi 6, fusion usageHints→contrats) : le template promote-usage-hint est
        # RETIRÉ des surfaces — « en faire la règle » passe par POST /kratix-studio/
        # promote-contract (PR de contrat sur le claim cible). Le fichier template et
        # l'action backend restent une itération (sunset propre, rien ne les référence).
        # SL1 — provider Portal (Group natif) + produit « Déclarer une squad » (Template natif).
        - type: url
          target: https://github.com/Younesic/platform-gitops/blob/main/bootstrap/manifests/backstage/templates/team-portal.yaml
          rules:
            - allow: [Group]
        - type: url
          target: https://github.com/Younesic/platform-gitops/blob/main/bootstrap/manifests/backstage/templates/declare-squad.yaml
          rules:
            - allow: [Template]
        # SL3 — produit « Onboarder une squad » (Portal, gated tech-lead).
        - type: url
          target: https://github.com/Younesic/platform-gitops/blob/main/bootstrap/manifests/backstage/templates/onboard-squad.yaml
          rules:
            - allow: [Template]

        # SL5/BR8 — produit « Offboarder une squad » (Platform, gated tech-lead, miroir).
        - type: url
          target: https://github.com/Younesic/platform-gitops/blob/main/bootstrap/manifests/backstage/templates/offboard-squad.yaml
          rules:
            - allow: [Template]

    kubernetes:
      serviceLocatorMethod: { type: multiTenant }
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: k8s-for-kratix
              title: Plateforme
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              skipMetricsLookup: true
      # Types PAR DÉFAUT fetchés par l'onglet Kubernetes, restreints à ce que le SA
      # backstage-readonly sait lister (sinon 403 -> carte « Error Reporting » sur chaque
      # fiche). Exclus À DESSEIN : secrets (sensible), persistentvolume(claim)s,
      # horizontalpodautoscalers (pas de RBAC).
      objectTypes:
        - pods
        - services
        - configmaps
        - limitranges
        - resourcequotas
        - deployments
        - replicasets
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
        - ingresses
      # customResources : GÉNÉRÉS automatiquement — voir la ConfigMap
      # backstage-config-dynamic (2e fichier --config du backend), régénérée par
      # le CronJob backstage-customresources-sync depuis les CRDs des familles
      # plateforme (nouvelle promesse => kind détecté => restart auto ssi la liste
      # change). NE PAS redéclarer customResources ici : les tableaux de config
      # sont REMPLACÉS par le dernier fichier, pas fusionnés.
      # NB : le plugin EXIGE un group non-vide -> les ressources CORE (group "" :
      # namespaces, resourcequotas) ne peuvent PAS y figurer.

    # === INGESTOR : Templates depuis les CRD (Brique A) + claims en entités (Brique B) ===
    kubernetesIngestor:
      # Niveau 3 (le provisionné) : on INGÈRE le claim en Component type kratix-resource (watch,
      # status live). Pas de conteneur push -> pas de doublon. La page ADAPTÉE vient de
      # EntityPage.tsx : isComponentType('kratix-resource') -> plugin kubernetes-resources (graphe).
      components:
        enabled: false
        disableDefaultWorkloadTypes: true
        customWorkloadTypes:
          - { group: platform.example.io, apiVersion: v1alpha1, plural: workspaces, defaultType: kratix-resource }
        excludedNamespaces: [kube-system, kube-public]
        taskRunner: { frequency: 30, timeout: 600 }
      genericCRDTemplates:
        # AUTO-DÉCOUVERTE : toute promesse dont la CRD porte ce label -> Template automatiquement.
        # Kratix propage le label depuis promise.spec.api.metadata.labels. Zéro edit par promesse.
        crdLabelSelector:
          key: platform.example.io/portal
          value: "true"
        publishPhase:
          target: github
          allowRepoSelection: false
          allowedTargets: ['github.com']
          git:
            repoUrl: github.com?owner=Younesic&repo=portal-templates
            targetBranch: main

    permission:
      enabled: true
