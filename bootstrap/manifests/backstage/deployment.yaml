apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels: { app: backstage }
  template:
    metadata:
      labels: { app: backstage }
      annotations:
        # redéploie quand l'app-config change (hash injecté par ArgoCD via le ConfigMap)
        configmap-revision: v25
    spec:
      serviceAccountName: backstage
      priorityClassName: platform-high
      containers:
        - name: backstage
          image: harbor.212-47-226-56.nip.io/platform/backstage:20260803-0003@sha256:21986d71a79e7c159e578a78b2579c4c09d0c708b1e222234d31bcab8d8cd3f3
          imagePullPolicy: IfNotPresent
          command: ["node", "packages/backend"]
          # 2e fichier = config DYNAMIQUE (customResources générés par le CronJob
          # backstage-customresources-sync ; les tableaux du dernier fichier GAGNENT)
          args: ["--config", "/app/config/app-config.yaml", "--config", "/app/config-dynamic/app-config.dynamic.yaml"]
          ports:
            - { name: http, containerPort: 7007 }
          env:
            # --- DB (CNPG) ---
            - { name: POSTGRES_HOST, value: backstage-db-rw }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_DATABASE, value: backstage }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: backstage-db-app, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: backstage-db-app, key: password } }
            # --- backend service auth (backstage-platform attend BACKEND_SECRET) ---
            - name: BACKEND_SECRET
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: BACKEND_AUTH_KEY } }
            - name: AUTH_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: AUTH_SESSION_SECRET } }
            # --- OIDC (Keycloak realm platform, client backstage) ---
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: backstage-oidc-client, key: attribute.client_secret } }
            # --- GitHub (BR16 : App = charge ; fine-grained RO = proxy + fallback ;
            #     le PAT classic n'est PLUS référencé -> révocable) ---
            - name: GITHUB_PROXY_TOKEN
              valueFrom: { secretKeyRef: { name: backstage-secrets, key: GITHUB_PROXY_TOKEN } }
            # --- AWX (proxy /awx-api) : jeton de LECTURE de `portail-lecture`,
            #     fabriqué DANS le cluster par awx/12-jeton-portail.yaml et jamais
            #     affiché. ⚠️ Le secret doit exister AVANT ce câblage, sinon la
            #     substitution de config échoue et le portail ne démarre pas. ---
            - name: AWX_API_TOKEN
              valueFrom: { secretKeyRef: { name: awx-portal-token, key: token } }
            # --- connecteur http-entities (sources catalogue config-driven) ---
            - name: HTTP_ENTITIES_KC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: backstage-http-entities, key: clientId } }
            - name: HTTP_ENTITIES_KC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: backstage-http-entities, key: clientSecret } }
            # --- iTop (couche d'approbation ITSM) ---
            # Le compte est svc-portal : MOINDRE PRIVILÈGE (REST Services User +
            # Service Desk Agent + Change Supervisor), jamais l'administrateur.
            # Son mot de passe est recopié depuis le namespace itop par le hook
            # PreSync backstage-itop-credentials — il ne transite jamais par Git.
            - { name: ITOP_BASE_URL, value: "http://itop.itop.svc.cluster.local" }
            - { name: ITOP_USER,     value: "svc-portal" }
            - name: ITOP_PASSWORD
              valueFrom: { secretKeyRef: { name: itop-portal, key: ITOP_PASSWORD } }
            - { name: NODE_OPTIONS, value: --no-node-snapshot }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: backstage-config, mountPath: /app/config, readOnly: true }
            - { name: backstage-config-dynamic, mountPath: /app/config-dynamic, readOnly: true }
            # BR16 — credentials de la GitHub App (secret MANUEL backstage-github-app,
            # pattern des creds bootstrap) : consommé par $include de l'app-config.
            - { name: github-app, mountPath: /app/github-app, readOnly: true }
            # LG7 — le jeton d'org (rotatif, 1 h) lu en FICHIER par le connecteur
            # d'inventaire (auth bearerFile) : kubelet rafraîchit le montage ~1 min,
            # là où une variable d'env serait figée au boot et morte à l'expiration.
            - { name: github-org-token, mountPath: /app/github-org-token, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthcheck, port: 7007 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthcheck, port: 7007 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: backstage-config
          configMap:
            name: backstage-config
            items:
              - { key: app-config.yaml, path: app-config.yaml }
        - name: backstage-config-dynamic
          configMap:
            name: backstage-config-dynamic
            items:
              - { key: app-config.dynamic.yaml, path: app-config.dynamic.yaml }
        - name: github-app
          secret:
            secretName: backstage-github-app
        - name: github-org-token
          secret:
            secretName: github-app-token-org
            # optionnel : le pod doit pouvoir naître AVANT la première frappe —
            # la source d'inventaire échouera proprement (isolée), pas le portail.
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  selector: { app: backstage }
  ports:
    - { name: http, port: 80, targetPort: 7007 }
