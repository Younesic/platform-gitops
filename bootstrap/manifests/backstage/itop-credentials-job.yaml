# Le PORTAIL récupère l'identifiant de son compte de service iTop.
#
# Deux namespaces ont besoin du même secret, et on refuse de le faire transiter :
# il est donc RECOPIÉ dans le cluster, par fichier, sans jamais passer par une
# variable ni un affichage. Même geste que pour la liaison LDAP d'iTop, en miroir :
#   · iTop DÉTIENT le secret et accorde `get` dessus (manifests/itop/07-rbac-portail.yaml)
#   · le portail, CONSOMMATEUR, l'amorce chez lui
#
# Hook PreSync : le Deployment du portail monte ce Secret, il doit exister avant.
# Le RBAC est un hook de vague inférieure — sinon il serait appliqué en phase Sync,
# c'est-à-dire APRÈS le Job qui en a besoin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-itop-bootstrap
  namespace: backstage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-itop-bootstrap
  namespace: backstage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  # `get` pour constater, `create` pour amorcer. Pas d'`update`, pas de `delete` :
  # un second passage ne PEUT PAS écraser un identifiant en service.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-itop-bootstrap
  namespace: backstage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: backstage-itop-bootstrap }
subjects:
  - { kind: ServiceAccount, name: backstage-itop-bootstrap, namespace: backstage }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-itop-credentials
  namespace: backstage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: backstage-itop-credentials } }
    spec:
      restartPolicy: Never
      serviceAccountName: backstage-itop-bootstrap
      containers:
        - name: bootstrap
          image: alpine/k8s:1.35.3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              if kubectl -n backstage get secret itop-portal >/dev/null 2>&1; then
                echo "itop-portal : déjà présent → intact (idempotent)."
                exit 0
              fi
              # iTop peut ne pas être encore déployé (premier amorçage d'un cluster
              # neuf) : on patiente, puis on échoue BRUYAMMENT plutôt que de laisser
              # le portail démarrer sans savoir parler à l'ITSM.
              i=0
              until kubectl -n itop get secret itop-credentials >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -gt 24 ] && {
                  echo "ERREUR : secret itop/itop-credentials illisible après 2 minutes."
                  echo "         (le RoleBinding itop-portal-reader vient de manifests/itop/)"
                  exit 1
                }
                sleep 5
              done
              umask 077
              kubectl -n itop get secret itop-credentials \
                -o jsonpath='{.data.ITOP_REST_PASSWORD}' | base64 -d > /tmp/pwd
              [ -s /tmp/pwd ] || { echo "ERREUR : mot de passe du compte de service vide."; exit 1; }
              kubectl -n backstage create secret generic itop-portal \
                --from-file=ITOP_PASSWORD=/tmp/pwd >/dev/null
              rm -f /tmp/pwd
              echo "itop-portal : créé (1 clé, aucune valeur affichée)."
