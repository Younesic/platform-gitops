# ── AU2 : LA PROMESSE TÉMOIN DU ROUTAGE PAR NIVEAU (PORTE — jetable) ────────────
#
# ÉCRITE À LA MAIN, exprès (discipline LG2/TN3) : AU2 prouve que le ROUTAGE tient
# AVANT de toucher la fabrique (l'industrialisation = AU5). Elle rend UNE ConfigMap —
# l'objet le plus inoffensif possible : la preuve porte sur OÙ elle atterrit et SI
# elle est appliquée, pas sur ce qu'elle fait.
#
# ⚠️ TÉMOIN JETABLE : à retirer en fin de preuve AU2 (claims d'abord, promesse ensuite
# — l'ordre anti-deadlock). Les Destinations et Applications, elles, RESTENT : c'est
# l'infrastructure du set.
#
# ⚠️ LA DÉCOUVERTE QUI A DESSINÉ CE PIPELINE : le SDK `write_destination_selectors`
# ÉCRASE le fichier (`open("w")` — kratix_sdk.py:126) et bc l'appelle pour router ses
# fiches vers la Destination backstage. Un selector écrit AVANT bc serait donc PERDU.
# D'où TROIS conteneurs : rendu → bc → ROUTEUR (qui RELIT le fichier laissé par bc et
# COMPLÈTE — la cohabitation que le DoD (d) exige de prouver).
#
# ⚠️ AUCUN destinationSelectors AU NIVEAU PROMISE : un pin Promise est INOVERRIDABLE
# par le workflow (précédence Kratix, leçon RT1 payée avec `environment`). Le routage
# vit ENTIÈREMENT dans le workflow resource — c'est le principe même d'AU2.
apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: routage-temoin
  labels:
    kratix.io/promise-version: v0.1.0
  annotations:
    platform.kratix.io/provider: platform
    platform.kratix.io/exposure: internal   # pas un produit : un banc d'essai
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: routagetemoins.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: RoutageTemoin
        plural: routagetemoins
        singular: routagetemoin
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [observe, gouverne, gere]
                      default: gere
                      description: Niveau d'adoption (contrat ADOPTION-STANDARD §1).

  workflows:
    config: {}
    promise:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: promise-configure
          spec:
            containers:
              - name: backstage
                image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:7fa2fb3c168a5d1efdebbbaa222391be61fb2a8f4ddb88f46189307cedee82d7

    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: instance-configure
          spec:
            containers:
              # 1) LE RENDU — la ConfigMap témoin, rien d'autre.
              - name: rendu
                image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:091cefad85a9bf74175f23e070a1e00edba05b447eac079193b299eefbc35ec4
                command: [python, -c]
                args:
                  - |
                    import pathlib, yaml
                    o = yaml.safe_load(pathlib.Path("/kratix/input/object.yaml").read_text())
                    nom = o["metadata"]["name"]
                    mode = str((o.get("spec") or {}).get("mode") or "gere")
                    cm = {"apiVersion": "v1", "kind": "ConfigMap",
                          "metadata": {"name": f"temoin-{nom}", "namespace": "default"},
                          "data": {"mode": mode, "claim": nom}}
                    pathlib.Path("/kratix/output/configmap.yaml").write_text(
                        yaml.safe_dump(cm, sort_keys=False))
                    print(f"rendu : ConfigMap temoin-{nom} (mode={mode})")

              # 2) bc — les fiches catalogue + SON entrée de routage (qui ÉCRASE le fichier).
              - name: backstage
                image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:7fa2fb3c168a5d1efdebbbaa222391be61fb2a8f4ddb88f46189307cedee82d7

              # 3) LE ROUTEUR — APRÈS bc : relit ses selectors, COMPLÈTE avec le niveau.
              #    Mode observe/gouverne → {adoption: <mode>} SEUL (voir le
              #    commentaire des Destinations) ; mode gere → {environment: platform}
              #    → worker-1 (explicite, mieux que le tirage des works sans selectors).
              - name: routeur
                image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:091cefad85a9bf74175f23e070a1e00edba05b447eac079193b299eefbc35ec4
                command: [python, -c]
                args:
                  - |
                    import pathlib, yaml
                    o = yaml.safe_load(pathlib.Path("/kratix/input/object.yaml").read_text())
                    mode = str((o.get("spec") or {}).get("mode") or "gere")
                    p = pathlib.Path("/kratix/metadata/destination-selectors.yaml")
                    entrees = yaml.safe_load(p.read_text()) if p.exists() else []
                    if not isinstance(entrees, list):
                        entrees = []
                    # ⚠️ La clé adoption SEULE pour observe/gouverne : la correspondance
                    # est par sous-ensemble — ajouter environment ferait AUSSI matcher
                    # worker-1... et inversement, une entrée environment+adoption ne
                    # matcherait plus les destinations d'adoption (qui ne portent QUE
                    # adoption). Constaté à la porte, pas supposé.
                    labels = {"adoption": mode} if mode in ("observe", "gouverne") \
                        else {"environment": "platform"}
                    entrees.append({"directory": "", "matchLabels": labels})
                    p.parent.mkdir(parents=True, exist_ok=True)
                    p.write_text(yaml.safe_dump(entrees, sort_keys=False))
                    print("selectors finaux :", entrees)
            rbac: {}
            jobOptions: {}
