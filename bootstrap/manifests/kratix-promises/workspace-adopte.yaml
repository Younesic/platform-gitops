# ── AU3 : LA PROMESSE PILOTE DE L'ADOPTION HELM (PORTE — jetable) ───────────────
#
# ÉCRITE À LA MAIN, exprès (discipline LG2/AU2) : AU3 prouve qu'un Kubernetes
# EXISTANT (namespace/quota/RBAC posés main) s'adopte par la couche ArgoCD d'AU2 —
# diff sans création en Observé, reprise EN PLACE (UID inchangés) à la promotion,
# rien détruit à la rétrogradation. L'industrialisation = AU5 (la fabrique).
#
# La LIAISON helm = la CONVENTION DE NOMS : les values (team, environment)
# déterminent les noms que le chart rend — mêmes noms = même objet. Pas d'import_id.
#
# ⚠️ NOM DISTINCT de la promesse workspace de prod (collision de fiches payée 2×).
# ⚠️ AUCUN destinationSelectors au niveau Promise (un pin Promise est INOVERRIDABLE
#    — leçon RT1 ; la promesse workspace de prod pinne {environment: platform},
#    c'est EXACTEMENT ce que le témoin ne doit pas reproduire).
# ⚠️ Le champ `mode` traverse les values (le renderer passe le spec ENTIER) :
#    values.schema.json du chart 0.2.3 est TOLÉRANT (pas d'additionalProperties:
#    false) — constaté au helm template local AVANT d'écrire ce fichier.
apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: workspace-adopte
  labels:
    kratix.io/promise-version: v0.1.0
  annotations:
    platform.kratix.io/provider: platform
    platform.kratix.io/exposure: internal   # banc d'essai, pas un produit
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: workspaceadoptes.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: WorkspaceAdopte
        plural: workspaceadoptes
        singular: workspaceadopte
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [team, environment]
                  properties:
                    # miroir de values.schema.json 0.2.3 — le contrat du chart
                    team:
                      type: string
                      pattern: ^[a-z][a-z0-9-]*$
                    environment:
                      type: string
                      enum: [dev, staging, prod]
                    tier:
                      type: string
                      enum: [small, standard, large, restricted]
                      default: standard
                    mode:
                      type: string
                      enum: [observe, gouverne, gere]
                      default: gere
                      description: Niveau d'adoption (contrat ADOPTION-STANDARD §1).

  workflows:
    config: {}
    promise:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: promise-configure
          spec:
            containers:
              - name: backstage
                image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:7fa2fb3c168a5d1efdebbbaa222391be61fb2a8f4ddb88f46189307cedee82d7

    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: instance-configure
          spec:
            containers:
              # 1) LE RENDU — le renderer helm OFFICIEL, celui de la promesse
              #    workspace de prod (même image, même chart 0.2.3) : le pilote
              #    adopte avec l'outillage réel, pas un simulacre.
              - name: instance-configure
                image: ghcr.io/syntasso/kratix-cli/helm-resource-configure:v0.2.0
                env:
                  - name: CHART_URL
                    value: oci://harbor.212-47-226-56.nip.io/platform/workspace
                  - name: CHART_VERSION
                    value: "0.2.3"

              # 2) bc — fiches catalogue + labels kubernetes-id/owner + SON entrée
              #    de selectors (qui ÉCRASE le fichier — d'où le routeur APRÈS).
              - name: backstage
                image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:7fa2fb3c168a5d1efdebbbaa222391be61fb2a8f4ddb88f46189307cedee82d7

              # 3) ROUTEUR + CEINTURE — après bc :
              #    · ceinture `Prune=false,Delete=false` sur CHAQUE objet k8s rendu
              #      (offre d'ADOPTION → ceinture QUEL QUE SOIT le mode, contrat §3 —
              #      la rétrogradation sans ceinture DÉTRUIT, constaté AU2) ;
              #    · selectors : {adoption: <mode>} SEUL pour observe/gouverne
              #      (correspondance par sous-ensemble — leçon AU2), sinon
              #      {environment: platform} → worker-1.
              - name: routeur
                image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:091cefad85a9bf74175f23e070a1e00edba05b447eac079193b299eefbc35ec4
                command: [python, -c]
                args:
                  - |
                    import pathlib, yaml
                    o = yaml.safe_load(pathlib.Path("/kratix/input/object.yaml").read_text())
                    mode = str((o.get("spec") or {}).get("mode") or "gere")

                    # — la ceinture, sur les sorties k8s (jamais backstage/) —
                    out = pathlib.Path("/kratix/output")
                    for f in out.rglob("*.yaml"):
                        if "backstage" in f.parts[len(out.parts):]:
                            continue
                        docs = [d for d in yaml.safe_load_all(f.read_text()) if d]
                        for d in docs:
                            meta = d.setdefault("metadata", {})
                            ann = meta.setdefault("annotations", {})
                            ann["argocd.argoproj.io/sync-options"] = "Prune=false,Delete=false"
                        f.write_text(yaml.safe_dump_all(docs, sort_keys=False))
                        print(f"ceinture posée : {f.name} ({len(docs)} doc(s))")

                    # — le routage par le mode (append APRÈS bc, jamais deux écrivains) —
                    p = pathlib.Path("/kratix/metadata/destination-selectors.yaml")
                    entrees = yaml.safe_load(p.read_text()) if p.exists() else []
                    if not isinstance(entrees, list):
                        entrees = []
                    labels = {"adoption": mode} if mode in ("observe", "gouverne") \
                        else {"environment": "platform"}
                    entrees.append({"directory": "", "matchLabels": labels})
                    p.parent.mkdir(parents=True, exist_ok=True)
                    p.write_text(yaml.safe_dump(entrees, sort_keys=False))
                    print("selectors finaux :", entrees)
            rbac: {}
            jobOptions: {}
