apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  labels:
    # ⚠️ NE PAS BUMPER : `requiredPromises` exige l'ÉGALITÉ STRICTE de version
    # (vérifié au source, gravé au CLAUDE.md — « vide = any » n'existe pas ici).
    # Un bump ici rend teamaccess → teamspace/harbor-project Unavailable EN CASCADE
    # (vécu 2026-07-31 en AU4 : le contrat étendu, lui, n'a pas besoin d'un numéro).
    kratix.io/promise-version: v0.0.1
  name: keycloak-group
  annotations:
    platform.kratix.io/status-schema: '{"groupId": {"path": ".status.groupId", "label": "UUID Keycloak
      du groupe créé (status.atProvider.id).", "type": "string"}}'
    platform.kratix.io/contracts: '{"provides": [{"kind": "keycloak-group", "name": "${spec.group}", "defaultName":
      "team-${spec.team}", "severity": "suggest", "origin": "source"}]}'
    platform.kratix.io/exposure: internal
    platform.kratix.io/provider: identity
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: keycloakgroups.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: KeycloakGroup
        plural: keycloakgroups
        singular: keycloakgroup
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: Nom du groupe Keycloak géré par la plateforme (ex. team-vente).
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  realm:
                    default: platform
                    description: Realm Keycloak.
                    type: string
                  role:
                    description: Rôle de gouvernance de la squad (posé en attribut du groupe Keycloak,
                      lu par le RBAC portail). Omis = pas d'attribut.
                    enum:
                    - consumer
                    - provider
                    type: string
                  liaison:
                    type: string
                    maxLength: 63
                    description: ADOPTION — identifiant de l'élément EXISTANT à lier (UUID du groupe Keycloak).
                      Omis = création classique.
                  mode:
                    type: string
                    enum:
                    - observe
                    - gere
                    default: gere
                    description: 'Niveau d''adoption. observe = « La plateforme voit l''état réel et la
                      dérive ; elle ne modifie rien, par construction. » · gere = « La plateforme est
                      la source de vérité : elle détecte la dérive et y ramène l''état. » ⚠️ Le niveau
                      Gouverné n''est pas offert sur ce moteur (le provider crossplane converge seul —
                      règle « rien ne converge sans déclenchement humain », ADOPTION-STANDARD §4).'
                required:
                - group
                type: object
                x-kubernetes-validations:
                - rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison) && self.liaison
                    != '''')'
                  message: 'le niveau Observé se LIE à un existant : renseigner liaison (UUID du groupe).'
              status:
                properties:
                  groupId:
                    description: UUID Keycloak du groupe créé (status.atProvider.id).
                    type: string
                type: object
            type: object
        served: true
        storage: true
    status:
      acceptedNames:
        kind: ''
        plural: ''
      conditions: null
      storedVersions: null
  dependencies:
  - apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
    metadata:
      name: xkeycloakgroup-keycloak
    spec:
      compositeTypeRef:
        apiVersion: crossplane.platform.example.io/v1alpha1
        kind: XKeycloakGroup
      mode: Pipeline
      pipeline:
      - functionRef:
          name: function-patch-and-transform
        input:
          apiVersion: pt.fn.crossplane.io/v1beta1
          kind: Resources
          resources:
          - base:
              apiVersion: group.keycloak.m.crossplane.io/v1alpha1
              kind: Group
              spec:
                forProvider:
                  realmId: platform
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            name: group
            patches:
            - fromFieldPath: spec.group
              toFieldPath: metadata.name
              transforms:
              - string:
                  fmt: kc-group-%s
                  type: Format
                type: string
              type: FromCompositeFieldPath
            - fromFieldPath: spec.group
              toFieldPath: spec.forProvider.name
              type: FromCompositeFieldPath
            - fromFieldPath: metadata.name
              toFieldPath: metadata.labels['backstage.io/kubernetes-id']
              type: FromCompositeFieldPath
            - fromFieldPath: spec.realm
              toFieldPath: spec.forProvider.realmId
              type: FromCompositeFieldPath
            - fromFieldPath: spec.role
              policy:
                fromFieldPath: Optional
              toFieldPath: spec.forProvider.attributes.role
              type: FromCompositeFieldPath
            - type: CombineFromComposite
              combine:
                strategy: string
                string:
                  fmt: '%s|%s'
                variables:
                - fromFieldPath: spec.mode
                - fromFieldPath: spec.liaison
              toFieldPath: spec.managementPolicies
              transforms:
              - type: match
                match:
                  patterns:
                  - type: regexp
                    regexp: ^observe\|.*
                    result:
                    - Observe
                  - type: regexp
                    regexp: ^gere\|.+
                    result:
                    - Observe
                    - Create
                    - Update
                    - LateInitialize
                  fallbackValue:
                  - '*'
                  fallbackTo: Value
            - type: FromCompositeFieldPath
              fromFieldPath: spec.liaison
              toFieldPath: metadata.annotations[crossplane.io/external-name]
              policy:
                fromFieldPath: Optional
            - fromFieldPath: status.atProvider.id
              toFieldPath: status.groupId
              type: ToCompositeFieldPath
        step: patch-and-transform
  - apiVersion: apiextensions.crossplane.io/v2
    kind: CompositeResourceDefinition
    metadata:
      annotations:
        platform.kratix.io/contracts: '{"provides":[{"kind":"keycloak-group","name":"${spec.group}","defaultName":"team-${spec.team}","severity":"suggest"}]}'
      name: xkeycloakgroups.crossplane.platform.example.io
    spec:
      group: crossplane.platform.example.io
      names:
        kind: XKeycloakGroup
        plural: xkeycloakgroups
      scope: Namespaced
      versions:
      - name: v1alpha1
        referenceable: true
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: Nom du groupe Keycloak géré par la plateforme (ex. team-vente).
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  realm:
                    default: platform
                    description: Realm Keycloak.
                    type: string
                  role:
                    description: Rôle de gouvernance de la squad (posé en attribut du groupe Keycloak,
                      lu par le RBAC portail). Omis = pas d'attribut.
                    enum:
                    - consumer
                    - provider
                    type: string
                  liaison:
                    type: string
                    maxLength: 63
                    description: ADOPTION — identifiant de l'élément EXISTANT à lier (UUID du groupe Keycloak).
                      Omis = création classique.
                  mode:
                    type: string
                    enum:
                    - observe
                    - gere
                    default: gere
                    description: 'Niveau d''adoption. observe = « La plateforme voit l''état réel et la
                      dérive ; elle ne modifie rien, par construction. » · gere = « La plateforme est
                      la source de vérité : elle détecte la dérive et y ramène l''état. » ⚠️ Le niveau
                      Gouverné n''est pas offert sur ce moteur (le provider crossplane converge seul —
                      règle « rien ne converge sans déclenchement humain », ADOPTION-STANDARD §4).'
                required:
                - group
                type: object
                x-kubernetes-validations:
                - rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison) && self.liaison
                    != '''')'
                  message: 'le niveau Observé se LIE à un existant : renseigner liaison (UUID du groupe).'
              status:
                properties:
                  groupId:
                    description: UUID Keycloak du groupe créé (status.atProvider.id).
                    type: string
                type: object
            type: object
        served: true
  destinationSelectors:
  - matchLabels:
      environment: platform
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:6593b04b050f902e17a62ff06042f5185f21d2c2a8f1d37da9bd822afb875f41
            name: backstage
            env:
            - name: CONTRACTS_REV
              value: 59e32cc2a610
            - name: CURATION_REV
              value: 51b01245bae8
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - env:
            - name: XRD_GROUP
              value: crossplane.platform.example.io
            - name: XRD_VERSION
              value: v1alpha1
            - name: XRD_KIND
              value: XKeycloakGroup
            image: ghcr.io/syntasso/kratix-cli/from-api-to-crossplane-claim:v0.2.2
            name: from-api-to-crossplane-claim
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:6593b04b050f902e17a62ff06042f5185f21d2c2a8f1d37da9bd822afb875f41
            name: backstage
          jobOptions: {}
          rbac: {}
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
