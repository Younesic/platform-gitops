apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  annotations:
    # ADOPTION-STANDARD 3bis : porteur de la non-destruction d'un adopte.
    platform.kratix.io/adoption-non-destruction: moteur
    platform.kratix.io/adoptable: 'true'
    platform.kratix.io/status-schema: "{\"groupId\": {\"path\": \".status.groupId\"\
      , \"label\": \"UUID Keycloak du groupe cr\xE9\xE9 (status.atProvider.id).\"\
      , \"type\": \"string\"}}"
    platform.kratix.io/contracts: '{"provides": [{"kind": "keycloak-group", "name":
      "${spec.group}", "defaultName": "team-${spec.team}", "severity": "suggest",
      "origin": "source"}]}'
    backstage.example.io/ui-schema: "{\"properties\":{\"liaison\":{\"ui:title\":\"\
      \xC9l\xE9ment existant \xE0 lier\",\"ui:description\":\"Vide = cr\xE9ation classique.\
      \ En Observ\xE9, rien n'est modifi\xE9 : la plateforme lit et compare.\"}},\"\
      ui:order\":[\"mode\",\"liaison\",\"*\"]}"
    platform.kratix.io/exposure: internal
    platform.kratix.io/provider: identity
  labels:
    kratix.io/promise-version: v0.0.1
  name: keycloak-group
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: keycloakgroups.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: KeycloakGroup
        plural: keycloakgroups
        singular: keycloakgroup
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: "Nom du groupe Keycloak g\xE9r\xE9 par la plateforme\
                      \ (ex. team-vente)."
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  liaison:
                    description: "ADOPTION \u2014 identifiant de l'\xE9l\xE9ment EXISTANT\
                      \ \xE0 lier (UUID du groupe Keycloak). Omis = cr\xE9ation classique."
                    maxLength: 63
                    type: string
                  mode:
                    default: gere
                    description: "Niveau d'adoption. observe = \xAB La plateforme\
                      \ voit l'\xE9tat r\xE9el et la d\xE9rive ; elle ne modifie rien,\
                      \ par construction. \xBB \xB7 gere = \xAB La plateforme est\
                      \ la source de v\xE9rit\xE9 : elle d\xE9tecte la d\xE9rive et\
                      \ y ram\xE8ne l'\xE9tat. \xBB \u26A0\uFE0F Le niveau Gouvern\xE9\
                      \ n'est pas offert sur ce moteur (le provider crossplane converge\
                      \ seul \u2014 r\xE8gle \xAB rien ne converge sans d\xE9clenchement\
                      \ humain \xBB, ADOPTION-STANDARD \xA74)."
                    enum:
                    - observe
                    - gere
                    type: string
                  realm:
                    default: platform
                    description: Realm Keycloak.
                    type: string
                  role:
                    description: "R\xF4le de gouvernance de la squad (pos\xE9 en attribut\
                      \ du groupe Keycloak, lu par le RBAC portail). Omis = pas d'attribut."
                    enum:
                    - consumer
                    - provider
                    type: string
                required:
                - group
                type: object
                x-kubernetes-validations:
                - message: "le niveau Observ\xE9 se LIE \xE0 un existant : renseigner\
                    \ liaison (UUID du groupe)."
                  rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison)
                    && self.liaison != '''')'
              status:
                properties:
                  groupId:
                    description: "UUID Keycloak du groupe cr\xE9\xE9 (status.atProvider.id)."
                    type: string
                type: object
            type: object
        served: true
        storage: true
    status:
      acceptedNames:
        kind: ''
        plural: ''
      conditions: null
      storedVersions: null
  dependencies:
  - apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
    metadata:
      name: xkeycloakgroup-keycloak
    spec:
      compositeTypeRef:
        apiVersion: crossplane.platform.example.io/v1alpha1
        kind: XKeycloakGroup
      mode: Pipeline
      pipeline:
      - functionRef:
          name: function-patch-and-transform
        input:
          apiVersion: pt.fn.crossplane.io/v1beta1
          kind: Resources
          resources:
          - base:
              apiVersion: group.keycloak.m.crossplane.io/v1alpha1
              kind: Group
              spec:
                forProvider:
                  realmId: platform
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            name: group
            patches:
            - fromFieldPath: spec.group
              toFieldPath: metadata.name
              transforms:
              - string:
                  fmt: kc-group-%s
                  type: Format
                type: string
              type: FromCompositeFieldPath
            - fromFieldPath: spec.group
              toFieldPath: spec.forProvider.name
              type: FromCompositeFieldPath
            - fromFieldPath: metadata.name
              toFieldPath: metadata.labels['backstage.io/kubernetes-id']
              type: FromCompositeFieldPath
            - fromFieldPath: spec.realm
              toFieldPath: spec.forProvider.realmId
              type: FromCompositeFieldPath
            - fromFieldPath: spec.role
              policy:
                fromFieldPath: Optional
              toFieldPath: spec.forProvider.attributes.role
              type: FromCompositeFieldPath
            - combine:
                strategy: string
                string:
                  fmt: '%s|%s'
                variables:
                - fromFieldPath: spec.mode
                - fromFieldPath: spec.liaison
              toFieldPath: spec.managementPolicies
              transforms:
              - match:
                  fallbackTo: Value
                  fallbackValue:
                  - '*'
                  patterns:
                  - regexp: ^observe\|.*
                    result:
                    - Observe
                    type: regexp
                  - regexp: ^gere\|.+
                    result:
                    - Observe
                    - Create
                    - Update
                    - LateInitialize
                    type: regexp
                type: match
              type: CombineFromComposite
            - fromFieldPath: spec.liaison
              policy:
                fromFieldPath: Optional
              toFieldPath: metadata.annotations[crossplane.io/external-name]
              type: FromCompositeFieldPath
            - fromFieldPath: status.atProvider.id
              toFieldPath: status.groupId
              type: ToCompositeFieldPath
        step: patch-and-transform
  - apiVersion: apiextensions.crossplane.io/v2
    kind: CompositeResourceDefinition
    metadata:
      annotations:
        platform.kratix.io/contracts: '{"provides":[{"kind":"keycloak-group","name":"${spec.group}","defaultName":"team-${spec.team}","severity":"suggest"}]}'
      name: xkeycloakgroups.crossplane.platform.example.io
    spec:
      group: crossplane.platform.example.io
      names:
        kind: XKeycloakGroup
        plural: xkeycloakgroups
      scope: Namespaced
      versions:
      - name: v1alpha1
        referenceable: true
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: "Nom du groupe Keycloak g\xE9r\xE9 par la plateforme\
                      \ (ex. team-vente)."
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  liaison:
                    description: "ADOPTION \u2014 identifiant de l'\xE9l\xE9ment EXISTANT\
                      \ \xE0 lier (UUID du groupe Keycloak). Omis = cr\xE9ation classique."
                    maxLength: 63
                    type: string
                  mode:
                    default: gere
                    description: "Niveau d'adoption. observe = \xAB La plateforme\
                      \ voit l'\xE9tat r\xE9el et la d\xE9rive ; elle ne modifie rien,\
                      \ par construction. \xBB \xB7 gere = \xAB La plateforme est\
                      \ la source de v\xE9rit\xE9 : elle d\xE9tecte la d\xE9rive et\
                      \ y ram\xE8ne l'\xE9tat. \xBB \u26A0\uFE0F Le niveau Gouvern\xE9\
                      \ n'est pas offert sur ce moteur (le provider crossplane converge\
                      \ seul \u2014 r\xE8gle \xAB rien ne converge sans d\xE9clenchement\
                      \ humain \xBB, ADOPTION-STANDARD \xA74)."
                    enum:
                    - observe
                    - gere
                    type: string
                  realm:
                    default: platform
                    description: Realm Keycloak.
                    type: string
                  role:
                    description: "R\xF4le de gouvernance de la squad (pos\xE9 en attribut\
                      \ du groupe Keycloak, lu par le RBAC portail). Omis = pas d'attribut."
                    enum:
                    - consumer
                    - provider
                    type: string
                required:
                - group
                type: object
                x-kubernetes-validations:
                - message: "le niveau Observ\xE9 se LIE \xE0 un existant : renseigner\
                    \ liaison (UUID du groupe)."
                  rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison)
                    && self.liaison != '''')'
              status:
                properties:
                  groupId:
                    description: "UUID Keycloak du groupe cr\xE9\xE9 (status.atProvider.id)."
                    type: string
                type: object
            type: object
        served: true
  destinationSelectors:
  - matchLabels:
      environment: platform
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:c76eeac2a6b4b76de4cd2ea7b6004c0df9db6158a6b85ee5226eb1792e427dd8
            name: backstage
            env:
            - name: UI_SCHEMA_REV
              value: 194e87ce373d
            - name: CONTRACTS_REV
              value: 59e32cc2a610
            - name: CURATION_REV
              value: 51b01245bae8
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - env:
            - name: XRD_GROUP
              value: crossplane.platform.example.io
            - name: XRD_VERSION
              value: v1alpha1
            - name: XRD_KIND
              value: XKeycloakGroup
            image: ghcr.io/syntasso/kratix-cli/from-api-to-crossplane-claim:v0.2.2
            name: from-api-to-crossplane-claim
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:c76eeac2a6b4b76de4cd2ea7b6004c0df9db6158a6b85ee5226eb1792e427dd8
            name: backstage
          jobOptions: {}
          rbac: {}
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
