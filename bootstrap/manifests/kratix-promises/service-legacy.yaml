apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: service-legacy
  labels:
    kratix.io/promise-version: v0.1.0
  annotations:
    platform.kratix.io/provider: cloud
    platform.kratix.io/exposure: product
    platform.kratix.io/public: 'false'
    platform.kratix.io/adoption-non-destruction: moteur
    platform.kratix.io/adoptable: 'true'
    backstage.example.io/ui-schema: "{\"properties\":{\"mode\":{\"ui:enumNames\":[\"\
      Observ\xE9\",\"G\xE9r\xE9\"]}},\"ui:order\":[\"mode\",\"*\"]}"
spec:
  destinationSelectors:
  - matchLabels:
      environment: platform
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: servicelegacies.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: ServiceLegacy
        plural: servicelegacies
        singular: servicelegacy
      scope: Namespaced
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  serviceName:
                    description: Identifiant technique du service sur la cible
                    type: string
                    minLength: 1
                    maxLength: 63
                    default: legacy-app
                  markerContent:
                    description: Ecrit dans le fichier de configuration du service
                    type: string
                    minLength: 1
                    maxLength: 255
                    default: gere par la plateforme
                  mode:
                    type: string
                    enum:
                    - observe
                    - gere
                    default: gere
                    description: "Niveau d'adoption. observe = la plateforme lit et\
                      \ compare (observe.sh / mode check), ne modifie rien \xB7 gere\
                      \ = converge au changement d\xE9clar\xE9. Gouvern\xE9 : non\
                      \ offert pour ce moteur (pas de plan)."
                  team:
                    type: string
                    description: "\xC9quipe propri\xE9taire de la demande."
                required:
                - markerContent
                - serviceName
                - team
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            env:
            - name: UI_SCHEMA_REV
              value: 632f21d86a44
            - name: CURATION_REV
              value: 1cc1f5a4af7a
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          volumes:
          - name: github-token
            secret:
              secretName: github-app-token
              optional: true
              defaultMode: 256
          - name: creds
            secret:
              secretName: awx-token-cloud
              optional: true
              defaultMode: 256
          containers:
          - name: geste
            image: harbor.212-47-226-56.nip.io/platform/script-runner@sha256:e04188641bf1494d180483ad44802e0438ab9f62b614ccaf5f11c1b5f026d72f
            env:
            - name: SOURCE_URL
              value: https://github.com/Younesic/platform-gitops
            - name: SOURCE_REF
              value: v0.27.0
            - name: SOURCE_PATH
              value: sources/script/awx-lancement-ressource
            - name: VERBE
              value: apply
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_WEB
              value: https://awx.212-47-226-56.nip.io
            - name: AWX_JOB_TEMPLATE
              value: legacy-service
            - name: AWX_VAR_MAP
              value: '{"service_name": "SPEC_SERVICENAME", "marker_content": "SPEC_MARKERCONTENT"}'
            - name: AWX_ETAT_VAR
              value: marker_state
            - name: AWX_TIMEOUT
              value: '1800'
            volumeMounts:
            - name: github-token
              mountPath: /kratix/secrets/github
              readOnly: true
            - name: creds
              mountPath: /kratix/secrets/creds
              readOnly: true
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            env:
            - name: ADOPTION_NON_DESTRUCTION
              value: moteur
          rbac: {}
          jobOptions: {}
      delete:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-delete
        spec:
          volumes:
          - name: github-token
            secret:
              secretName: github-app-token
              optional: true
              defaultMode: 256
          - name: creds
            secret:
              secretName: awx-token-cloud
              optional: true
              defaultMode: 256
          containers:
          - name: geste-destroy
            image: harbor.212-47-226-56.nip.io/platform/script-runner@sha256:e04188641bf1494d180483ad44802e0438ab9f62b614ccaf5f11c1b5f026d72f
            env:
            - name: SOURCE_URL
              value: https://github.com/Younesic/platform-gitops
            - name: SOURCE_REF
              value: v0.27.0
            - name: SOURCE_PATH
              value: sources/script/awx-lancement-ressource
            - name: VERBE
              value: destroy
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_WEB
              value: https://awx.212-47-226-56.nip.io
            - name: AWX_JOB_TEMPLATE
              value: legacy-service
            - name: AWX_VAR_MAP
              value: '{"service_name": "SPEC_SERVICENAME", "marker_content": "SPEC_MARKERCONTENT"}'
            - name: AWX_ETAT_VAR
              value: marker_state
            - name: AWX_TIMEOUT
              value: '1800'
            volumeMounts:
            - name: github-token
              mountPath: /kratix/secrets/github
              readOnly: true
            - name: creds
              mountPath: /kratix/secrets/creds
              readOnly: true
          rbac: {}
          jobOptions: {}
