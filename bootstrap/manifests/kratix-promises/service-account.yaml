apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  labels:
    kratix.io/promise-version: v0.0.1
  name: service-account
  annotations:
    platform.kratix.io/adoption-non-destruction: ceinture
    platform.kratix.io/status-schema: "{\"conditions\": {\"path\": \".status.conditions\"\
      , \"label\": \"Conditions \xE9crites par le runtime \xE0 chaque r\xE9conciliation.\"\
      , \"type\": \"array\"}, \"awxJobId\": {\"path\": \".status.awxJobId\", \"label\"\
      : \"Identifiant du job AWX de la derni\xE8re ex\xE9cution.\", \"type\": \"integer\"\
      }, \"awxJobStatus\": {\"path\": \".status.awxJobStatus\", \"label\": \"Statut\
      \ du dernier job AWX (successful, failed\u2026).\", \"type\": \"string\"}, \"\
      lastRunAt\": {\"path\": \".status.lastRunAt\", \"label\": \"Horodatage de fin\
      \ de la derni\xE8re ex\xE9cution.\", \"type\": \"string\"}, \"serviceState\"\
      : {\"path\": \".status.serviceState\", \"label\": \"\xC9tat constat\xE9 sur\
      \ la machine cible.\", \"type\": \"string\"}}"
    platform.kratix.io/operator-group: ansible.example.io
    platform.kratix.io/approval: '{"class":"UserRequest","gate":"standard"}'
    platform.kratix.io/provider: indus
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: serviceaccounts.platform.example.io
      namespace: default
    spec:
      group: platform.example.io
      names:
        kind: ServiceAccount
        plural: serviceaccounts
        singular: serviceaccount
      scope: Namespaced
      versions:
      - additionalPrinterColumns:
        - jsonPath: .status.awxJobId
          name: Job AWX
          type: integer
        - jsonPath: .status.awxJobStatus
          name: Dernier etat
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        name: v1alpha1
        schema:
          openAPIV3Schema:
            description: Compte de service applicatif sur un serveur du parc
            properties:
              apiVersion:
                enum:
                - platform.example.io/v1alpha1
                type: string
              kind:
                enum:
                - ServiceAccount
                type: string
              metadata:
                type: object
              spec:
                properties:
                  accountName:
                    description: Nom du compte technique sur la machine cible. Minuscules,
                      chiffres et tirets ; c'est aussi le nom du fichier sudoers.
                    type: string
                  sshPublicKey:
                    description: "Cl\xE9 publique SSH autoris\xE9e \xE0 ouvrir une\
                      \ session sur ce compte. Le contenu d'un fichier .pub \u2014\
                      \ commence par ssh-ed25519, ssh-rsa, ecdsa-sha2-\u2026 La cl\xE9\
                      \ PRIV\xC9E reste chez le demandeur \u2014 la plateforme ne\
                      \ la voit jamais."
                    type: string
                  sudoCommand:
                    default: ''
                    description: "Commande unique que le compte peut ex\xE9cuter en\
                      \ sudo, sans mot de passe. CHEMIN ABSOLU obligatoire \u2014\
                      \ \xAB /bin/ls -a \xBB, jamais \xAB ls -a \xBB. Sinon le PATH\
                      \ du compte d\xE9ciderait quel binaire tourne : sudo le refuse.\
                      \ Laisser vide pour n'accorder aucun droit d'\xE9l\xE9vation\
                      \ (le cas par d\xE9faut). Le fichier sudoers est valid\xE9 par\
                      \ visudo avant d'\xEAtre pos\xE9."
                    type: string
                  team:
                    description: "Squad propri\xE9taire de la demande. Renseign\xE9\
                      e automatiquement depuis l'identit\xE9 du demandeur ; jamais\
                      \ transmise \xE0 AWX."
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                required:
                - accountName
                - sshPublicKey
                type: object
              status:
                properties:
                  awxJobId:
                    description: "Identifiant du job AWX de la derni\xE8re ex\xE9\
                      cution."
                    type: integer
                  awxJobStatus:
                    description: "Statut du dernier job AWX (successful, failed\u2026\
                      )."
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        lastTransitionTime:
                          type: string
                        message:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                      type: object
                    type: array
                  lastRunAt:
                    description: "Horodatage de fin de la derni\xE8re ex\xE9cution."
                    type: string
                  serviceState:
                    description: "\xC9tat constat\xE9 sur la machine cible."
                    type: string
                type: object
            type: object
        served: true
        storage: true
        subresources:
          status: {}
    status:
      acceptedNames:
        kind: ''
        plural: ''
      conditions: null
      storedVersions: null
  dependencies:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: serviceaccounts.ansible.example.io
      namespace: default
    spec:
      group: ansible.example.io
      names:
        kind: ServiceAccount
        listKind: ServiceAccountList
        plural: serviceaccounts
        singular: serviceaccount
      scope: Namespaced
      versions:
      - additionalPrinterColumns:
        - jsonPath: .status.awxJobId
          name: Job AWX
          type: integer
        - jsonPath: .status.awxJobStatus
          name: Dernier etat
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        name: v1alpha1
        schema:
          openAPIV3Schema:
            description: Compte de service applicatif sur un serveur du parc
            properties:
              apiVersion:
                type: string
              kind:
                type: string
              metadata:
                type: object
              spec:
                properties:
                  accountName:
                    description: Nom du compte technique sur la machine cible. Minuscules,
                      chiffres et tirets ; c'est aussi le nom du fichier sudoers.
                    type: string
                  sshPublicKey:
                    description: "Cl\xE9 publique SSH autoris\xE9e \xE0 ouvrir une\
                      \ session sur ce compte. Le contenu d'un fichier .pub \u2014\
                      \ commence par ssh-ed25519, ssh-rsa, ecdsa-sha2-\u2026 La cl\xE9\
                      \ PRIV\xC9E reste chez le demandeur \u2014 la plateforme ne\
                      \ la voit jamais."
                    type: string
                  sudoCommand:
                    default: ''
                    description: "Commande unique que le compte peut ex\xE9cuter en\
                      \ sudo, sans mot de passe. CHEMIN ABSOLU obligatoire \u2014\
                      \ \xAB /bin/ls -a \xBB, jamais \xAB ls -a \xBB. Sinon le PATH\
                      \ du compte d\xE9ciderait quel binaire tourne : sudo le refuse.\
                      \ Laisser vide pour n'accorder aucun droit d'\xE9l\xE9vation\
                      \ (le cas par d\xE9faut). Le fichier sudoers est valid\xE9 par\
                      \ visudo avant d'\xEAtre pos\xE9."
                    type: string
                  team:
                    description: "Squad propri\xE9taire de la demande. Renseign\xE9\
                      e automatiquement depuis l'identit\xE9 du demandeur ; jamais\
                      \ transmise \xE0 AWX."
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                required:
                - accountName
                - sshPublicKey
                type: object
              status:
                properties:
                  awxJobId:
                    description: "Identifiant du job AWX de la derni\xE8re ex\xE9\
                      cution."
                    type: integer
                  awxJobStatus:
                    description: "Statut du dernier job AWX (successful, failed\u2026\
                      )."
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        lastTransitionTime:
                          type: string
                        message:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                      type: object
                    type: array
                  lastRunAt:
                    description: "Horodatage de fin de la derni\xE8re ex\xE9cution."
                    type: string
                  serviceState:
                    description: "\xC9tat constat\xE9 sur la machine cible."
                    type: string
                type: object
            type: object
        served: true
        storage: true
        subresources:
          status: {}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: service-account-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: service-account-operator-leader-election
      namespace: awx
    rules:
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - configmaps
      - events
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: service-account-operator-leader-election
      namespace: awx
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: service-account-operator-leader-election
    subjects:
    - kind: ServiceAccount
      name: service-account-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: service-account-operator
      namespace: default
    rules:
    - apiGroups:
      - ansible.example.io
      resources:
      - serviceaccounts
      - serviceaccounts/status
      - serviceaccounts/finalizers
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - events
      verbs:
      - create
      - patch
    - apiGroups:
      - platform.kratix.io
      resources:
      - healthrecords
      verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - platform.example.io
      resources:
      - serviceaccounts
      verbs:
      - get
      - list
      - watch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: service-account-operator
      namespace: default
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: service-account-operator
    subjects:
    - kind: ServiceAccount
      name: service-account-operator
      namespace: awx
  - apiVersion: v1
    data:
      watches.yaml: "- version: v1alpha1\n  group: ansible.example.io\n  kind: ServiceAccount\n\
        \  playbook: /opt/ansible/generic/provision.yml\n  reconcilePeriod: 120s\n\
        \  finalizer:\n    name: ansible.example.io/deprovision\n    playbook: /opt/ansible/generic/deprovision.yml\n"
    kind: ConfigMap
    metadata:
      name: service-account-watches
      namespace: awx
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: service-account-operator
      name: service-account-operator
      namespace: awx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: service-account-operator
      template:
        metadata:
          annotations:
            roles-revision: '4'
          labels:
            app: service-account-operator
        spec:
          containers:
          - args:
            - run
            - --watches-file=/opt/ansible/produit/watches.yaml
            - --leader-election-id=service-account-operator
            command:
            - ansible-operator
            env:
            - name: WATCH_NAMESPACE
              value: ''
            - name: ANSIBLE_ROLES_PATH
              value: /opt/ansible/roles
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/ansible
            - name: ANSIBLE_REMOTE_TEMP
              value: /tmp/ansible
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_JOB_TEMPLATE
              value: compte-service
            - name: AWX_TIMEOUT_SECONDS
              value: '600'
            - name: AWX_ALLOWED_LIMITS
              value: ''
            - name: AWX_INVENTORY
              value: Parc legacy
            - name: AWX_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: awx-token-indus
            - name: OPERAND_GROUP
              value: ansible.example.io
            - name: OPERAND_VERSION
              value: v1alpha1
            - name: OPERAND_PLURAL
              value: serviceaccounts
            - name: CLAIM_API_VERSION
              value: platform.example.io/v1alpha1
            - name: CLAIM_PLURAL
              value: serviceaccounts
            - name: AWX_STATE_VAR
              value: account_state
            - name: AWX_STATE_PRESENT
              value: present
            - name: AWX_STATE_ABSENT
              value: absent
            image: quay.io/operator-framework/ansible-operator@sha256:96053ae3e045c4eb57350cbf1995dece22bf7d3bfe4cf875a20d8853963a3731
            livenessProbe:
              httpGet:
                path: /healthz
                port: 6789
              initialDelaySeconds: 20
              periodSeconds: 30
            name: operator
            readinessProbe:
              httpGet:
                path: /readyz
                port: 6789
              initialDelaySeconds: 10
              periodSeconds: 15
            resources:
              limits:
                cpu: '1'
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
            - mountPath: /opt/ansible/roles
              name: roles
              readOnly: true
            - mountPath: /opt/ansible/generic
              name: generic
              readOnly: true
            - mountPath: /opt/ansible/produit
              name: produit
              readOnly: true
            - mountPath: /tmp
              name: runner
          priorityClassName: platform-high
          serviceAccountName: service-account-operator
          volumes:
          - configMap:
              items:
              - key: awx-contrat.yml
                path: awx-contrat/tasks/main.yml
              - key: awx-runner.yml
                path: awx-runner/tasks/main.yml
              - key: awx-remover.yml
                path: awx-remover/tasks/main.yml
              name: ansible-operator-roles
            name: roles
          - configMap:
              items:
              - key: provision.yml
                path: provision.yml
              - key: deprovision.yml
                path: deprovision.yml
              name: ansible-operator-roles
            name: generic
          - configMap:
              name: service-account-watches
            name: produit
          - emptyDir: {}
            name: runner
  destinationSelectors:
  - matchLabels:
      environment: platform
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component:0.5.6-fr@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            name: backstage
            env:
            - name: CURATION_REV
              value: ca1d60007f16
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - env:
            - name: OPERATOR_GROUP
              value: ansible.example.io
            - name: OPERATOR_VERSION
              value: v1alpha1
            - name: OPERATOR_KIND
              value: ServiceAccount
            image: harbor.212-47-226-56.nip.io/platform/from-api-to-operator@sha256:0a5975c3f74e82f5f635810115a667ec38cbad9954e052d7168c2c6d450862bd
            name: from-api-to-operator
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component:0.5.6-fr@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            name: backstage
            env:
            - name: ADOPTION_NON_DESTRUCTION
              value: ceinture
          jobOptions: {}
          rbac: {}
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
