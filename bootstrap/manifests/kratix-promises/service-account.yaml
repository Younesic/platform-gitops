apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: service-account
  labels:
    kratix.io/promise-version: v0.1.0
  annotations:
    platform.kratix.io/provider: indus
    platform.kratix.io/exposure: product
    platform.kratix.io/public: 'false'
    platform.kratix.io/approval: '{"class":"UserRequest","gate":"standard"}'
spec:
  destinationSelectors:
  - matchLabels:
      environment: platform
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: serviceaccounts.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: ServiceAccount
        plural: serviceaccounts
        singular: serviceaccount
      scope: Namespaced
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  accountName:
                    description: Nom du compte
                    type: string
                    minLength: 2
                    maxLength: 32
                    default: svc-app
                  sshPublicKey:
                    description: Cle publique SSH autorisee
                    type: string
                    minLength: 1
                    default: ssh-ed25519 AAAA... demandeur@banque
                  sudoCommand:
                    description: Commande sudo autorisee (vide = aucune)
                    type: string
                    maxLength: 200
                  team:
                    type: string
                    description: "\xC9quipe propri\xE9taire de la demande."
                required:
                - accountName
                - sshPublicKey
                - team
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            env:
            - name: CURATION_REV
              value: ca1d60007f16
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          volumes:
          - name: github-token
            secret:
              secretName: github-app-token
              optional: true
              defaultMode: 256
          - name: creds
            secret:
              secretName: awx-token-indus
              optional: true
              defaultMode: 256
          containers:
          - name: geste
            image: harbor.212-47-226-56.nip.io/platform/script-runner@sha256:e1ea9f076faf2eb6d34e8c9b8678b0304f3d4c9c82d81b85a7ebc3bc88fa6d82
            env:
            - name: SOURCE_URL
              value: https://github.com/Younesic/platform-gitops
            - name: SOURCE_REF
              value: v0.26.0
            - name: SOURCE_PATH
              value: sources/script/awx-lancement-ressource
            - name: VERBE
              value: apply
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_WEB
              value: https://awx.212-47-226-56.nip.io
            - name: AWX_JOB_TEMPLATE
              value: compte-service
            - name: AWX_VAR_MAP
              value: '{"account_name": "ACCOUNTNAME", "ssh_public_key": "SSHPUBLICKEY",
                "sudo_command": "SUDOCOMMAND"}'
            - name: AWX_ETAT_VAR
              value: account_state
            - name: AWX_TIMEOUT
              value: '1800'
            volumeMounts:
            - name: github-token
              mountPath: /kratix/secrets/github
              readOnly: true
            - name: creds
              mountPath: /kratix/secrets/creds
              readOnly: true
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
          rbac: {}
          jobOptions: {}
      delete:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-delete
        spec:
          volumes:
          - name: github-token
            secret:
              secretName: github-app-token
              optional: true
              defaultMode: 256
          - name: creds
            secret:
              secretName: awx-token-indus
              optional: true
              defaultMode: 256
          containers:
          - name: geste-destroy
            image: harbor.212-47-226-56.nip.io/platform/script-runner@sha256:e1ea9f076faf2eb6d34e8c9b8678b0304f3d4c9c82d81b85a7ebc3bc88fa6d82
            env:
            - name: SOURCE_URL
              value: https://github.com/Younesic/platform-gitops
            - name: SOURCE_REF
              value: v0.26.0
            - name: SOURCE_PATH
              value: sources/script/awx-lancement-ressource
            - name: VERBE
              value: destroy
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_WEB
              value: https://awx.212-47-226-56.nip.io
            - name: AWX_JOB_TEMPLATE
              value: compte-service
            - name: AWX_VAR_MAP
              value: '{"account_name": "ACCOUNTNAME", "ssh_public_key": "SSHPUBLICKEY",
                "sudo_command": "SUDOCOMMAND"}'
            - name: AWX_ETAT_VAR
              value: account_state
            - name: AWX_TIMEOUT
              value: '1800'
            volumeMounts:
            - name: github-token
              mountPath: /kratix/secrets/github
              readOnly: true
            - name: creds
              mountPath: /kratix/secrets/creds
              readOnly: true
          rbac: {}
          jobOptions: {}
