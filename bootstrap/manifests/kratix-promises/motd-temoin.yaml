                    type: integer
                  awxJobStatus:
                    description: Statut du dernier job AWX.
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
