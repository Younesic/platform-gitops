  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: motd-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: motd-operator-leader-election
      namespace: awx
    rules:
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - configmaps
      - events
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: motd-operator-leader-election
      namespace: awx
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: motd-operator-leader-election
    subjects:
    - kind: ServiceAccount
      name: motd-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: motd-operator
      namespace: default
    rules:
    - apiGroups:
      - temoin.ansible.example.io
      resources:
      - motds
      - motds/status
      - motds/finalizers
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - events
      verbs:
      - create
      - patch
    - apiGroups:
      - platform.kratix.io
      resources:
      - healthrecords
      verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - platform.example.io
      resources:
      - motdtemoins
      verbs:
      - get
      - list
      - watch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: motd-operator
      namespace: default
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: motd-operator
    subjects:
    - kind: ServiceAccount
      name: motd-operator
      namespace: awx
  - apiVersion: v1
    data:
      watches.yaml: "---\n- version: v1alpha1\n  group: temoin.ansible.example.io\n\
        \  kind: Motd\n  role: /opt/ansible/roles/awx-runner\n  # Ce qui distingue\
        \ cette architecture d'un playbook lanc\xE9 une fois : l'\xE9tat\n  # d\xE9\
        clar\xE9 est r\xE9-impos\xE9 \xE0 la machine \xE0 chaque \xE9ch\xE9ance.\n\
        \  reconcilePeriod: 120s\n  finalizer:\n    name: temoin.ansible.example.io/deprovision\n\
        \    role: /opt/ansible/roles/awx-remover\n"
    kind: ConfigMap
    metadata:
      name: motd-temoin-watches
      namespace: awx
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: motd-operator
      name: motd-operator
      namespace: awx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: motd-operator
      template:
        metadata:
          annotations:
            roles-revision: '1'
          labels:
            app: motd-operator
        spec:
          containers:
          - args:
            - run
            - --watches-file=/opt/ansible/produit/watches.yaml
            - --leader-election-id=motd-operator
            command:
            - ansible-operator
            env:
            - name: WATCH_NAMESPACE
              value: ''
            - name: ANSIBLE_ROLES_PATH
              value: /opt/ansible/roles
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/ansible
            - name: ANSIBLE_REMOTE_TEMP
              value: /tmp/ansible
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_JOB_TEMPLATE
              value: legacy-motd
            - name: AWX_STATE_VAR
              value: marker_state
            - name: AWX_STATE_ABSENT
              value: absent
            - name: AWX_ALLOWED_LIMITS
              value: ''
            - name: AWX_TIMEOUT_SECONDS
              value: '600'
            - name: AWX_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: awx-token-indus
            - name: OPERAND_GROUP
              value: temoin.ansible.example.io
            - name: OPERAND_VERSION
              value: v1alpha1
            - name: OPERAND_PLURAL
              value: motds
            - name: CLAIM_API_VERSION
              value: platform.example.io/v1alpha1
            - name: CLAIM_PLURAL
              value: motdtemoins
            image: quay.io/operator-framework/ansible-operator@sha256:96053ae3e045c4eb57350cbf1995dece22bf7d3bfe4cf875a20d8853963a3731
            livenessProbe:
              httpGet:
                path: /healthz
                port: 6789
              initialDelaySeconds: 20
              periodSeconds: 30
            name: operator
            readinessProbe:
              httpGet:
                path: /readyz
                port: 6789
              initialDelaySeconds: 10
              periodSeconds: 15
            resources:
              limits:
                cpu: '1'
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
            - mountPath: /opt/ansible/roles
              name: roles
              readOnly: true
            - mountPath: /opt/ansible/produit
              name: produit
              readOnly: true
            - mountPath: /tmp
              name: runner
          priorityClassName: platform-high
          serviceAccountName: motd-operator
          volumes:
          - configMap:
              items:
              - key: awx-contrat.yml
                path: awx-contrat/tasks/main.yml
              - key: awx-runner.yml
                path: awx-runner/tasks/main.yml
              - key: awx-remover.yml
                path: awx-remover/tasks/main.yml
              name: ansible-operator-roles
            name: roles
          - configMap:
              name: motd-temoin-watches
            name: produit
          - emptyDir: {}
            name: runner
  destinationSelectors:
  - matchLabels:
