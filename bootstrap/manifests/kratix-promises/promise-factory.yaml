# MÉTA-PROMESSE : créer une promesse devient un claim typé (helm, crossplane,
# operator ET compound implémentés ; terraform = slot) (donc un formulaire Backstage,
# via le Template poussé par promise-configure). Le pipeline rejoue le MÊME outillage
# que le poste du platform engineer (plugins kratix new-helm-promise /
# new-crossplane-promise / new-operator-promise / new-compound-promise +
# schema-to-crd) et pousse une
# BRANCHE DE REVUE sur platform-gitops — jamais d'auto-apply : le merge humain reste
# le garde-fou de gouvernance. crossplane : source = repo git à une ref PINNÉE
# (tag|SHA) contenant 1 XRD + Composition(s) — la XRD est le contrat, copiée telle
# quelle dans l'API. operator : source = repo git pinné contenant les manifestes de
# l'opérateur — la CRD DÉSIGNÉE (source.apiSchemaFrom, ou l'unique) est le contrat
# (spec+status, version storage) ; les manifestes ENTIERS deviennent les dependencies
# de la promesse (opérateur installé 1×/Destination, N claims = N CRs rendus par
# from-api-to-operator — CR dans le namespace default de la destination). compound : DEUX chemins à parité — source = repo git pinné
# contenant compound.yaml (équipes) OU **spec.recipe INLINE** (le COMPOSER du
# portail) : l'API parent se DÉRIVE des promesses enfants choisies (EntityPicker sur
# les fiches kratix-promise ; version/apiVersion/kind vides = résolus et PINNÉS à la
# génération ; curation fix/hide ; la branche de revue montre l'API dérivée).
# requiredPromises = gate ; renderer partagé : when (T2), needs/exports + waits (T3),
# sync-waves (prune ordonné). Annotations backstage.example.io/* = formulaire
# (ui-schema : EntityPicker + ui:order [l'API server ALPHABÉTISE les properties du
# CRD → l'ordre du formulaire se pilote ici] ; form-switch : affichage par type).
# ⚠️ Annotations JSON une-ligne : TOUJOURS valider json.loads avant commit (vécu).
# Prérequis d'accès : le Secret `default/github-app-token`, frappé par le CronJob
# `backstage/github-token` depuis la clé privée de la GitHub App. Il porte un jeton
# d'installation (une heure) qui sert à cloner ET à pousser. Un dépôt non couvert
# se règle en installant l'App dessus — geste que son propriétaire fait lui-même.
apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: promise-factory
  labels:
    kratix.io/promise-version: v0.8.4
  annotations:
    # KS6 — lignée provider EXPLICITE (véridique : la méta-promesse est team-platform) —
    # ferme le verdict « legacy » du gate d'écriture Studio.
    platform.kratix.io/provider: platform
    backstage.example.io/ui-schema: '{"ui:order":["type","kind","plural","group","source","automation","terraform","script","contract","recipe","placement","uiSchema","usageHints","*"],"properties":{"source":{"ui:order":["url","version","chartName","path","apiSchemaFrom"]},"recipe":{"ui:field":"CompoundComposer"},"uiSchema":{"ui:field":"LeafPresentationComposer"},"usageHints":{"ui:field":"UsageHintsComposer"}}}'
    # hide par branche RÉACTIVÉ avec backstage-component ≥0.4.9 : le masquage
    # RETIRE le sous-champ du SCHÉMA de la branche (le ui:widget hidden posé
    # dans une branche était aplati globalement par rjsf — vécu, source.path
    # invisible en crossplane avec 0.4.5→0.4.8).
    backstage.example.io/form-switch: '{"field":"type","cases":{"helm":[{"field":"source","hide":["path","apiSchemaFrom","omit"]}],"crossplane":[{"field":"source","hide":["chartName","apiSchemaFrom","omit"]}],"terraform":[{"field":"source","hide":["chartName","apiSchemaFrom","omit"]},"terraform"],"operator":[{"field":"source","hide":["chartName"]}],"compound":["recipe"],"script":[{"field":"source","hide":["chartName","apiSchemaFrom","omit"]},"script","contract"],"awx":["automation"],"api":["api"]}}'
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: promiserequests.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: PromiseRequest
        plural: promiserequests
        singular: promiserequest
      scope: Namespaced
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required:
                - kind
                - type
                # ⚠️ L'APPROBATION EST OBLIGATOIRE DEPUIS QU'ON A MESURÉ CE QUE SON
                # ABSENCE COÛTE : une offre reprenant le patrimoine d'un client est
                # sortie NON GOUVERNÉE parce que personne n'avait posé la question.
                # « aucune » reste une réponse valide — le silence, non.
                - approval
                # validation par type (CEL). ⚠️ source n'est plus requis globalement
                # (compound inline) → chaque règle DOIT garder has(self.source).
                x-kubernetes-validations:
                # ⚠️ PAS de règle CEL pour l'ABSENCE de `approval` : `required` est
                # évalué par la validation STRUCTURELLE, qui passe AVANT CEL — une
                # telle règle ne s'exécuterait jamais, et quelqu'un finirait par
                # croire qu'elle protège. Le refus est donc sec (« Required value ») ;
                # ce qui ORIENTE vit dans la description du champ, que le formulaire
                # affiche et que `kubectl explain` rend. Mesuré au banc jetable.
                # ⚠️ DEUX CHAMPS PORTANT LE MÊME MOT, C'EST LE DÉFAUT QU'ON FERME.
                # `spec.api.approval` règle le MOTEUR (le approvePlan de terraform) ;
                # celui-ci règle la GOUVERNANCE. Les confondre a coûté une preuve.
                # On refuse donc de déclarer l'approbation aux DEUX endroits.
                - rule: "!(has(self.approval) && has(self.curation) && 'approval' in self.curation)"
                  message: "l'approbation se déclare dans spec.approval (champ nommé), plus dans curation.approval — retirez la clé libre"
                # Une classe vide rendrait la politique ILLISIBLE pour le portier, qui
                # traiterait alors l'offre comme non gouvernée : un « standard » qui ne
                # gouverne personne, en silence. Exactement ce qu'on ferme.
                - rule: "!has(self.approval) || self.approval.gate == 'aucune' || (has(self.approval.class) && self.approval.class != '')"
                  message: "spec.approval.class est obligatoire dès que gate vaut auto ou standard (la classe porte le circuit d'approbation)"
                - rule: self.type != 'helm' || (has(self.source) && has(self.source.url) && has(self.source.version))
                  message: 'type helm : source.url et source.version sont requis (pin de gouvernance)'
                - rule: self.type != 'crossplane' || (has(self.source) && has(self.source.url) && has(self.source.version))
                  message: 'type crossplane : source.url (repo git) et source.version (tag ou SHA) sont requis (pin de gouvernance)'
                - rule: self.type != 'operator' || (has(self.source) && has(self.source.url) && has(self.source.version))
                  message: 'type operator : source.url (repo git des manifestes de l''opérateur) et source.version (tag ou SHA) sont requis (pin de gouvernance)'
                - rule: self.type != 'compound' || (has(self.source) && has(self.source.url) && has(self.source.version)) || (has(self.recipe) && has(self.recipe.children))
                  message: 'type compound : soit source.url+version (recette compound.yaml dans git), soit recipe inline (composer du portail)'
                # terraform : le dépôt du module ET son chemin. Le contrat se dérive des
                # blocs `variable` — l'auteur n'écrit aucune CRD.
                - rule: self.type != 'terraform' || (has(self.source) && has(self.source.url) && has(self.source.version) && has(self.source.path))
                  message: 'type terraform : source.url (dépôt du module), source.version (tag ou SHA) et source.path (chemin du module) sont requis (pin de gouvernance)'
                # awx (CD7) : un survey EST un contrat déclaré ailleurs. L'offre ne
                # déclare que DEUX choses — QUOI lancer, et OÙ. Le formulaire vient du
                # survey ; la source des verbes est fournie par la plateforme ; le jeton
                # a un défaut (CD6), et celui du FOURNISSEUR gagne s'il est déclaré.
                - rule: self.type != 'awx' || (has(self.automation) && has(self.automation.jobTemplate))
                  message: 'type awx : automation.jobTemplate est requis — c''est le SEUL job template que cette offre pourra lancer'
                - rule: self.type != 'awx' || (has(self.automation) && (has(self.automation.inventory) || (has(self.automation.allowedLimits) && size(self.automation.allowedLimits) > 0)))
                  message: 'type awx : la cible doit être déclarée — automation.inventory (l''offre la fixe) OU automation.allowedLimits (l''offre ouvre le choix, dans cette liste et elle seule). Verrouiller le job template sans verrouiller la machine ne verrouille rien.'
                # Moteur du CONTRAT DÉCLARÉ (§9quater). Rien de plus n'est exigé : la
                # CLASSE (action ou ressource) se déduit des VERBES, qui sont des
                # FICHIERS de la source — elle ne se déclare pas, donc elle ne peut pas
                # mentir. `spec.script` est OPTIONNEL (il ne porte que les identifiants).
                - rule: self.type != 'script' || (has(self.source) && has(self.source.url) && has(self.source.version) && has(self.source.path))
                  message: 'type script : source.url (dépôt de la source), source.version (tag ou SHA) et source.path (dossier portant contract.schema.json et les verbes) sont requis (pin de gouvernance)'
                # api (moteur 8) : la SPEC est le contrat. Deux exigences, et elles
                # disent la même chose — on ne lit jamais une spec à chaud (specPath +
                # specSha256 = le pin de gouvernance, exactement comme un tag de module),
                # et on ne DEVINE jamais ce que fait une opération. Le fait qui fonde ce
                # refus est mesuré : chez Dependency-Track, PUT crée et POST modifie —
                # l'inverse de la convention. Une plateforme qui devine se trompera sur
                # cette API-là, en silence, et détruira ou créera à contretemps.
                - rule: self.type != 'api' || (has(self.api) && has(self.api.specPath) && has(self.api.specSha256))
                  message: 'type api : api.specPath (le SNAPSHOT de la spec dans le dépôt de la plateforme) et api.specSha256 (son empreinte) sont requis — une spec se PIN comme un module. Sans empreinte, l''éditeur de l''API peut changer le contrat de votre offre sans que personne ne le voie.'
                - rule: self.type != 'api' || (has(self.api) && has(self.api.designation) && has(self.api.designation.create))
                  message: 'type api : api.designation.create est requis — l''opération qui CRÉE se désigne, elle ne se devine pas. Mesuré sur une API réelle : PUT /v1/project crée et POST /v1/project modifie, l''inverse de la convention REST. Désigner create seul = une ACTION ; create+read+delete = une RESSOURCE.'
                - rule: self.type != 'api' || !has(self.api.designation.delete) || (has(self.api.designation.read) && has(self.api.designation.create))
                  message: 'type api : désigner delete exige create ET read — sans lecture, la plateforme ne peut ni constater l''état ni adopter l''existant, et une suppression qu''on ne peut pas vérifier n''est pas une garantie.'
                properties:
                  type:
                    type: string
                    description: Moteur de la future promesse (helm, crossplane, terraform, operator, compound, script, awx, api)
                    enum:
                    - helm
                    - crossplane
                    - terraform
                    - operator
                    - compound
                    - script
                    - awx
                    - api
                    default: helm
                  kind:
                    type: string
                    description: Kind de l'API de la future promesse (ex. Database)
                    pattern: ^[A-Z][A-Za-z0-9]*$
                  plural:
                    type: string
                    description: 'Pluriel du kind (défaut : kind minuscule + ''s'' — à poser si ce pluriel est faux, ex. sandboxes)'
                    pattern: ^[a-z][a-z0-9]*$
                  group:
                    type: string
                    default: platform.example.io
                    description: Groupe API de la future promesse
                  source:
                    type: object
                    description: La source d'implémentation (forme selon le type)
                    properties:
                      url:
                        type: string
                        description: 'helm : chart (oci:// ou repo https://) · crossplane/compound/operator : repo git (https:// ou git@hôte:…) · terraform : module git::https://'
                        pattern: ^((git::)?(oci|https?)://|git@[A-Za-z0-9.-]+:).+
                      version:
                        type: string
                        description: 'Pin EXACT de gouvernance — jamais latest. helm : semver du chart · crossplane/compound/operator : tag semver ou SHA git'
                        pattern: ^(v?[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?|[0-9a-f]{7,40})$
                      path:
                        type: string
                        description: 'crossplane : sous-dossier du repo contenant la XRD + Composition(s) · operator : sous-dossier contenant les manifestes de l''opérateur · compound : sous-dossier contenant compound.yaml (défaut : racine)'
                      chartName:
                        type: string
                        description: Nom du chart (requis seulement pour un repo Helm non-OCI)
                      apiSchemaFrom:
                        type: string
                        pattern: ^[a-z0-9][a-z0-9.-]*$
                        description: 'operator : nom de la CRD-contrat (plural.group) — requis seulement si le dossier en contient plusieurs (l''unique CRD est prise par défaut ; en cas d''ambiguïté la génération échoue en LISTANT les candidates)'
                      omit:
                        type: array
                        items:
                          type: string
                          pattern: ^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)*$
                        description: 'operator : champs du spec à RETIRER de l''API portail (curation d''une CRD tierce obèse — ex. override, dont les required imbriqués rendent le formulaire soumis-bloquant). BR5 : chemins POINTÉS admis (override.statefulSet = retrait NESTED via l''officiel update api --property a.b- ; le reste du parent et son required restent cohérents). Un champ retiré n''est jamais posé sur le CR → les défauts de l''opérande s''appliquent.'
                  automation:
                    type: object
                    description: 'ansible : ce que le produit DÉCLARE de son automatisation. Ces valeurs partent dans l''ENVIRONNEMENT du contrôleur — donc hors de portée du spec d''une demande. Ce qui est permis est déclaré, jamais déduit.'
                    properties:
                      jobTemplate:
                        type: string
                        description: Le SEUL job template AAP que ce produit pourra lancer.
                        minLength: 1
                      jobTemplateDelete:
                        type: string
                        description: 'Job template de décommissionnement (sinon stateVar : le job template nominal est rejoué avec sa variable d''état à « absent »).'
                      inventory:
                        type: string
                        description: 'Le produit FIXE sa cible : l''inventaire déclaré. Le demandeur n''a rien à dire.'
                      allowedLimits:
                        type: array
                        items:
                          type: string
                        description: 'Le produit OUVRE le choix : la demande peut désigner une cible DANS cette liste, et seulement elle. Hors liste ou nom d''hôte libre → refusé.'
                      awxTokenSecret:
                        type: string
                        description: 'Secret portant le jeton AWX DU FOURNISSEUR (clé : token). Un jeton commun ferait s''arrêter la lignée du fournisseur à la frontière d''AAP.'
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      adoption:
                        type: boolean
                        description: 'awx (CD9) : EXIGER que l''offre soit adoptable (barreau Observé via le mode check d''Ansible). Refusée à la génération si le job template n''accepte pas le job_type au lancement (ask_job_type_on_launch) — jamais un Observé décoratif. Omis = l''adoptabilité se déduit du fait, silencieusement.'
                      stateVar:
                        type: string
                        description: 'Variable d''état du job template (défaut : marker_state), utilisée quand il n''y a pas de job template de retrait.'
                      entrypoint:
                        type: string
                        description: 'Point d''entrée du rôle dont on dérive le contrat (défaut : main).'
                  terraform:
                    type: object
                    description: 'terraform : ce que le produit DÉCLARE de son exécution. Ces valeurs partent dans l''ENVIRONNEMENT du rendu — hors de portée du spec d''une demande.'
                    properties:
                      approval:
                        type: string
                        enum: [auto, manuelle]
                        default: auto
                        description: 'SURVEILLÉE ou APPROUVÉE — pas les deux. Mesuré : avec un plan approuvé nommément, l''exécuteur DÉTECTE la dérive mais ne la corrige jamais, et n''offre aucun plan à approuver pour elle. « auto » = la dérive se corrige toute seule. « manuelle » = chaque changement attend une décision. Choisir, et le dire.'
                      interval:
                        type: string
                        pattern: ^[0-9]+(s|m|h)$
                        default: 1h
                        # PLANCHER IMPOSÉ PAR LA PLATEFORME — 5 minutes, et pas de secondes.
                        # POURQUOI un plancher, alors qu'ailleurs « on n'impose rien » : une
                        # cadence frappe TOUT le cluster, pas seulement le produit qui la
                        # déclare. À 10s, une seule offre × 200 demandes ≈ 1,7 M pods/jour.
                        # C'est mot pour mot la faute du post-mortem ansible (120s = 262 800
                        # connexions/an/demande). Et AUCUN éditeur n'expose ce levier à
                        # l'auteur d'un produit : HCP Terraform fixe sa détection de dérive à
                        # ~24 h, en édition payante, NON réglable par l'utilisateur.
                        # Vérifié 16/16 sur CRD jetable avant d'atterrir ici — dont `0h`, qui
                        # passait dans la 1re version de la règle et vaudrait « sans pause ».
                        x-kubernetes-validations:
                          - rule: "!self.endsWith('s') && int(self.substring(0, self.size()-1)) >= (self.endsWith('h') ? 1 : 5)"
                            message: 'cadence trop rapide : chaque tour fait naître un POD. Minimum 5m, et les secondes sont refusées. L''heure (défaut) rattrape une dérive dans l''heure pour 24 pods/jour/demande, contre 720 à deux minutes. Si le produit n''a pas besoin de guetter la dérive, laisser 1h suffit : la plateforme réagit DÉJÀ au changement de demande et au changement de module, sans horloge.'
                        description: 'Cadence de réconciliation. ⚠️ Chaque tour fait naître un POD. Plancher imposé : 5m, secondes refusées. Repère : 1h = 24 pods/jour/demande, 2m en ferait 720. À savoir avant de descendre — l''horloge ne sert QU''À guetter la dérive : un changement de demande ou de module déclenche déjà tout seul. Par comparaison, HCP Terraform fixe sa détection de dérive à ~24 h et ne la rend pas réglable.'
                      credsSecret:
                        type: string
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                        description: 'Secret portant les identifiants du provider, lus en VARIABLES D''ENVIRONNEMENT par le runner. Jamais des variables terraform : une variable atterrit dans l''état ET dans le plan, et « sensitive » masque l''affichage, pas le stockage.'
                  script:
                    type: object
                    description: 'script : ce que le produit DÉCLARE de son exécution. Tout le reste se LIT dans la source — le contrat dans contract.schema.json, la classe dans la présence des verbes (run.sh = action ; apply.sh + destroy.sh = ressource ; observe.sh = signalé, gaté).'
                    properties:
                      credsSecret:
                        type: string
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                        description: 'Secret portant les identifiants du système CIBLE, montés et lus en VARIABLES D''ENVIRONNEMENT par le runner — jamais en argument (un argument finit dans les journaux). Omis = le script ne doit avoir besoin d''aucun identifiant.'
                  api:
                    type: object
                    description: 'api (moteur 8) : ce que le produit DÉCLARE en plus de sa spec. La spec porte le CONTRAT (les champs, leurs types, leurs contraintes) ; ce bloc porte ce qu''une spec ne peut pas dire — quelles opérations comptent, où vit son snapshot, et avec quelle identité on l''appelle.'
                    properties:
                      specPath:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*\.json$
                        description: 'Chemin du SNAPSHOT de la spec dans le dépôt de la plateforme (ex. sources/api/dtrack-project/spec.json). La spec est VENDORISÉE, jamais lue à chaud : une plateforme qui va chercher son contrat sur un serveur tiers voit son contrat changer sans commit, sans revue et sans personne.'
                      specSha256:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                        description: 'Empreinte du snapshot. C''est le pin de gouvernance : si la spec bouge, la génération REFUSE et renvoie relire le diff. Le calcul : sha256sum <fichier>.'
                      designation:
                        type: object
                        description: 'QUELLE opération joue QUEL rôle. C''est la pièce que personne ne peut deviner à notre place — et la seule chose qu''on demande à l''auteur. Chaque valeur est un operationId de la spec ; la sortie du dériveur les liste si vous ne les connaissez pas. Si la spec est à NOUS, ces rôles se co-localisent dedans (extensions x-platform-create/read/update/delete) et la source GAGNE sur cette déclaration (règle de précédence CT5).'
                        properties:
                          create:
                            type: string
                            description: 'L''opération qui CRÉE. Seule désignée ⇒ l''offre est une ACTION (supprimer la demande ne défait rien).'
                          read:
                            type: string
                            description: 'L''opération qui LIT un élément. Elle apporte l''identifiant — donc la LIAISON d''adoption, donc la possibilité de reprendre l''existant.'
                          update:
                            type: string
                            description: 'L''opération qui MODIFIE. Sans elle, un changement de demande se traduira par une recréation.'
                          delete:
                            type: string
                            description: 'L''opération qui SUPPRIME. Avec create et read ⇒ l''offre est une RESSOURCE (converge au changement déclaré · destruction pilotée).'
                          omit:
                            type: array
                            items:
                              type: string
                            description: 'Champs du contrat à RETIRER du formulaire, nommément. Le retrait est rendu à l''auteur avec sa raison — on ne rogne jamais un contrat en silence.'
                      credsSecret:
                        type: string
                        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                        description: 'Secret portant les identifiants de l''API, montés en FICHIERS et lus par le module. Jamais des variables : une variable atterrit dans l''état ET dans le plan lisible, et « sensitive » masque l''affichage, pas le stockage.'
                      credsKeys:
                        type: object
                        description: 'Les NOMS des clés dans le secret d''identifiants. La plateforme a une CONVENTION (API_URL, API_TOKEN, API_USER) ; déclarez ici les vôtres quand elles diffèrent. ⚠️ Ce n''est pas un détail : le générateur ne peut PAS lire le secret, et un nom qui ne correspond pas fait échouer le PLAN à chaque tour — sur un message de terraform qui parle d''un fichier absent, jamais du secret.'
                        properties:
                          url:
                            type: string
                            description: 'Clé portant l''adresse de base de l''API (défaut API_URL).'
                          token:
                            type: string
                            description: 'Clé portant le jeton ou la clé d''API (défaut API_TOKEN).'
                          user:
                            type: string
                            description: 'Clé portant l''identifiant, pour l''authentification basic (défaut API_USER).'
                      authFamille:
                        type: string
                        enum: [apikey, bearer, basic, oauth2cc]
                        description: 'Famille d''authentification, SEULEMENT si la spec ne la déclare pas. Quand elle la déclare (securitySchemes en 3.x, securityDefinitions en 2.0), elle est LUE — déclarer ici ce que la spec dit déjà, c''est ouvrir une porte à la divergence.'
                      approval:
                        type: string
                        enum: [auto, manuelle]
                        default: auto
                        description: 'Ressource seulement. SURVEILLÉE ou APPROUVÉE — pas les deux (le même arbitrage que terraform, dont ce moteur hérite l''exécution). « manuelle » = chaque changement attend une décision, et le portier iTop la porte.'
                      interval:
                        type: string
                        pattern: ^[0-9]+(s|m|h)$
                        default: 1h
                        x-kubernetes-validations:
                          - rule: "!self.endsWith('s') && int(self.substring(0, self.size()-1)) >= (self.endsWith('h') ? 1 : 5)"
                            message: 'cadence trop rapide : chaque tour fait naître un POD, et frappe l''API du fournisseur. Minimum 5m, secondes refusées. 1h = 24 tours/jour/demande ; 2m en ferait 720.'
                        description: 'Ressource seulement. Cadence de réconciliation — l''horloge ne sert QU''À guetter la dérive : un changement de demande ou de spec déclenche déjà tout seul. Sur une API tierce, elle est aussi une charge que VOUS imposez à quelqu''un d''autre.'
                  contract:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'script (CD5) : le contrat COMPOSÉ au Studio (« le stylo »), pour l''auteur qui a un exécutable mais PAS de contract.schema.json. C''est un PONT, pas une destination — la précédence est SOURCE > CLAIM : le jour où la source est re-pinnée sur une ref qui porte le fichier, il gagne et la bascule se fait toute seule. Même dialecte que contract.schema.json (JSON Schema plat).'
                  placement:
                    type: string
                    pattern: ^[A-Za-z0-9]([A-Za-z0-9._/-]*[A-Za-z0-9])?=[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
                    description: 'RT1 — selector de Destination déclaré par le PRODUIT (UNE paire label=valeur). Omis = control-plane/« shared » (environment=platform). Produit applicatif : fleet=apps (routé vers la flotte applicative ; le routage par env DU CLAIM restera alors possible — un selector niveau Promise sur environment serait inoverridable). La revue de la branche promise/* = le garde-fou.'
                  uiSchema:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'Présentation du formulaire des demandeurs (pickers dynamiques par champ) — réglée À LA CRÉATION par le composer LeafPresentationComposer (champs dérivés de la source). Recopiée en annotation ui-schema sur la promesse générée. Compound : la présentation vit dans recipe.uiSchema (composer inline).'
                  # ── LA QUESTION QU'ON NE DEVINE PLUS ─────────────────────────────────
                  # L'approbation vivait comme une clé quelconque de la carte libre
                  # `curation`. Conséquence mesurée : une offre qui reprend le patrimoine
                  # d'un client pouvait sortir NON GOUVERNÉE parce que personne n'avait
                  # posé la question — pas parce que quelqu'un avait répondu « non ».
                  #
                  # ⚠️ Pourquoi un champ À CÔTÉ et non une propriété nommée DANS
                  # `curation` : Kubernetes refuse `properties` et `additionalProperties`
                  # au même niveau (« mutual exclusive », mesuré au banc jetable). Une
                  # carte libre ne peut pas contenir de champ nommé.
                  approval:
                    type: object
                    required:
                    - gate
                    description: >-
                      Faut-il une approbation dans l'ITSM pour demander ce produit ? La
                      réponse se DÉCLARE — « aucune » est valide, le silence ne l'est pas.
                      Posée en annotation platform.kratix.io/approval sur la promesse, lue
                      par le portier qui bloque la fusion des demandes non approuvées.
                    properties:
                      gate:
                        type: string
                        enum:
                        - aucune
                        - auto
                        - standard
                        description: >-
                          aucune = ce produit ne passe pas par l'ITSM (un espace de travail
                          isolé, que son propriétaire peut détruire lui-même, n'a pas à
                          attendre un comité — mais il doit le DIRE). auto = un ticket est
                          ouvert et tracé, personne n'a à l'approuver. standard = un ticket
                          doit être APPROUVÉ par un humain avant que la demande soit
                          fusionnée ; sans quoi la fusion est refusée, administrateur compris.
                      class:
                        type: string
                        default: UserRequest
                        description: >-
                          La classe de ticket de l'ITSM (UserRequest, NormalChange,
                          RoutineChange…). C'est ELLE qui porte le dosage : chaque classe a
                          sa propre requête d'approbation côté portail. Ignorée si
                          gate vaut « aucune ».
                      service:
                        type: string
                        description: >-
                          Le service auquel rattacher le ticket, quand la classe en porte un.
                          Optionnel : omis, aucun service n'est déclaré (et non « le service
                          vide »).
                  curation:
                    type: object
                    additionalProperties:
                      type: string
                    description: 'Curation marketplace (clé → valeur string) déclarée par le provider → posée en annotations platform.kratix.io/<clé> sur la promesse générée, propagée par le conteneur backstage sur l''offre (Template + fiche). « provider » y pilote l''owner provider-first (RBAC) et la lignée estampillée sur les instances. Ex.: provider, tier, sla, logo-url.'
                  usageHints:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        from:
                          type: string
                          description: 'Champ PARENT dont ce champ se déduit (ex. team).'
                        template:
                          type: string
                          description: 'Gabarit — ${} = emplacement de la valeur du champ parent (ex. team-${} donne team-vente ; ${} seul = valeur brute).'
                        level:
                          type: string
                          enum:
                          - suggest
                          - warn
                          - enforce
                          description: 'Niveau d''application : suggest (pré-remplit, déviable) | warn (avertit si dévié) | enforce (câblage IMPOSÉ — dévier = recette REFUSÉE à la génération par le garde-fou générique backend). Défaut = suggest.'
                    description: 'Suggestions/RÈGLES de SOURCE par champ (« déduire, pas deviner ») publiées pour les compositeurs (formulaire + Kratix Studio) ET le garde-fou. Clé = nom d''un champ de CETTE promesse ; valeur = {from, template, level}. Ex. group → {from: team, template: "team-${}", level: enforce}. Posées en annotation platform.kratix.io/usage-hints, HÉRITÉES à la dérivation, LUES/pré-sélectionnées par le composer, et IMPOSÉES (level: enforce) à la génération quel que soit l''éditeur.'
                  recipe:
                    type: object
                    description: L'API parent se DÉRIVE des promesses choisies ; la branche de revue montre le résultat complet.
                    properties:
                      uiSchema:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: 'Présentation des champs parent (ui:* par champ) — écrite par le volet « Présentation » du composer (sources découvertes au catalogue). Précédence : hérité des enfants < recipe.uiSchema < spec.uiSchema.'
                      api:
                        type: array
                        description: Optionnel — s'ajoutent aux champs dérivés des enfants.
                        items:
                          type: object
                          required:
                          - name
                          - type
                          properties:
                            name:
                              type: string
                              pattern: ^[a-zA-Z][a-zA-Z0-9]*$
                              description: Nom du champ
                            type:
                              type: string
                              enum:
                              - string
                              - boolean
                              - integer
                            title:
                              type: string
                              description: Libellé affiché dans le formulaire
                            description:
                              type: string
                            required:
                              type: boolean
                              default: false
                            enum:
                              type: array
                              items:
                                type: string
                              description: Valeurs permises (type string)
                            default:
                              type: string
                              description: 'Défaut (coercé selon type : true/false, entier, sinon texte)'
                            pattern:
                              type: string
                              description: Regex de validation (type string)
                        title: Champs parent additionnels (avancé)
                      children:
                        type: array
                        description: '1 ligne = 1 promesse enfant. Tout le reste se dérive : ne remplis que ce que tu veux ajuster.'
                        items:
                          type: object
                          required:
                          - name
                          - promise
                          properties:
                            name:
                              type: string
                              pattern: ^[a-z][a-z0-9-]*$
                              description: Le claim enfant s'appellera parent-nom.
                              title: Nom logique
                            promise:
                              type: string
                              description: Choisir l'offre au catalogue.
                              title: Promesse
                            version:
                              type: string
                              description: Vide = version installée, pinnée à la génération.
                              title: Version (avancé)
                            apiVersion:
                              type: string
                              description: Vide = résolu depuis la promesse installée.
                              title: apiVersion (avancé)
                            kind:
                              type: string
                              description: Vide = résolu depuis la promesse installée.
                              title: Kind (avancé)
                            fix:
                              type: object
                              additionalProperties:
                                type: string
                              description: champ → valeur constante ; disparaît du formulaire parent.
                              title: Figer des champs — curation
                            hide:
                              type: array
                              items:
                                type: string
                              description: Champs OPTIONNELS à retirer du parent (un requis se fige).
                              title: Masquer des champs — curation
                            spec:
                              type: object
                              additionalProperties:
                                type: string
                              description: 'Override d''un mapping auto : ${spec.x}, ${children.<nom>.<export>}, littéral.'
                              title: Mappings avancés
                            when:
                              type: array
                              maxItems: 8
                              title: Conditions d'émission (optionnel)
                              description: 'T2 : l''enfant n''est créé que si TOUTES les conditions passent (ET).'
                              items:
                                type: object
                                properties:
                                  field:
                                    type: string
                                    description: Chemin du parent (ex. spec.message)
                                  equals:
                                    type: string
                                    description: Émis si égal (true/false/entiers coercés)
                                  exists:
                                    type: boolean
                                    description: Émis si présent (true) ou absent (false)
                            whenMode:
                              type: string
                              enum:
                              - all
                              - any
                              description: "Entre plusieurs conditions : all = ET (défaut), any = OU"
                            needs:
                              type: array
                              items:
                                type: string
                              description: Noms d'enfants à attendre (readiness) avant d'émettre celui-ci.
                              title: Attendre d'abord (T3)
                            exports:
                              type: object
                              additionalProperties:
                                type: string
                              description: clé → chemin .status.… publié pour les autres enfants.
                              title: Exports (T3)
                        title: Promesses composées
                    title: Recette — le composer
  destinationSelectors:
  - matchLabels:
      environment: platform
  workflows:
    config: {}
    promise:
      configure:
      # Template « PromiseRequest » + fiche kratix-promise poussés au portail.
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component:0.5.6-fr@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            # La MÉTA-promesse n'est PAS une offre publique : son Template + sa fiche
            # restent réservés au plan plateforme/provider (pas les consommateurs).
            env:
            - name: BACKSTAGE_PUBLIC
              value: "false"
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: factory
        spec:
          # composer inline : la factory résout version/apiVersion/kind + SCHÉMAS
          # des enfants depuis les promesses INSTALLÉES (dérivation de l'API parent).
          rbac:
            permissions:
            # promises = CLUSTER-scoped -> resourceNamespace "*" force un ClusterRole
            # (sans lui, Kratix génère un Role namespacé qui ne donne AUCUN accès — vécu)
            - resourceNamespace: "*"
              apiGroups:
              - platform.kratix.io
              resources:
              - promises
              verbs:
              - get
              - list
          volumes:
          # LA clé SSH de déploiement a été RETIRÉE : l'identité de la fabrique
          # est le jeton d'installation de la GitHub App. Un repli silencieux
          # aurait masqué l'arrêt de la frappe ; le secret reste dans le cluster,
          # revenir en arrière est un `git revert`.
          # ⚠️ OPTIONNEL reste indispensable : sans ce mot, un jeton pas encore
          # frappé empêcherait le pipeline de DÉMARRER — donc plus aucune promesse.
          - name: github-token
            secret:
              secretName: github-app-token
              optional: true
              defaultMode: 256
          # Identifiants de REGISTRE (dockerconfigjson), optionnels : sans eux la
          # fabrique tire en anonyme, comme avant. Avec eux, un chart hébergé
          # dans un projet PRIVÉ devient utilisable.
          - name: registry-creds
            secret:
              secretName: registry-credentials
              optional: true
              defaultMode: 256
          # CD7 — le jeton AWX en LECTURE, pour dériver le survey d'un job template.
          # C'est le MÊME jeton que le lancement (CD6) : il ne voit que les templates
          # dont le droit d'exécution est déclaré en git, donc la porte est unique —
          # on ne peut pas publier une offre pour un template qu'on ne pourra pas
          # lancer. Optionnel comme les autres : un secret pas encore frappé ne doit
          # pas empêcher la fabrique de démarrer pour TOUS les autres moteurs.
          - name: awx-token
            secret:
              secretName: awx-jeton-lancement
              optional: true
              defaultMode: 256
          containers:
          - name: factory
            # ⚠️ NE JAMAIS pinner `0.7.32-awx` = arm64 (construite sans
            #    --platform linux/amd64) : `exec format error` sur ce cluster x86,
            #    et les frappes de jeton s'arrêtent avec elle. 0.7.33 = même code, amd64.
            image: harbor.212-47-226-56.nip.io/platform/promise-factory:0.8.7-e2e@sha256:c09cd24bf8ef8c2ef197903ebc264701ed493ce325aec3a0949b2a055ad4ed06
            env:
            # Identifiants de REGISTRE au format dockerconfigjson. Posée sans
            # condition : vérifié sur helm 3.16, un fichier absent ou ne couvrant
            # pas l'hôte laisse le tirage anonyme intact. Seul un fichier MALFORMÉ
            # casse tout — la sonde d'accès le détecte et le nomme.
            - name: HELM_REGISTRY_CONFIG
              value: /kratix/secrets/registry/.dockerconfigjson
            volumeMounts:
            - name: awx-token
              mountPath: /kratix/secrets/awx
              readOnly: true
            - name: github-token
              mountPath: /kratix/secrets/github
              readOnly: true
            - name: registry-creds
              mountPath: /kratix/secrets/registry
              readOnly: true
