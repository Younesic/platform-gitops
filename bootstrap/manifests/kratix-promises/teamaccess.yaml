                \ Nom du groupe Keycloak g\xE9r\xE9 par la plateforme (ex. team-vente).\n\
                \      maxLength: 63\n      pattern: ^[a-z][a-z0-9-]*$\n      type:\
                \ string\n    liaison:\n      description: ADOPTION \u2014 identifiant\
                \ du groupe Keycloak EXISTANT dont on reprend\n        les membres\
                \ (le m\xEAme UUID que la liaison du claim keycloak-group fr\xE8re).\
                \ Omis\n        = cr\xE9ation classique.\n      maxLength: 63\n  \
                \    type: string\n    mode:\n      default: gere\n      description:\
                \ 'Niveau d''adoption. observe = \xAB La plateforme voit les membres\n\
                \        r\xE9els et la d\xE9rive ; elle ne modifie rien, par construction.\
                \ \xBB \xB7 gere = \xAB\n        La plateforme est la source de v\xE9\
                rit\xE9 : ce claim g\xE8re LA liste compl\xE8te des\n        membres.\
                \ \xBB \u26A0\uFE0F Le niveau Gouvern\xE9 n''est pas offert sur ce\
                \ moteur (le provider\n        crossplane converge seul \u2014 r\xE8\
                gle \xAB rien ne converge sans d\xE9clenchement humain\n        \xBB\
                , ADOPTION-STANDARD \xA74).'\n      enum:\n      - observe\n     \
                \ - gere\n      type: string\n    users:\n      description: Usernames\
                \ Keycloak membres du groupe \u2014 ce claim g\xE8re LA liste compl\xE8\
                te\n        (1 claim par groupe).\n      items:\n        maxLength:\
                \ 63\n        minLength: 1\n        type: string\n      minItems:\
                \ 1\n      type: array\n  required:\n  - group\n  - users\n  x-kubernetes-validations:\n\
                \  - message: 'adoption : le niveau \xAB observe \xBB exige \xAB liaison\
                \ \xBB (l''UUID du groupe\n      Keycloak existant dont on reprend\
                \ les membres). Sans lui, la plateforme n''aurait\n      rien \xE0\
                \ observer et cr\xE9erait.'\n    rule: '!has(self.mode) || self.mode\
                \ != ''observe'' || (has(self.liaison) && self.liaison\n      != '''')'\n\
                children:\n- name: keycloak-member\n  promise: keycloak-member\n \
                \ version: v0.0.1\n  apiVersion: platform.example.io/v1alpha1\n  kind:\
