                \  kind: KeycloakGroup\n  spec:\n    group: ${spec.group}\n    liaison:\
                \ ${spec.liaison}\n    mode: ${spec.mode}\n"
            - name: COMPOUND_STAGE
              value: emit
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:41f626bbb302b401f9519f67256a9ef2072f6e5c057a303e9c83f14fe2859af4
            name: backstage
            env:
            - name: ADOPTION_NON_DESTRUCTION
              value: moteur
          jobOptions: {}
          rbac: {}
