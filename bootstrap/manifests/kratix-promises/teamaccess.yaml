apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  labels:
    kratix.io/promise-version: v0.0.1
  name: teamaccess
  annotations:
    platform.kratix.io/adoption-non-destruction: moteur
    platform.kratix.io/adoptable: 'true'
    backstage.example.io/ui-schema: "{\"properties\":{\"liaison\":{\"ui:title\":\"\
      \xC9l\xE9ment existant \xE0 lier\",\"ui:description\":\"Vide = cr\xE9ation classique.\
      \ En Observ\xE9, rien n'est modifi\xE9 : la plateforme lit et compare.\"},\"\
      group\":{\"ui:field\":\"CatalogNamePicker\",\"ui:options\":{\"catalogFilter\"\
      :{\"kind\":\"Group\"}}},\"users\":{\"ui:field\":\"CatalogNamePicker\",\"ui:options\"\
      :{\"catalogFilter\":{\"kind\":\"User\"}}}},\"ui:order\":[\"mode\",\"liaison\"\
      ,\"*\"]}"
    platform.kratix.io/contracts: '{"provides": [{"kind": "keycloak-group", "name":
      "${spec.group}", "defaultName": "team-${spec.team}", "severity": "suggest",
      "origin": "claim"}]}'
    platform.kratix.io/provider: cloud
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: teamaccesses.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: TeamAccess
        plural: teamaccesses
        singular: teamaccess
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: "Nom du groupe Keycloak g\xE9r\xE9 par la plateforme\
                      \ (ex. team-vente)."
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  liaison:
                    description: "ADOPTION \u2014 identifiant du groupe Keycloak EXISTANT\
                      \ dont on reprend les membres (le m\xEAme UUID que la liaison\
                      \ du claim keycloak-group fr\xE8re). Omis = cr\xE9ation classique."
                    maxLength: 63
                    type: string
                  mode:
                    default: gere
                    description: "Niveau d'adoption. observe = \xAB La plateforme\
                      \ voit les membres r\xE9els et la d\xE9rive ; elle ne modifie\
                      \ rien, par construction. \xBB \xB7 gere = \xAB La plateforme\
                      \ est la source de v\xE9rit\xE9 : ce claim g\xE8re LA liste\
                      \ compl\xE8te des membres. \xBB \u26A0\uFE0F Le niveau Gouvern\xE9\
                      \ n'est pas offert sur ce moteur (le provider crossplane converge\
                      \ seul \u2014 r\xE8gle \xAB rien ne converge sans d\xE9clenchement\
                      \ humain \xBB, ADOPTION-STANDARD \xA74)."
                    enum:
                    - observe
                    - gere
                    type: string
                  users:
                    description: "Usernames Keycloak membres du groupe \u2014 ce claim\
                      \ g\xE8re LA liste compl\xE8te (1 claim par groupe)."
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                required:
                - group
                - users
                type: object
                x-kubernetes-validations:
                - message: "adoption : le niveau \xAB observe \xBB exige \xAB liaison\
                    \ \xBB (l'UUID du groupe Keycloak existant dont on reprend les\
                    \ membres). Sans lui, la plateforme n'aurait rien \xE0 observer\
                    \ et cr\xE9erait."
                  rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison)
                    && self.liaison != '''')'
            type: object
        served: true
        storage: true
  destinationSelectors:
  - matchLabels:
      environment: platform
  requiredPromises:
  - name: keycloak-member
    version: v0.0.1
  - name: keycloak-group
    version: v0.0.1
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:41f626bbb302b401f9519f67256a9ef2072f6e5c057a303e9c83f14fe2859af4
            name: backstage
            env:
            - name: UI_SCHEMA_REV
              value: 58b095ea5a68
            - name: CONTRACTS_REV
              value: c6656a3b479e
            - name: CURATION_REV
              value: 1cc1f5a4af7a
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/compound-renderer@sha256:1c02176ab0f52bed5758625fb09b80d683c10cec8706744872867f2848dd16d8
            name: compound-renderer
            env:
            - name: COMPOUND_RECIPE
              value: "api:\n  type: object\n  properties:\n    group:\n      description:\
                \ Nom du groupe Keycloak g\xE9r\xE9 par la plateforme (ex. team-vente).\n\
                \      maxLength: 63\n      pattern: ^[a-z][a-z0-9-]*$\n      type:\
                \ string\n    liaison:\n      description: ADOPTION \u2014 identifiant\
                \ du groupe Keycloak EXISTANT dont on reprend\n        les membres\
                \ (le m\xEAme UUID que la liaison du claim keycloak-group fr\xE8re).\
                \ Omis\n        = cr\xE9ation classique.\n      maxLength: 63\n  \
                \    type: string\n    mode:\n      default: gere\n      description:\
                \ 'Niveau d''adoption. observe = \xAB La plateforme voit les membres\n\
                \        r\xE9els et la d\xE9rive ; elle ne modifie rien, par construction.\
                \ \xBB \xB7 gere = \xAB\n        La plateforme est la source de v\xE9\
                rit\xE9 : ce claim g\xE8re LA liste compl\xE8te des\n        membres.\
                \ \xBB \u26A0\uFE0F Le niveau Gouvern\xE9 n''est pas offert sur ce\
                \ moteur (le provider\n        crossplane converge seul \u2014 r\xE8\
                gle \xAB rien ne converge sans d\xE9clenchement humain\n        \xBB\
                , ADOPTION-STANDARD \xA74).'\n      enum:\n      - observe\n     \
                \ - gere\n      type: string\n    users:\n      description: Usernames\
                \ Keycloak membres du groupe \u2014 ce claim g\xE8re LA liste compl\xE8\
                te\n        (1 claim par groupe).\n      items:\n        maxLength:\
                \ 63\n        minLength: 1\n        type: string\n      minItems:\
                \ 1\n      type: array\n  required:\n  - group\n  - users\n  x-kubernetes-validations:\n\
                \  - message: 'adoption : le niveau \xAB observe \xBB exige \xAB liaison\
                \ \xBB (l''UUID du groupe\n      Keycloak existant dont on reprend\
                \ les membres). Sans lui, la plateforme n''aurait\n      rien \xE0\
                \ observer et cr\xE9erait.'\n    rule: '!has(self.mode) || self.mode\
                \ != ''observe'' || (has(self.liaison) && self.liaison\n      != '''')'\n\
                children:\n- name: keycloak-member\n  promise: keycloak-member\n \
