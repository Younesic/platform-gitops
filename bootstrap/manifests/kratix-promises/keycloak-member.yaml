apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  annotations:
    platform.kratix.io/adoptable: 'true'
    platform.kratix.io/adoption-non-destruction: moteur
    platform.kratix.io/contracts: '{"requires": [{"kind": "keycloak-group", "name":
      "${spec.group}", "origin": "derived"}]}'
    backstage.example.io/ui-schema: "{\"properties\":{\"liaison\":{\"ui:title\":\"\
      \xC9l\xE9ment existant \xE0 lier\",\"ui:description\":\"Vide = cr\xE9ation classique.\
      \ En Observ\xE9, rien n'est modifi\xE9 : la plateforme lit et compare.\"},\"\
      group\":{\"ui:field\":\"CatalogNamePicker\",\"ui:options\":{\"catalogFilter\"\
      :{\"kind\":\"Group\"}}},\"users\":{\"ui:field\":\"CatalogNamePicker\",\"ui:options\"\
      :{\"catalogFilter\":{\"kind\":\"User\"}}}},\"ui:order\":[\"mode\",\"liaison\"\
      ,\"*\"]}"
    platform.kratix.io/exposure: internal
    platform.kratix.io/provider: identity
  labels:
    kratix.io/promise-version: v0.0.1
  name: keycloak-member
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: keycloakmembers.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: KeycloakMember
        plural: keycloakmembers
        singular: keycloakmember
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: "Nom du groupe Keycloak g\xE9r\xE9 par la plateforme\
                      \ (ex. team-vente)."
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  liaison:
                    description: "ADOPTION \u2014 identifiant du groupe Keycloak EXISTANT\
                      \ dont on reprend les membres (le m\xEAme UUID que la liaison\
                      \ du claim keycloak-group fr\xE8re). Omis = cr\xE9ation classique."
                    maxLength: 63
                    type: string
                  mode:
                    default: gere
                    description: "Niveau d'adoption. observe = \xAB La plateforme\
                      \ voit les membres r\xE9els et la d\xE9rive ; elle ne modifie\
                      \ rien, par construction. \xBB \xB7 gere = \xAB La plateforme\
                      \ est la source de v\xE9rit\xE9 : ce claim g\xE8re LA liste\
                      \ compl\xE8te des membres. \xBB \u26A0\uFE0F Le niveau Gouvern\xE9\
                      \ n'est pas offert sur ce moteur (le provider crossplane converge\
                      \ seul \u2014 r\xE8gle \xAB rien ne converge sans d\xE9clenchement\
                      \ humain \xBB, ADOPTION-STANDARD \xA74)."
                    enum:
                    - observe
                    - gere
                    type: string
                  realm:
                    default: platform
                    description: Realm Keycloak.
                    type: string
                  users:
                    description: "Usernames Keycloak membres du groupe \u2014 ce claim\
                      \ g\xE8re LA liste compl\xE8te (1 claim par groupe)."
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                required:
                - group
                - users
                type: object
                x-kubernetes-validations:
                - message: "adoption : le niveau \xAB observe \xBB exige \xAB liaison\
                    \ \xBB (l'UUID du groupe Keycloak existant dont on reprend les\
                    \ membres). Sans lui, la plateforme n'aurait rien \xE0 observer\
                    \ et cr\xE9erait."
                  rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison)
                    && self.liaison != '''')'
            type: object
        served: true
        storage: true
    status:
      acceptedNames:
        kind: ''
        plural: ''
      conditions: null
      storedVersions: null
  dependencies:
  - apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
    metadata:
      name: xkeycloakmember-keycloak
    spec:
      compositeTypeRef:
        apiVersion: crossplane.platform.example.io/v1alpha1
        kind: XKeycloakMember
      mode: Pipeline
      pipeline:
      - functionRef:
          name: function-patch-and-transform
        input:
          apiVersion: pt.fn.crossplane.io/v1beta1
          kind: Resources
          resources:
          - base:
              apiVersion: group.keycloak.m.crossplane.io/v1alpha1
              kind: Memberships
              spec:
                forProvider:
                  realmId: platform
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            name: membership
            patches:
            - fromFieldPath: spec.group
              toFieldPath: spec.forProvider.groupIdRef.name
              transforms:
              - string:
                  fmt: kc-group-%s
                  type: Format
                type: string
              type: FromCompositeFieldPath
            - fromFieldPath: spec.users
              toFieldPath: spec.forProvider.members
              type: FromCompositeFieldPath
            - fromFieldPath: metadata.name
              toFieldPath: metadata.labels['backstage.io/kubernetes-id']
              type: FromCompositeFieldPath
            - fromFieldPath: spec.realm
              toFieldPath: spec.forProvider.realmId
              type: FromCompositeFieldPath
            - combine:
                strategy: string
                string:
                  fmt: '%s|%s'
                variables:
                - fromFieldPath: spec.mode
                - fromFieldPath: spec.liaison
              toFieldPath: spec.managementPolicies
              transforms:
              - match:
                  fallbackTo: Value
                  fallbackValue:
                  - '*'
                  patterns:
                  - regexp: ^observe\|.*
                    result:
                    - Observe
                    type: regexp
                  - regexp: ^gere\|.+
                    result:
                    - Observe
                    - Create
                    - Update
                    - LateInitialize
                    type: regexp
                type: match
              type: CombineFromComposite
            - combine:
                strategy: string
                string:
                  fmt: '%s/group-memberships/%s'
                variables:
                - fromFieldPath: spec.realm
                - fromFieldPath: spec.liaison
              policy:
                fromFieldPath: Optional
              toFieldPath: metadata.annotations[crossplane.io/external-name]
              type: CombineFromComposite
        step: patch-and-transform
  - apiVersion: apiextensions.crossplane.io/v2
    kind: CompositeResourceDefinition
    metadata:
      name: xkeycloakmembers.crossplane.platform.example.io
    spec:
      group: crossplane.platform.example.io
      names:
        kind: XKeycloakMember
        plural: xkeycloakmembers
      scope: Namespaced
      versions:
      - name: v1alpha1
        referenceable: true
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  group:
                    description: "Nom du groupe Keycloak g\xE9r\xE9 par la plateforme\
                      \ (ex. team-vente)."
                    maxLength: 63
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  liaison:
                    description: "ADOPTION \u2014 identifiant du groupe Keycloak EXISTANT\
                      \ dont on reprend les membres (le m\xEAme UUID que la liaison\
                      \ du claim keycloak-group fr\xE8re). Omis = cr\xE9ation classique."
                    maxLength: 63
                    type: string
                  mode:
                    default: gere
                    description: "Niveau d'adoption. observe = \xAB La plateforme\
                      \ voit les membres r\xE9els et la d\xE9rive ; elle ne modifie\
                      \ rien, par construction. \xBB \xB7 gere = \xAB La plateforme\
                      \ est la source de v\xE9rit\xE9 : ce claim g\xE8re LA liste\
                      \ compl\xE8te des membres. \xBB \u26A0\uFE0F Le niveau Gouvern\xE9\
                      \ n'est pas offert sur ce moteur (le provider crossplane converge\
                      \ seul \u2014 r\xE8gle \xAB rien ne converge sans d\xE9clenchement\
                      \ humain \xBB, ADOPTION-STANDARD \xA74)."
                    enum:
                    - observe
                    - gere
                    type: string
                  realm:
                    default: platform
                    description: Realm Keycloak.
                    type: string
                  users:
                    description: "Usernames Keycloak membres du groupe \u2014 ce claim\
                      \ g\xE8re LA liste compl\xE8te (1 claim par groupe)."
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                required:
                - group
                - users
                type: object
                x-kubernetes-validations:
                - message: "adoption : le niveau \xAB observe \xBB exige \xAB liaison\
                    \ \xBB (l'UUID du groupe Keycloak existant dont on reprend les\
                    \ membres). Sans lui, la plateforme n'aurait rien \xE0 observer\
                    \ et cr\xE9erait."
                  rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison)
                    && self.liaison != '''')'
            type: object
        served: true
  destinationSelectors:
  - matchLabels:
      environment: platform
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:1652130538819f7c9ab5febbc2a7984a856764bcf7aaf70bf4b59e0bf4bd74bc
            name: backstage
            env:
            - name: UI_SCHEMA_REV
              value: 58b095ea5a68
            - name: CONTRACTS_REV
              value: 9e3c0b0f1cbd
            - name: CURATION_REV
              value: 51b01245bae8
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - env:
            - name: XRD_GROUP
              value: crossplane.platform.example.io
            - name: XRD_VERSION
              value: v1alpha1
            - name: XRD_KIND
              value: XKeycloakMember
            image: ghcr.io/syntasso/kratix-cli/from-api-to-crossplane-claim:v0.2.2
            name: from-api-to-crossplane-claim
          - env:
            - name: ADOPTION_NON_DESTRUCTION
              value: moteur
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:1652130538819f7c9ab5febbc2a7984a856764bcf7aaf70bf4b59e0bf4bd74bc
            name: backstage
          jobOptions: {}
          rbac: {}
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
