apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  labels:
    kratix.io/promise-version: v0.0.1
  name: harbor-project
  annotations:
    platform.kratix.io/adoption-non-destruction: moteur
    backstage.example.io/ui-schema: "{\"properties\":{\"liaison\":{\"ui:title\":\"\
      \xC9l\xE9ment existant \xE0 lier\",\"ui:description\":\"Vide = cr\xE9ation classique.\
      \ En Observ\xE9, rien n'est modifi\xE9 : la plateforme lit et compare.\"},\"\
      users\":{\"ui:field\":\"CatalogNamePicker\",\"ui:options\":{\"catalogFilter\"\
      :{\"kind\":\"User\"}}}},\"ui:order\":[\"project\",\"storageQuotaGb\",\"users\"\
      ,\"team\",\"*\"]}"
    platform.kratix.io/provider: indus
    platform.kratix.io/approval: '{"class":"UserRequest","service":"Plateforme interne","gate":"standard"}'
    platform.kratix.io/moteur: compound
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: harborprojects.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: HarborProject
        plural: harborprojects
        singular: harborproject
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  liaison:
                    description: "ADOPTION \u2014 identifiant du groupe Keycloak EXISTANT\
                      \ dont on reprend les membres (le m\xEAme UUID que la liaison\
                      \ du claim keycloak-group fr\xE8re). Omis = cr\xE9ation classique."
                    maxLength: 63
                    type: string
                  project:
                    description: Nom du projet Harbor (le registre du fournisseur,
                      ex. team-paiement).
                    maxLength: 255
                    pattern: ^[a-z][a-z0-9-]*$
                    type: string
                  storageQuotaGb:
                    default: -1
                    description: "Quota de stockage du projet en Go (-1 = illimit\xE9\
                      )."
                    type: integer
                  team:
                    type: string
                  users:
                    description: "Usernames Keycloak membres du groupe \u2014 ce claim\
                      \ g\xE8re LA liste compl\xE8te (1 claim par groupe)."
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    minItems: 1
                    type: array
                required:
                - project
                - users
                - team
                type: object
                x-kubernetes-validations:
                - message: "adoption : le niveau \xAB observe \xBB exige \xAB liaison\
                    \ \xBB (l'UUID du groupe Keycloak existant dont on reprend les\
                    \ membres). Sans lui, la plateforme n'aurait rien \xE0 observer\
                    \ et cr\xE9erait."
                  rule: '!has(self.mode) || self.mode != ''observe'' || (has(self.liaison)
                    && self.liaison != '''')'
            type: object
        served: true
        storage: true
  destinationSelectors:
  - matchLabels:
      environment: platform
  requiredPromises:
  - name: harbor-base
    version: v0.0.1
  - name: teamaccess
    version: v0.0.1
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            name: backstage
            env:
            - name: UI_SCHEMA_REV
              value: 08e390e9b6e1
            - name: CURATION_REV
              value: a531fbd5fa92
            - name: MOTEUR_REV
              value: 614e3beac1b4
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/compound-renderer@sha256:1c02176ab0f52bed5758625fb09b80d683c10cec8706744872867f2848dd16d8
            name: compound-renderer
            env:
            - name: COMPOUND_RECIPE
              value: "api:\n  type: object\n  properties:\n    project:\n      description:\
                \ Nom du projet Harbor (le registre du fournisseur, ex. team-paiement).\n\
                \      maxLength: 255\n      pattern: ^[a-z][a-z0-9-]*$\n      type:\
                \ string\n    storageQuotaGb:\n      default: -1\n      description:\
                \ Quota de stockage du projet en Go (-1 = illimit\xE9).\n      type:\
                \ integer\n    liaison:\n      description: ADOPTION \u2014 identifiant\
                \ du groupe Keycloak EXISTANT dont on reprend\n        les membres\
                \ (le m\xEAme UUID que la liaison du claim keycloak-group fr\xE8re).\
                \ Omis\n        = cr\xE9ation classique.\n      maxLength: 63\n  \
                \    type: string\n    users:\n      description: Usernames Keycloak\
                \ membres du groupe \u2014 ce claim g\xE8re LA liste compl\xE8te\n\
                \        (1 claim par groupe).\n      items:\n        maxLength: 63\n\
                \        minLength: 1\n        type: string\n      minItems: 1\n \
                \     type: array\n    team:\n      type: string\n  required:\n  -\
                \ project\n  - users\n  - team\n  x-kubernetes-validations:\n  - message:\
                \ 'adoption : le niveau \xAB observe \xBB exige \xAB liaison \xBB\
                \ (l''UUID du groupe\n      Keycloak existant dont on reprend les\
                \ membres). Sans lui, la plateforme n''aurait\n      rien \xE0 observer\
                \ et cr\xE9erait.'\n    rule: '!has(self.mode) || self.mode != ''observe''\
                \ || (has(self.liaison) && self.liaison\n      != '''')'\nchildren:\n\
                - name: harbor-base\n  promise: harbor-base\n  version: v0.0.1\n \
                \ apiVersion: platform.example.io/v1alpha1\n  kind: HarborBase\n \
                \ spec:\n    group: harbor-${spec.project}\n    project: ${spec.project}\n\
                \    storageQuotaGb: ${spec.storageQuotaGb}\n- name: teamaccess\n\
                \  promise: teamaccess\n  version: v0.0.1\n  apiVersion: platform.example.io/v1alpha1\n\
                \  kind: TeamAccess\n  spec:\n    group: harbor-${spec.project}\n\
                \    liaison: ${spec.liaison}\n    users: ${spec.users}\n"
            - name: COMPOUND_STAGE
              value: emit
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            name: backstage
            env:
            - name: ADOPTION_NON_DESTRUCTION
              value: moteur
          jobOptions: {}
          rbac: {}
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
