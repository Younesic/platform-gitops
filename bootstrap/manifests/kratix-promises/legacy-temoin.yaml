apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  labels:
    kratix.io/promise-version: v0.0.1
  name: legacy-temoin
  annotations:
    platform.kratix.io/status-schema: "{\"conditions\": {\"path\": \".status.conditions\"\
      , \"label\": \"Conditions \xE9crites par le runtime \xE0 chaque r\xE9conciliation.\"\
      , \"type\": \"array\"}, \"awxJobId\": {\"path\": \".status.awxJobId\", \"label\"\
      : \"Identifiant du job AWX de la derni\xE8re ex\xE9cution.\", \"type\": \"integer\"\
      }, \"awxJobStatus\": {\"path\": \".status.awxJobStatus\", \"label\": \"Statut\
      \ du dernier job AWX (successful, failed\u2026).\", \"type\": \"string\"}, \"\
      lastRunAt\": {\"path\": \".status.lastRunAt\", \"label\": \"Horodatage de fin\
      \ de la derni\xE8re ex\xE9cution.\", \"type\": \"string\"}, \"serviceState\"\
      : {\"path\": \".status.serviceState\", \"label\": \"\xC9tat constat\xE9 du service\
      \ sur la machine cible.\", \"type\": \"string\"}}"
    platform.kratix.io/operator-group: temoin.ansible.example.io
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: legacyservicetemoins.platform.example.io
      namespace: default
    spec:
      group: platform.example.io
      names:
        kind: LegacyServiceTemoin
        plural: legacyservicetemoins
        singular: legacyservicetemoin
      scope: Namespaced
      versions:
      - additionalPrinterColumns:
        - jsonPath: .spec.serviceName
          name: Service
          type: string
        - jsonPath: .status.awxJobId
          name: Job AWX
          type: integer
        - jsonPath: .status.awxJobStatus
          name: "Dernier \xE9tat"
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: "\xC2ge"
          type: date
        name: v1alpha1
        schema:
          openAPIV3Schema:
            description: "Un service configur\xE9 sur une machine du parc legacy \u2014\
              \ une cible qui n'a aucune API d\xE9clarative et qu'on n'atteint qu'en\
              \ SSH. Kubernetes r\xE9concilie, Ansible (AWX) ex\xE9cute."
            properties:
              apiVersion:
                enum:
                - platform.example.io/v1alpha1
                type: string
              kind:
                enum:
                - LegacyServiceTemoin
                type: string
              metadata:
                type: object
              spec:
                properties:
                  message:
                    default: gere par la plateforme
                    description: Message inscrit dans le fichier de configuration
                      du service.
                    maxLength: 200
                    type: string
                  serviceName:
                    description: Nom technique du service sur la machine cible.
                    pattern: ^[a-z][a-z0-9-]{2,30}$
                    type: string
                required:
                - serviceName
                type: object
              status:
                properties:
                  awxJobId:
                    description: "Identifiant du job AWX de la derni\xE8re ex\xE9\
                      cution."
                    type: integer
                  awxJobStatus:
                    description: "Statut du dernier job AWX (successful, failed\u2026\
                      )."
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        lastTransitionTime:
                          type: string
                        message:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                      type: object
                    type: array
                  lastRunAt:
                    description: "Horodatage de fin de la derni\xE8re ex\xE9cution."
                    type: string
                  serviceState:
                    description: "\xC9tat constat\xE9 du service sur la machine cible."
                    type: string
                type: object
            type: object
        served: true
        storage: true
        subresources:
          status: {}
    status:
      acceptedNames:
        kind: ''
        plural: ''
      conditions: null
      storedVersions: null
  dependencies:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: legacyservices.temoin.ansible.example.io
      namespace: default
    spec:
      group: temoin.ansible.example.io
      names:
        kind: LegacyService
        listKind: LegacyServiceList
        plural: legacyservices
        singular: legacyservice
      scope: Namespaced
      versions:
      - additionalPrinterColumns:
        - jsonPath: .spec.serviceName
          name: Service
          type: string
        - jsonPath: .status.awxJobId
          name: Job AWX
          type: integer
        - jsonPath: .status.awxJobStatus
          name: "Dernier \xE9tat"
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: "\xC2ge"
          type: date
        name: v1alpha1
        schema:
          openAPIV3Schema:
            description: "Un service configur\xE9 sur une machine du parc legacy \u2014\
              \ une cible qui n'a aucune API d\xE9clarative et qu'on n'atteint qu'en\
              \ SSH. Kubernetes r\xE9concilie, Ansible (AWX) ex\xE9cute."
            properties:
              apiVersion:
                type: string
              kind:
                type: string
              metadata:
                type: object
              spec:
                properties:
                  message:
                    default: gere par la plateforme
                    description: Message inscrit dans le fichier de configuration
                      du service.
                    maxLength: 200
                    type: string
                  serviceName:
                    description: Nom technique du service sur la machine cible.
                    pattern: ^[a-z][a-z0-9-]{2,30}$
                    type: string
                required:
                - serviceName
                type: object
              status:
                properties:
                  awxJobId:
                    description: "Identifiant du job AWX de la derni\xE8re ex\xE9\
                      cution."
                    type: integer
                  awxJobStatus:
                    description: "Statut du dernier job AWX (successful, failed\u2026\
                      )."
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        lastTransitionTime:
                          type: string
                        message:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                      type: object
                    type: array
                  lastRunAt:
                    description: "Horodatage de fin de la derni\xE8re ex\xE9cution."
                    type: string
                  serviceState:
                    description: "\xC9tat constat\xE9 du service sur la machine cible."
                    type: string
                type: object
            type: object
        served: true
        storage: true
        subresources:
          status: {}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: legacy-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: legacy-operator-leader-election
      namespace: awx
    rules:
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - configmaps
      - events
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: legacy-operator-leader-election
      namespace: awx
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: legacy-operator-leader-election
    subjects:
    - kind: ServiceAccount
      name: legacy-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: legacy-operator
      namespace: default
    rules:
    - apiGroups:
      - temoin.ansible.example.io
      resources:
      - legacyservices
      - legacyservices/status
      - legacyservices/finalizers
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - events
      verbs:
      - create
      - patch
    - apiGroups:
      - platform.kratix.io
      resources:
      - healthrecords
      verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - platform.example.io
      resources:
      - legacyservicetemoins
      verbs:
      - get
      - list
      - watch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: legacy-operator
      namespace: default
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: legacy-operator
    subjects:
    - kind: ServiceAccount
      name: legacy-operator
      namespace: awx
  - apiVersion: v1
    data:
      deprovision.yml: "---\n# D\xE9-provisionnement : jou\xE9 par le finalizer, \xE0\
        \ la suppression de la ressource.\n# C'est ce qui manque \xE0 un playbook\
        \ lanc\xE9 dans un pipeline \u2014 l\xE0, la suppression\n# ne ferait RIEN\
        \ sur la cible.\n- name: De-provisionner un service legacy\n  hosts: localhost\n\
        \  connection: local\n  gather_facts: false\n  vars:\n    awx_url: \"{{ lookup('env',\
        \ 'AWX_URL') }}\"\n    awx_token: \"{{ lookup('env', 'AWX_TOKEN') | trim }}\"\
        \n    awx_job_template_name: \"{{ lookup('env', 'AWX_JOB_TEMPLATE') }}\"\n\
        \    k8s_api: https://kubernetes.default.svc\n    k8s_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
        \    k8s_token: \"{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token')\
        \ }}\"\n  tasks:\n    - name: Resoudre le job template AWX declare\n     \
        \ ansible.builtin.uri:\n        url: \"{{ awx_url }}/api/v2/job_templates/?name={{\
        \ awx_job_template_name | urlencode }}\"\n        headers: { Authorization:\
        \ \"Bearer {{ awx_token }}\" }\n      register: jt\n      no_log: true\n\n\
        \    - name: Demander le retrait du service sur la cible\n      ansible.builtin.uri:\n\
        \        url: \"{{ awx_url }}/api/v2/job_templates/{{ jt.json.results[0].id\
        \ }}/launch/\"\n        method: POST\n        headers: { Authorization: \"\
        Bearer {{ awx_token }}\" }\n        body_format: json\n        body:\n   \
        \       extra_vars:\n            service_name: \"{{ service_name }}\"\n  \
        \          # Le sondage du job template declare `marker_content` REQUIS :\
        \ AWX\n            # refuse un lancement qui n'apporte pas toutes les variables\
        \ requises\n            # (400, verifie). Le contrat du sondage s'impose donc\
        \ AUSSI au\n            # de-provisionnement, meme si la valeur n'y sert a\
        \ rien.\n            marker_content: \"{{ message | default('retrait') }}\"\
        \n            marker_state: absent\n        status_code: [201]\n      register:\
        \ launch\n      no_log: true\n\n    - name: Attendre la fin du job AWX\n \
        \     ansible.builtin.uri:\n        url: \"{{ awx_url }}/api/v2/jobs/{{ launch.json.id\
        \ }}/\"\n        headers: { Authorization: \"Bearer {{ awx_token }}\" }\n\
        \      register: job\n      until: job.json.status in ['successful', 'failed',\
        \ 'error', 'canceled']\n      retries: 60\n      delay: 5\n      no_log: true\n\
        \n    # Si le retrait echoue, on ECHOUE : le finalizer n'est pas retire, la\n\
        \    # ressource ne disparait pas, et personne ne croit a une suppression\
        \ propre.\n    - name: Echouer si le retrait a echoue\n      ansible.builtin.fail:\n\
        \        msg: \"de-provisionnement : job AWX {{ launch.json.id }} termine\
        \ en {{ job.json.status }}\"\n      when: job.json.status != 'successful'\n\
        \n    - name: Retirer la sante publiee\n      ansible.builtin.uri:\n     \
        \   url: \"{{ k8s_api }}/apis/platform.kratix.io/v1alpha1/namespaces/{{ ansible_operator_meta.namespace\
        \ }}/healthrecords/ansible-runtime-{{ ansible_operator_meta.name }}\"\n  \
        \      method: DELETE\n        ca_path: \"{{ k8s_ca }}\"\n        headers:\
        \ { Authorization: \"Bearer {{ k8s_token }}\" }\n        status_code: [200,\
        \ 202, 404]\n      no_log: true\n"
      provision.yml: "---\n# R\xE9conciliation : imposer l'\xE9tat d\xE9clar\xE9 \xE0\
        \ une machine sans API d\xE9clarative.\n- name: Reconcilier un service legacy\n\
        \  hosts: localhost\n  connection: local\n  gather_facts: false\n  vars:\n\
        \    marker_state: present\n    awx_url: \"{{ lookup('env', 'AWX_URL') }}\"\
        \n    awx_token: \"{{ lookup('env', 'AWX_TOKEN') | trim }}\"\n    awx_job_template_name:\
        \ \"{{ lookup('env', 'AWX_JOB_TEMPLATE') }}\"\n    claim_api_version: \"{{\
        \ lookup('env', 'CLAIM_API_VERSION') }}\"\n    claim_plural: \"{{ lookup('env',\
        \ 'CLAIM_PLURAL') }}\"\n    # L'API Kubernetes, avec l'identite du controleur\
        \ (son compte de service).\n    k8s_api: https://kubernetes.default.svc\n\
        \    k8s_ca: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    k8s_token:\
        \ \"{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token')\
        \ }}\"\n    cr_url: \"https://kubernetes.default.svc/apis/temoin.ansible.example.io/v1alpha1/namespaces/{{\
        \ ansible_operator_meta.namespace }}/legacyservices/{{ ansible_operator_meta.name\
        \ }}\"\n  tasks:\n    - name: Le contrat d'execution est-il complet\n    \
        \  ansible.builtin.assert:\n        that:\n          - awx_url | length >\
        \ 0\n          - awx_token | length > 0\n          - awx_job_template_name\
        \ | length > 0\n        fail_msg: >-\n          AWX_URL, AWX_TOKEN et AWX_JOB_TEMPLATE\
        \ sont requis : sans eux le\n          controleur ne peut RIEN executer, et\
        \ ne doit surtout pas se declarer sain.\n\n    - name: Resoudre le job template\
        \ AWX declare\n      ansible.builtin.uri:\n        url: \"{{ awx_url }}/api/v2/job_templates/?name={{\
        \ awx_job_template_name | urlencode }}\"\n        headers: { Authorization:\
        \ \"Bearer {{ awx_token }}\" }\n      register: jt\n      no_log: true\n\n\
        \    - name: Le job template declare existe-t-il\n      # Liste en BLOC et\
        \ non en flot : `[ ... default([]) ... ]` casse\n      # l'analyse YAML (les\
        \ crochets internes ferment la sequence).\n      ansible.builtin.assert:\n\
        \        that:\n          - (jt.json.results | default([])) | length == 1\n\
        \        fail_msg: \"job template '{{ awx_job_template_name }}' introuvable\
        \ dans AWX\"\n\n    - name: Lancer l'automatisation sur la cible\n      ansible.builtin.uri:\n\
        \        url: \"{{ awx_url }}/api/v2/job_templates/{{ jt.json.results[0].id\
        \ }}/launch/\"\n        method: POST\n        headers: { Authorization: \"\
        Bearer {{ awx_token }}\" }\n        body_format: json\n        body:\n   \
        \       extra_vars:\n            service_name: \"{{ service_name }}\"\n  \
        \          marker_content: \"{{ message | default('gere par la plateforme')\
        \ }}\"\n            marker_state: \"{{ marker_state }}\"\n        status_code:\
        \ [201]\n      register: launch\n      no_log: true\n\n    - name: Attendre\
        \ la fin du job AWX\n      ansible.builtin.uri:\n        url: \"{{ awx_url\
        \ }}/api/v2/jobs/{{ launch.json.id }}/\"\n        headers: { Authorization:\
        \ \"Bearer {{ awx_token }}\" }\n      register: job\n      until: job.json.status\
        \ in ['successful', 'failed', 'error', 'canceled']\n      retries: 60\n  \
        \    delay: 5\n      no_log: true\n\n    - name: Publier l'etat sur la ressource\n\
        \      ansible.builtin.uri:\n        url: \"{{ cr_url }}/status\"\n      \
        \  method: PATCH\n        ca_path: \"{{ k8s_ca }}\"\n        headers:\n  \
        \        Authorization: \"Bearer {{ k8s_token }}\"\n          Content-Type:\
        \ application/merge-patch+json\n        body_format: json\n        # Le corps\
        \ est UNE SEULE expression Jinja : Ansible rend alors un vrai\n        # dictionnaire,\
        \ avec un ENTIER pour awxJobId. Ecrit champ par champ,\n        # \xAB {{\
        \ ... }} \xBB produirait la CHAINE \"12\" et l'API refuse en 422\n       \
        \ # (\xAB awxJobId in body must be of type integer \xBB \u2014 verifie).\n\
        \        body: >-\n          {{ {'status': {\n               'awxJobId': (launch.json.id\
        \ | int),\n               'awxJobStatus': job.json.status,\n             \
        \  'lastRunAt': (job.json.finished | default('')),\n               'serviceState':\
        \ ('configure' if job.json.status == 'successful' else 'en echec')\n     \
        \        }} }}\n        status_code: [200]\n      no_log: true\n\n    # \u2500\
        \u2500 La sante, par le mecanisme NATIF de la plateforme \u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\n    # Le runtime publie un HealthRecord ; Kratix l'agrege dans\n\
        \    # `status.healthStatus` de la demande, que la console lit deja.\n   \
        \ - name: Retrouver la demande Kratix (aucun nom de promesse en dur)\n   \
        \   ansible.builtin.uri:\n        url: \"{{ k8s_api }}/apis/{{ claim_api_version\
        \ }}/namespaces/{{ ansible_operator_meta.namespace }}/{{ claim_plural }}/{{\
        \ ansible_operator_meta.name }}\"\n        ca_path: \"{{ k8s_ca }}\"\n   \
        \     headers: { Authorization: \"Bearer {{ k8s_token }}\" }\n        status_code:\
        \ [200, 404]\n      register: claim\n      no_log: true\n      when: claim_plural\
        \ | length > 0\n\n    - name: Publier la sante du produit\n      ansible.builtin.uri:\n\
        \        # Application cote serveur : cree si absent, met a jour sinon \u2014\
        \ un seul appel.\n        url: \"{{ k8s_api }}/apis/platform.kratix.io/v1alpha1/namespaces/{{\
        \ ansible_operator_meta.namespace }}/healthrecords/ansible-runtime-{{ ansible_operator_meta.name\
        \ }}?fieldManager=ansible-operator-temoin&force=true\"\n        method: PATCH\n\
        \        ca_path: \"{{ k8s_ca }}\"\n        headers:\n          Authorization:\
        \ \"Bearer {{ k8s_token }}\"\n          Content-Type: application/apply-patch+yaml\n\
        \        body_format: json\n        # Meme raison qu'au-dessus : une expression\
        \ unique, pour que\n        # `generation` et `lastRun` restent des ENTIERS.\n\
        \        body: >-\n          {{ {'apiVersion': 'platform.kratix.io/v1alpha1',\
        \ 'kind': 'HealthRecord',\n              'metadata': {'name': 'ansible-runtime-'\
        \ + ansible_operator_meta.name,\n                           'namespace': ansible_operator_meta.namespace},\n\
        \              'data': {\n                'promiseRef': {'name': claim.json.metadata.labels['kratix.io/promise-name']},\n\
        \                'resourceRef': {'name': ansible_operator_meta.name,\n   \
        \                             'namespace': ansible_operator_meta.namespace,\n\
        \                                'generation': (claim.json.metadata.generation\
        \ | int)},\n                'state': ('healthy' if job.json.status == 'successful'\
        \ else 'unhealthy'),\n                'lastRun': (lookup('pipe', 'date +%s')\
        \ | int),\n                'details': {'source': 'ansible-operator-temoin',\
        \ 'check': 'job-awx',\n                            'reason': 'job AWX ' +\
        \ (launch.json.id | string) + ' termine en '\n                           \
        \           + job.json.status + ' (service ' + service_name\n            \
        \                          + ' sur la cible legacy)'}\n              }} }}\n\
        \        status_code: [200, 201]\n      no_log: true\n      when:\n      \
        \  - claim_plural | length > 0\n        - claim.status | default(0) == 200\n\
        \n    # En DERNIER : le statut et la sante sont publies AVANT d'echouer, sinon\n\
        \    # un echec ne laisserait aucune trace lisible.\n    - name: Echouer si\
        \ l'automatisation a echoue\n      ansible.builtin.fail:\n        msg: \"\
        job AWX {{ launch.json.id }} termine en {{ job.json.status }}\"\n      when:\
        \ job.json.status != 'successful'\n"
      watches.yaml: "---\n# La CRD \u2192 le playbook. `reconcilePeriod` est ce qui\
        \ distingue cette\n# architecture d'un simple lancement de playbook : toutes\
        \ les 2 minutes, l'\xE9tat\n# d\xE9clar\xE9 est re-impos\xE9 \xE0 la cible,\
        \ donc la d\xE9rive est corrig\xE9e SANS personne.\n- version: v1alpha1\n\
        \  group: temoin.ansible.example.io\n  kind: LegacyService\n  playbook: /opt/ansible/temoin/provision.yml\n\
        \  reconcilePeriod: 120s\n  # Le finalizer : \xE0 la suppression, un playbook\
        \ de D\xC9-PROVISIONNEMENT est jou\xE9\n  # pour de vrai. Tant qu'il \xE9\
        choue, la ressource ne part pas (d\xE9faut ferm\xE9).\n  finalizer:\n    name:\
        \ temoin.ansible.example.io/deprovision\n    playbook: /opt/ansible/temoin/deprovision.yml\n"
    kind: ConfigMap
    metadata:
      name: legacy-operator-content
      namespace: awx
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: legacy-operator
      name: legacy-operator
      namespace: awx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: legacy-operator
      template:
        metadata:
          annotations:
            content-revision: '5'
          labels:
            app: legacy-operator
        spec:
          containers:
          - args:
            - run
            - --watches-file=/opt/ansible/temoin/watches.yaml
            - --leader-election-id=legacy-operator
            command:
            - ansible-operator
            env:
            - name: WATCH_NAMESPACE
              value: ''
            - name: ANSIBLE_ROLES_PATH
              value: /opt/ansible/roles
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/ansible
            - name: ANSIBLE_REMOTE_TEMP
              value: /tmp/ansible
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_JOB_TEMPLATE
              value: legacy-service
            - name: AWX_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: awx-api-token
            - name: CLAIM_API_VERSION
              value: platform.example.io/v1alpha1
            - name: CLAIM_PLURAL
              value: legacyservicetemoins
            image: quay.io/operator-framework/ansible-operator@sha256:96053ae3e045c4eb57350cbf1995dece22bf7d3bfe4cf875a20d8853963a3731
            livenessProbe:
              httpGet:
                path: /healthz
                port: 6789
              initialDelaySeconds: 20
              periodSeconds: 30
            name: operator
            readinessProbe:
              httpGet:
                path: /readyz
                port: 6789
              initialDelaySeconds: 10
              periodSeconds: 15
            resources:
              limits:
                cpu: '1'
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
            - mountPath: /opt/ansible/temoin
              name: content
              readOnly: true
            - mountPath: /tmp
              name: runner
          priorityClassName: platform-high
          serviceAccountName: legacy-operator
          volumes:
          - configMap:
