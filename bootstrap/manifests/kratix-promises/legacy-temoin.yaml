apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  labels:
    kratix.io/promise-version: v0.0.1
  name: legacy-temoin
  annotations:
    platform.kratix.io/status-schema: "{\"conditions\": {\"path\": \".status.conditions\"\
      , \"label\": \"Conditions \xE9crites par le runtime \xE0 chaque r\xE9conciliation.\"\
      , \"type\": \"array\"}, \"awxJobId\": {\"path\": \".status.awxJobId\", \"label\"\
      : \"Identifiant du job AWX de la derni\xE8re ex\xE9cution.\", \"type\": \"integer\"\
      }, \"awxJobStatus\": {\"path\": \".status.awxJobStatus\", \"label\": \"Statut\
      \ du dernier job AWX (successful, failed\u2026).\", \"type\": \"string\"}, \"\
      lastRunAt\": {\"path\": \".status.lastRunAt\", \"label\": \"Horodatage de fin\
      \ de la derni\xE8re ex\xE9cution.\", \"type\": \"string\"}, \"serviceState\"\
      : {\"path\": \".status.serviceState\", \"label\": \"\xC9tat constat\xE9 du service\
      \ sur la machine cible.\", \"type\": \"string\"}}"
    platform.kratix.io/operator-group: temoin.ansible.example.io
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: legacyservicetemoins.platform.example.io
      namespace: default
    spec:
      group: platform.example.io
      names:
        kind: LegacyServiceTemoin
        plural: legacyservicetemoins
        singular: legacyservicetemoin
      scope: Namespaced
      versions:
      - additionalPrinterColumns:
        - jsonPath: .spec.serviceName
          name: Service
          type: string
        - jsonPath: .status.awxJobId
          name: Job AWX
          type: integer
        - jsonPath: .status.awxJobStatus
          name: "Dernier \xE9tat"
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: "\xC2ge"
          type: date
        name: v1alpha1
        schema:
          openAPIV3Schema:
            description: "Un service configur\xE9 sur une machine du parc legacy \u2014\
              \ une cible qui n'a aucune API d\xE9clarative et qu'on n'atteint qu'en\
              \ SSH. Kubernetes r\xE9concilie, Ansible (AWX) ex\xE9cute."
            properties:
              apiVersion:
                enum:
                - platform.example.io/v1alpha1
                type: string
              kind:
                enum:
                - LegacyServiceTemoin
                type: string
              metadata:
                type: object
              spec:
                properties:
                  markerContent:
                    default: gere par la plateforme
                    description: Message inscrit dans le fichier de configuration
                      du service.
                    maxLength: 200
                    type: string
                  serviceName:
                    description: Nom technique du service sur la machine cible.
                    pattern: ^[a-z][a-z0-9-]{2,30}$
                    type: string
                required:
                - serviceName
                type: object
              status:
                properties:
                  awxJobId:
                    description: "Identifiant du job AWX de la derni\xE8re ex\xE9\
                      cution."
                    type: integer
                  awxJobStatus:
                    description: "Statut du dernier job AWX (successful, failed\u2026\
                      )."
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        lastTransitionTime:
                          type: string
                        message:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                      type: object
                    type: array
                  lastRunAt:
                    description: "Horodatage de fin de la derni\xE8re ex\xE9cution."
                    type: string
                  serviceState:
                    description: "\xC9tat constat\xE9 du service sur la machine cible."
                    type: string
                type: object
            type: object
        served: true
        storage: true
        subresources:
          status: {}
    status:
      acceptedNames:
        kind: ''
        plural: ''
      conditions: null
      storedVersions: null
  dependencies:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: legacyservices.temoin.ansible.example.io
      namespace: default
    spec:
      group: temoin.ansible.example.io
      names:
        kind: LegacyService
        listKind: LegacyServiceList
        plural: legacyservices
        singular: legacyservice
      scope: Namespaced
      versions:
      - additionalPrinterColumns:
        - jsonPath: .spec.serviceName
          name: Service
          type: string
        - jsonPath: .status.awxJobId
          name: Job AWX
          type: integer
        - jsonPath: .status.awxJobStatus
          name: "Dernier \xE9tat"
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: "\xC2ge"
          type: date
        name: v1alpha1
        schema:
          openAPIV3Schema:
            description: "Un service configur\xE9 sur une machine du parc legacy \u2014\
              \ une cible qui n'a aucune API d\xE9clarative et qu'on n'atteint qu'en\
              \ SSH. Kubernetes r\xE9concilie, Ansible (AWX) ex\xE9cute."
            properties:
              apiVersion:
                type: string
              kind:
                type: string
              metadata:
                type: object
              spec:
                properties:
                  markerContent:
                    default: gere par la plateforme
                    description: Message inscrit dans le fichier de configuration
                      du service.
                    maxLength: 200
                    type: string
                  serviceName:
                    description: Nom technique du service sur la machine cible.
                    pattern: ^[a-z][a-z0-9-]{2,30}$
                    type: string
                required:
                - serviceName
                type: object
              status:
                properties:
                  awxJobId:
                    description: "Identifiant du job AWX de la derni\xE8re ex\xE9\
                      cution."
                    type: integer
                  awxJobStatus:
                    description: "Statut du dernier job AWX (successful, failed\u2026\
                      )."
                    type: string
                  conditions:
                    description: "Conditions \xE9crites par le runtime \xE0 chaque\
                      \ r\xE9conciliation."
                    items:
                      properties:
                        ansibleResult:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        lastTransitionTime:
                          type: string
                        message:
                          type: string
                        reason:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                      type: object
                    type: array
                  lastRunAt:
                    description: "Horodatage de fin de la derni\xE8re ex\xE9cution."
                    type: string
                  serviceState:
                    description: "\xC9tat constat\xE9 du service sur la machine cible."
                    type: string
                type: object
            type: object
        served: true
        storage: true
        subresources:
          status: {}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: legacy-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: legacy-operator-leader-election
      namespace: awx
    rules:
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - configmaps
      - events
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: legacy-operator-leader-election
      namespace: awx
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: legacy-operator-leader-election
    subjects:
    - kind: ServiceAccount
      name: legacy-operator
      namespace: awx
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: legacy-operator
      namespace: default
    rules:
    - apiGroups:
      - temoin.ansible.example.io
      resources:
      - legacyservices
      - legacyservices/status
      - legacyservices/finalizers
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ''
      resources:
      - events
      verbs:
      - create
      - patch
    - apiGroups:
      - platform.kratix.io
      resources:
      - healthrecords
      verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - platform.example.io
      resources:
      - legacyservicetemoins
      verbs:
      - get
      - list
      - watch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: legacy-operator
      namespace: default
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: legacy-operator
    subjects:
    - kind: ServiceAccount
      name: legacy-operator
      namespace: awx
  - apiVersion: v1
    data:
      watches.yaml: "---\n- version: v1alpha1\n  group: temoin.ansible.example.io\n\
        \  kind: LegacyService\n  playbook: /opt/ansible/generic/provision.yml\n \
        \ # Ce qui distingue cette architecture d'un playbook lanc\xE9 une fois :\
        \ l'\xE9tat\n  # d\xE9clar\xE9 est r\xE9-impos\xE9 \xE0 la machine \xE0 chaque\
        \ \xE9ch\xE9ance.\n  reconcilePeriod: 120s\n  finalizer:\n    name: temoin.ansible.example.io/deprovision\n\
        \    playbook: /opt/ansible/generic/deprovision.yml\n"
    kind: ConfigMap
    metadata:
      name: legacy-temoin-watches
      namespace: awx
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: legacy-operator
      name: legacy-operator
      namespace: awx
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: legacy-operator
      template:
        metadata:
          annotations:
            roles-revision: '4'
          labels:
            app: legacy-operator
        spec:
          containers:
          - args:
            - run
            - --watches-file=/opt/ansible/produit/watches.yaml
            - --leader-election-id=legacy-operator
            command:
            - ansible-operator
            env:
            - name: WATCH_NAMESPACE
              value: ''
            - name: ANSIBLE_ROLES_PATH
              value: /opt/ansible/roles
            - name: ANSIBLE_LOCAL_TEMP
              value: /tmp/ansible
            - name: ANSIBLE_REMOTE_TEMP
              value: /tmp/ansible
            - name: AWX_URL
              value: http://awx-service.awx.svc.cluster.local
            - name: AWX_JOB_TEMPLATE
              value: legacy-service
            - name: AWX_STATE_VAR
              value: marker_state
            - name: AWX_STATE_PRESENT
              value: present
            - name: AWX_STATE_ABSENT
              value: absent
            - name: AWX_ALLOWED_LIMITS
              value: ''
            - name: AWX_TIMEOUT_SECONDS
              value: '600'
            - name: AWX_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: awx-token-cloud
            - name: OPERAND_GROUP
              value: temoin.ansible.example.io
            - name: OPERAND_VERSION
              value: v1alpha1
            - name: OPERAND_PLURAL
              value: legacyservices
            - name: CLAIM_API_VERSION
              value: platform.example.io/v1alpha1
            - name: CLAIM_PLURAL
              value: legacyservicetemoins
            image: quay.io/operator-framework/ansible-operator@sha256:96053ae3e045c4eb57350cbf1995dece22bf7d3bfe4cf875a20d8853963a3731
            livenessProbe:
              httpGet:
                path: /healthz
                port: 6789
              initialDelaySeconds: 20
              periodSeconds: 30
            name: operator
            readinessProbe:
              httpGet:
                path: /readyz
                port: 6789
              initialDelaySeconds: 10
              periodSeconds: 15
            resources:
              limits:
                cpu: '1'
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
            - mountPath: /opt/ansible/roles
              name: roles
              readOnly: true
            - mountPath: /opt/ansible/generic
              name: generic
              readOnly: true
            - mountPath: /opt/ansible/produit
              name: produit
              readOnly: true
            - mountPath: /tmp
              name: runner
          priorityClassName: platform-high
          serviceAccountName: legacy-operator
          volumes:
          - configMap:
              items:
              - key: awx-contrat.yml
                path: awx-contrat/tasks/main.yml
              - key: awx-runner.yml
                path: awx-runner/tasks/main.yml
              - key: awx-remover.yml
                path: awx-remover/tasks/main.yml
              name: ansible-operator-roles
            name: roles
          - configMap:
              items:
              - key: provision.yml
                path: provision.yml
              - key: deprovision.yml
                path: deprovision.yml
              name: ansible-operator-roles
            name: generic
          - configMap:
              name: legacy-temoin-watches
            name: produit
          - emptyDir: {}
            name: runner
  destinationSelectors:
  - matchLabels:
      environment: platform
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:6593b04b050f902e17a62ff06042f5185f21d2c2a8f1d37da9bd822afb875f41
            name: backstage
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - env:
            - name: OPERATOR_GROUP
              value: temoin.ansible.example.io
            - name: OPERATOR_VERSION
              value: v1alpha1
            - name: OPERATOR_KIND
              value: LegacyService
            image: harbor.212-47-226-56.nip.io/platform/from-api-to-operator@sha256:0a5975c3f74e82f5f635810115a667ec38cbad9954e052d7168c2c6d450862bd
            name: from-api-to-operator
          - image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:6593b04b050f902e17a62ff06042f5185f21d2c2a8f1d37da9bd822afb875f41
            name: backstage
          jobOptions: {}
          rbac: {}
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
