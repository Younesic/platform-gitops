apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: dtrack-project
  labels:
    kratix.io/promise-version: v0.1.0
  annotations:
    platform.kratix.io/provider: platform
    platform.kratix.io/exposure: product
    platform.kratix.io/public: 'true'
    platform.kratix.io/operator-group: infra.contrib.fluxcd.io
    platform.kratix.io/adoption-non-destruction: moteur
    platform.kratix.io/adoptable: 'true'
    platform.kratix.io/status-schema: "{\"uuid\": {\"path\": \".status.availableOutputs.uuid\"\
      , \"label\": \"Identifiant de l'objet dans l'API \u2014 la liaison d'adoption.\"\
      , \"type\": \"string\"}}"
    backstage.example.io/ui-schema: "{\"properties\":{\"mode\":{\"ui:enumNames\":[\"\
      Observ\xE9\",\"Gouvern\xE9\",\"G\xE9r\xE9\"]}},\"ui:order\":[\"mode\",\"*\"\
      ]}"
    platform.kratix.io/tier: standard
spec:
  destinationSelectors:
  - matchLabels:
      environment: platform
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: dtrackprojects.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: DtrackProject
        plural: dtrackprojects
        singular: dtrackproject
      scope: Namespaced
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required:
                - team
                properties:
                  classifier:
                    type: string
                    enum:
                    - NONE
                    - APPLICATION
                    - FRAMEWORK
                    - LIBRARY
                    - CONTAINER
                    - OPERATING_SYSTEM
                    - DEVICE
                    - FIRMWARE
                    - FILE
                    - PLATFORM
                    - DEVICE_DRIVER
                    - MACHINE_LEARNING_MODEL
                    - DATA
                    - ''
                    default: ''
                  description:
                    type: string
                    maxLength: 255
                    default: ''
                  name:
                    type: string
                    maxLength: 255
                    default: ''
                  versionValeur:
                    type: string
                    default: ''
                  importId:
                    type: string
                    description: "Identifiant d'un objet EXISTANT \xE0 reprendre au\
                      \ lieu d'en cr\xE9er un. Vide = cr\xE9ation."
                    default: ''
                  team:
                    type: string
                    description: "\xC9quipe propri\xE9taire de la demande."
                  mode:
                    type: string
                    enum:
                    - observe
                    - gouverne
                    - gere
                    default: gere
                    description: "Niveau d'adoption. Observ\xE9 = la plateforme lit\
                      \ et compare, ne modifie rien. Gouvern\xE9 = chaque changement\
                      \ attend une approbation. G\xE9r\xE9 = la plateforme est la\
                      \ source de v\xE9rit\xE9 (d\xE9faut)."
  dependencies:
  - apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: dtrack-project-module
      namespace: default
    spec:
      interval: 10m
      url: https://github.com/Younesic/platform-gitops
      ref:
        commit: '22d8c5338296a1d87b11f3537c0440614a4b6fb3'
      provider: github
      secretRef:
        name: github-app
      sparseCheckout:
      - sources/api/dtrack-project
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: promise-configure
        spec:
          containers:
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            env:
            - name: UI_SCHEMA_REV
              value: 3a415027514a
            - name: CURATION_REV
              value: aa48971ae711
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: instance-configure
        spec:
          containers:
          - name: rendu-terraform
            image: harbor.212-47-226-56.nip.io/platform/promise-factory@sha256:4601da20f07bd959cfb78acd1058083c5625821014738725fc614bc327684a94
            env:
            - name: MODULE_PATH
              value: ./sources/api/dtrack-project
            - name: SOURCE_NAME
              value: dtrack-project-module
            - name: CIBLE_NAMESPACE
              value: default
            - name: CREDS_SECRET
              value: dtrack-api-creds
            - name: CHIFFREMENT_SECRET
              value: terraform-chiffrement
            - name: TF_INTERVAL
              value: 1h
            - name: APPROBATION
              value: auto
            - name: ADOPTION_FIELD
              value: mode
            - name: TF_INTERVAL_OBSERVE
              value: 24h
            - name: ADOPTION_LIAISON_FIELD
              value: importId
            - name: VAR_MAP
              value: '{"classifier": "classifier", "description": "description", "name":
                "name", "versionValeur": "version_valeur", "importId": "import_id"}'
            command:
            - python
            - -c
            args:
            - "import json, os, pathlib, yaml\n\no = yaml.safe_load(pathlib.Path(\"\
              /kratix/input/object.yaml\").read_text())\nnom  = o[\"metadata\"][\"\
              name\"]\nspec = o.get(\"spec\") or {}\n\n# Les variables du module,\
              \ d\xE9riv\xE9es du spec de la demande.\n# Un champ absent n'est PAS\
              \ \xE9mis : le d\xE9faut du module s'applique.\nvariables = []\nfor\
              \ champ, var in json.loads(os.environ[\"VAR_MAP\"]).items():\n    if\
              \ champ in spec and spec[champ] is not None:\n        variables.append({\"\
              name\": var, \"value\": spec[champ]})\n\ntf = {\n  \"apiVersion\": \"\
              infra.contrib.fluxcd.io/v1alpha2\",\n  \"kind\": \"Terraform\",\n  \"\
              metadata\": {\"name\": nom, \"namespace\": os.environ[\"CIBLE_NAMESPACE\"\
              ]},\n  \"spec\": {\n    \"interval\": os.environ[\"TF_INTERVAL\"],\n\
              \    \"path\": os.environ[\"MODULE_PATH\"],\n    \"sourceRef\": {\n\
              \      \"kind\": \"GitRepository\",\n      \"name\": os.environ[\"SOURCE_NAME\"\
              ],\n      \"namespace\": os.environ[\"CIBLE_NAMESPACE\"],\n    },\n\
              \    # \u26A0\uFE0F vaut FALSE par d\xE9faut : sans cette ligne, supprimer\
              \ une demande ne\n    # d\xE9truirait RIEN et laisserait la ressource\
              \ orpheline.\n    \"destroyResourcesOnDeletion\": True,\n    \"storeReadablePlan\"\
              : \"human\",\n    \"writeOutputsToSecret\": {\"name\": nom + \"-sorties\"\
              },\n    \"vars\": variables,\n    # DEUX secrets d'environnement : les\
              \ identifiants du FOURNISSEUR (d\xE9clar\xE9s par\n    # le produit)\
              \ et le CHIFFREMENT DE L'\xC9TAT (d\xE9cision de PLATEFORME).\n    #\
              \ \u26A0\uFE0F Aucun des deux n'est une variable terraform : une variable\
              \ atterrit dans\n    # l'\xE9tat ET dans le plan, et `sensitive` masque\
              \ l'affichage, pas le stockage.\n    # Le second est OPTIONNEL : sans\
              \ lui le runner d\xE9marre quand m\xEAme et l'\xE9tat\n    # repart\
              \ en clair \u2014 un d\xE9faut visible vaut mieux qu'un pod qui refuse\
              \ de na\xEEtre.\n    \"runnerPodTemplate\": {\n      \"spec\": {\"envFrom\"\
              : [\n        {\"secretRef\": {\"name\": os.environ[\"CREDS_SECRET\"\
              ]}},\n        {\"secretRef\": {\"name\": os.environ.get(\"CHIFFREMENT_SECRET\"\
              , \"terraform-chiffrement\"),\n                       \"optional\":\
              \ True}},\n      ]}\n    },\n  },\n}\n# \u2500\u2500 LE NIVEAU D'ADOPTION\
              \ \u2192 les r\xE9glages du moteur (docs/ADOPTION-STANDARD.md \xA74)\
              \ \u2500\u2500\nchamp_adoption = os.environ.get(\"ADOPTION_FIELD\",\
              \ \"\")\nmode = str(spec.get(champ_adoption) or \"gere\") if champ_adoption\
              \ else \"gere\"\nif mode == \"observe\":\n    # Lit et compare, ne touche\
              \ RIEN : plan sans apply, jamais de destruction,\n    # cadence longue\
              \ (une d\xE9tection de d\xE9rive n'a pas besoin de tourner \xE0 l'heure).\n\
              \    tf[\"spec\"][\"planOnly\"] = True\n    tf[\"spec\"][\"destroyResourcesOnDeletion\"\
              ] = False\n    tf[\"spec\"][\"interval\"] = os.environ.get(\"TF_INTERVAL_OBSERVE\"\
              , \"24h\")\nelif mode == \"gouverne\":\n    # approvePlan ABSENT : le\
              \ plan attend une approbation (pos\xE9e par PR, gat\xE9e\n    # par\
              \ le portier ITSM \u2014 jamais appliqu\xE9e toute seule).\n    tf[\"\
              spec\"][\"destroyResourcesOnDeletion\"] = False\nelif os.environ.get(\"\
              APPROBATION\", \"auto\") == \"auto\":\n    tf[\"spec\"][\"approvePlan\"\
              ] = \"auto\"\n\n# \u2500\u2500 ADOPTION-STANDARD \xA73bis : LA NON-DESTRUCTION\
              \ D'UN ADOPT\xC9 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
              \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# La garantie\
              \ ne d\xE9pend PAS du niveau : ce que la plateforme n'a pas cr\xE9\xE9\
              , elle ne\n# le d\xE9truit pas en partant \u2014 G\xE9r\xE9 compris.\
              \ Pour terraform le porteur est CE champ\n# (l'objet Terraform est l'ENTR\xC9\
              E d'un contr\xF4leur : le prot\xE9ger du prune en ferait\n# un orphelin\
              \ qui replanifie sans demandeur).\n# \u26A0\uFE0F Cette ligne DOIT rester\
              \ la derni\xE8re \xE0 \xE9crire le champ : elle a le dernier mot\n#\
              \ sur la branche `gere` ci-dessus, qui laisse le d\xE9faut destructeur.\n\
              liaison = os.environ.get(\"ADOPTION_LIAISON_FIELD\", \"\")\nadopte =\
              \ mode != \"gere\" or bool(str(spec.get(liaison) or \"\") if liaison\
              \ else \"\")\nif adopte:\n    tf[\"spec\"][\"destroyResourcesOnDeletion\"\
              ] = False\n\npathlib.Path(\"/kratix/output/terraform.yaml\").write_text(\n\
              \    yaml.safe_dump(tf, sort_keys=False, allow_unicode=True))\nprint(\"\
              rendu : Terraform/\" + nom + \" \xB7 mode=\" + mode\n      + (\" \xB7\
              \ ADOPT\xC9 (non destructible)\" if adopte else \"\")\n      + \" (\"\
              \ + str(len(variables)) + \" variable(s))\")\n"
          - name: backstage
            image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:13d1bb9e4e5d252455e54321154670b9e06bac6a88774cfb5ac69a7325db8479
            env:
            - name: ADOPTION_NON_DESTRUCTION
              value: moteur
          rbac: {}
          jobOptions: {}
