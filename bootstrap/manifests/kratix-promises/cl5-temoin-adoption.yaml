apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: cl5-temoin-adoption
  labels:
    kratix.io/promise-version: v0.0.1
  annotations:
    # ── CL5 : TÉMOIN JETABLE de l'adoption OPERATOR (AU7 b→d) ─────────────────
    # Écrite MAIN, sur le modèle d'AU2/AU3 : on éprouve le mécanisme sur une cible
    # inoffensive AVANT de l'industrialiser. Elle sera retirée après la preuve.
    #
    # ⚠️ SANS `dependencies`, et c'est le point de conception : la CRD
    # `motds.temoin.ansible.example.io` et son opérateur EXISTENT DÉJÀ. Une
    # promesse operator ordinaire embarque les manifestes de son opérateur (8
    # objets pour motd-temoin) — et `wire_adoption_routing` REFUSE alors le
    # routage, parce que des dependencies ont besoin du pin Promise pour se
    # placer. L'adoption operator suppose donc un opérateur DÉJÀ installé : c'est
    # la 3ᵉ limite d'AU7, dite à la génération, jamais découverte au 1er claim.
    platform.kratix.io/provider: indus
    # brique interne : PAS de Template au marketplace — ce témoin ne s'offre pas,
    # il se prouve. (SL0 : la fiche reste poussée, donc la console le voit.)
    platform.kratix.io/exposure: internal
    platform.kratix.io/adoptable: "true"
    # ⚠️ ADOPTION-STANDARD / AU7 — LE CANAL DU NIVEAU EST UNE ANNOTATION.
    # La CRD `Motd` est TIERCE : son spec n'accepte que `bannerText` et
    # `jobTemplate`, sans `x-kubernetes-preserve-unknown-fields`. Le renderer
    # officiel recopie le spec du claim TEL QUEL dans le CR ⇒ un champ `mode`
    # dans le spec produirait un `strict decoding error` à l'admission du CR
    # (leçon OP6). Le niveau voyage donc en annotation, jamais dans le contrat.
    platform.kratix.io/adoption-canal: annotation
    # §3bis — l'objet rendu est un CR d'une CRD tierce, qui n'offre aucun levier
    # de non-destruction : le seul porteur possible est la CEINTURE.
    platform.kratix.io/adoption-non-destruction: ceinture
    # BR3 — la famille d'API, pour l'onglet Kubernetes live de la console.
    platform.kratix.io/operator-group: temoin.ansible.example.io
spec:
  # ⚠️ PAS de `destinationSelectors` au niveau Promise : le pin est INOVERRIDABLE
  # par le workflow (précédence RT1), et avec lui un claim observé n'atteindrait
  # JAMAIS la destination d'adoption — il serait appliqué quand même, et le badge
  # mentirait. Le placement vient de bc (ADOPTION_ROUTING ci-dessous).
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: cl5motds.platform.example.io
    spec:
      group: platform.example.io
      names:
        kind: Cl5Motd
        plural: cl5motds
        singular: cl5motd
      scope: Namespaced
      versions:
        - name: v1alpha1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  # ⚠️ CES CHAMPS SONT RECOPIÉS TELS QUELS DANS LE CR `Motd` :
                  # ils doivent donc être EXACTEMENT ceux que sa CRD accepte.
                  properties:
                    bannerText:
                      type: string
                      description: Message d'accueil affiché par l'opérateur.
                  required:
                    - bannerText
  workflows:
    promise:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: promise-configure
          spec:
            containers:
              - name: backstage
                image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:f8881df50239ee90c1611efd5dd0cee4627e1d5757e7242888515c67ade62edc
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: instance-configure
          spec:
            containers:
              # 1) le renderer OFFICIEL de l'amont : il rend un CR `Motd` NOMMÉ
              #    D'APRÈS LE CLAIM. C'est la LIAISON par convention de noms — la
              #    même que l'adoption helm d'AU3 : un claim nommé `cl5-legacy`
              #    reprend le CR `cl5-legacy` qui existe déjà.
              - name: from-api-to-operator
                image: harbor.212-47-226-56.nip.io/platform/from-api-to-operator@sha256:0a5975c3f74e82f5f635810115a667ec38cbad9954e052d7168c2c6d450862bd
                env:
                  - name: OPERATOR_GROUP
                    value: temoin.ansible.example.io
                  - name: OPERATOR_VERSION
                    value: v1alpha1
                  - name: OPERATOR_KIND
                    value: Motd
              # 2) le conteneur partagé : fiche, graphe, status — et le ROUTAGE
              #    par niveau + la ceinture des adoptés (AU5 / §3bis).
              - name: backstage
                image: harbor.212-47-226-56.nip.io/platform/backstage-component@sha256:f8881df50239ee90c1611efd5dd0cee4627e1d5757e7242888515c67ade62edc
                env:
                  - name: ADOPTION_ROUTING
                    value: "on"
                  - name: ADOPTION_PLACEMENT
                    value: environment=platform
                  - name: ADOPTION_NON_DESTRUCTION
                    value: ceinture
