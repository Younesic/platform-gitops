# Amorçage des identifiants iTop — GÉNÉRÉS DANS LE CLUSTER, JAMAIS EN GIT.
#
# Pourquoi pas un SealedSecret comme ailleurs dans ce dépôt : sceller un secret
# suppose de le connaître, donc de le faire transiter. Ici personne ne le voit —
# ni l'agent, ni le dépôt, ni le journal du Job (les valeurs vont directement de
# /dev/urandom au `kubectl create secret`, aucune n'est affichée).
#
# Contrepartie ASSUMÉE, écrite noir sur blanc : l'instance n'est PAS
# reconstructible à l'identique depuis Git seul. Les DONNÉES le sont (volume +
# base), les IDENTIFIANTS non. Commande de récupération pour Younes dans le
# README de ce dossier.
#
# Ordonnancement : hook PreSync (avant MariaDB et iTop, qui montent ce Secret).
# Le RBAC est lui-même un hook PreSync de vague INFÉRIEURE — sinon il serait
# appliqué en phase Sync, c'est-à-dire APRÈS le Job qui en a besoin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: itop-bootstrap
  namespace: itop
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: itop-bootstrap
  namespace: itop
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  # Strictement ce qu'il faut : constater l'existence, créer si absent.
  # Pas de `update`, pas de `delete` : un second passage ne peut PAS écraser
  # des identifiants en service (ce serait la panne silencieuse classique).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: itop-bootstrap
  namespace: itop
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: itop-bootstrap }
subjects:
  - { kind: ServiceAccount, name: itop-bootstrap, namespace: itop }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: itop-bootstrap-credentials
  namespace: itop
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: itop-bootstrap-credentials } }
    spec:
      restartPolicy: Never
      serviceAccountName: itop-bootstrap
      containers:
        - name: bootstrap
          image: alpine/k8s:1.35.3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              if kubectl -n itop get secret itop-credentials >/dev/null 2>&1; then
                echo "Secret itop-credentials déjà présent → rien à faire (idempotent)."
                exit 0
              fi
              echo "Secret absent → génération des identifiants DANS le cluster."
              # Alphanumérique uniquement : ces valeurs traversent une variable
              # d'environnement MariaDB, un fichier XML de paramètres et un
              # fichier de configuration PHP. Un caractère spécial casserait
              # l'un des trois, silencieusement. 32 caractères ≈ 190 bits.
              gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom 2>/dev/null | head -c 32 || true; }
              for v in ROOT DB ADMIN REST; do
                eval "P_$v=\$(gen)"
                eval "len=\${#P_$v}"
                [ "$len" -eq 32 ] || { echo "ERREUR: génération aléatoire incomplète ($v)"; exit 1; }
              done
              kubectl -n itop create secret generic itop-credentials \
                --from-literal=MARIADB_ROOT_PASSWORD="$P_ROOT" \
                --from-literal=MARIADB_PASSWORD="$P_DB" \
                --from-literal=ITOP_ADMIN_PASSWORD="$P_ADMIN" \
                --from-literal=ITOP_REST_PASSWORD="$P_REST" >/dev/null
              echo "Secret itop-credentials créé (4 clés, aucune valeur affichée)."
