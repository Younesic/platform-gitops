# ── AU2 : LES DESTINATIONS DE L'ADOPTION — le routage par NIVEAU ────────────────
#
# Le niveau d'adoption des moteurs helm/operator/compound se règle dans ArgoCD
# (docs/ADOPTION-STANDARD.md §4 : « la dernière couche avant la ressource réelle »).
# Trois politiques ⇒ trois chemins du statestore ⇒ trois Applications :
#
#   worker-1            (existant)          gere      automated{selfHeal,prune}
#   adoption/observe    (cette Destination) observe   AUCUN syncPolicy — diff seul
#   adoption/gouverne   (cette Destination) gouverne  automated SANS selfHeal SANS prune
#
# Un pipeline route la sortie d'un claim par SON mode : il écrit
# /kratix/metadata/destination-selectors.yaml {environment: platform, adoption: <mode>}
# (routage par la donnée du claim — natif Kratix, le mécanisme conçu par RT2).
#
# ⚠️⚠️ LE LABEL `adoption` EST SEUL, ET C'EST LE VRAI VERROU — appris de la PORTE :
# la correspondance Kratix est par SOUS-ENSEMBLE (selectors du work ⊆ labels de la
# destination) et `strictMatchLabels` ne bloque QUE les works aux selectors VIDES.
# Première version (labels {environment: platform, adoption: x}) : les DÉPENDANCES de
# TOUTES les promesses ordinaires (selector {environment: platform}) sont IMMÉDIATEMENT
# entrées dans les chemins d'adoption, et un claim gere y est tombé — CONSTATÉ sur les
# workplacements, pas supposé. Sans `environment` dans les labels, un selector ordinaire
# ne peut plus matcher ; et `strictMatchLabels` ferme le dernier trou (les works sans
# selectors, qui sinon se placent au hasard).
#
# ⚠️ `initWorkloads: enabled: true` (comme worker-1) : crée le chemin dans kratix-state
# dès la naissance de la Destination — sans lui, les Applications ArgoCD pointeraient un
# chemin inexistant (ComparisonError). Contrepartie : les canaries Kratix y naissent
# aussi → les Applications les EXCLUENT (elles n'ont pas à être appliquées ici).
apiVersion: platform.kratix.io/v1alpha1
kind: Destination
metadata:
  name: adoption-observe
  labels:
    adoption: observe
spec:
  path: adoption/observe
  strictMatchLabels: true
  stateStoreRef:
    name: default
    kind: GitStateStore
---
apiVersion: platform.kratix.io/v1alpha1
kind: Destination
metadata:
  name: adoption-gouverne
  labels:
    adoption: gouverne
spec:
  path: adoption/gouverne
  strictMatchLabels: true
  stateStoreRef:
    name: default
    kind: GitStateStore
