# ─────────────────────────────────────────────────────────────────────────────
# awx-operator 2.19.1 — RBAC + manager, RENDU VENDORISÉ (ne pas éditer à la main)
#
# Écarts ASSUMÉS par rapport au rendu brut — ce sont les seuls :
#   1. Namespace retiré      → géré par 00-namespace.yaml (R-TPL-7, vague -2).
#   2. imagePullSecrets      → `redhat-operators-pull-secret` retiré : ce Secret n'existe
#                              pas ici et quay.io/ansible est public (sinon
#                              FailedToRetrieveImagePullSecret à chaque démarrage).
#   3. manager_auth_proxy_patch NON appliqué → pas de sidecar
#                              gcr.io/kubebuilder/kube-rbac-proxy (registre déprécié ;
#                              une image non tirable = opérateur jamais Ready).
#                              Sans conséquence : le manager expose ses métriques sur
#                              127.0.0.1:8080 (controller_manager_config) — rien à protéger.
#   4. priorityClassName: platform-high (convention plateforme).
#   5. env RELATED_IMAGE_*   → LE levier d'épinglage par EMPREINTE des images AWX :
#                              l'opérateur les utilise telles quelles
#                              (roles/installer/tasks/resources_configuration.yml:231,246
#                               et set_images.yml). Sans elles il composerait `image:tag`,
#                              et un tag est mouvant (awx-ee:latest a été rebâti en 2026).
# ─────────────────────────────────────────────────────────────────────────────
