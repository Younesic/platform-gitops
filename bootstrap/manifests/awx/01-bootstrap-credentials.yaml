# Amorçage des identifiants AWX — GÉNÉRÉS DANS LE CLUSTER, JAMAIS EN GIT.
#
# Même geste que pour iTop : sceller un secret suppose de le connaître, donc de le
# faire transiter. Ici personne ne le voit — ni l'agent, ni le dépôt, ni le journal
# du Job : les valeurs vont de /dev/urandom (ou de ssh-keygen) directement dans
# `kubectl create secret`, aucune n'est affichée.
#
# Contrepartie ASSUMÉE : l'instance n'est PAS reconstructible à l'identique depuis Git
# seul. Les DONNÉES le sont (base + jeu d'essai rejouable), les IDENTIFIANTS non.
# Commandes de récupération pour Younes : README.md de ce dossier.
#
# Ordonnancement : hook PreSync (avant CNPG et l'AWX CR, qui montent ces Secrets).
# Le RBAC est un hook PreSync de vague INFÉRIEURE — sinon il serait appliqué en phase
# Sync, c'est-à-dire APRÈS le Job qui en a besoin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awx-bootstrap
  namespace: awx
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awx-bootstrap
  namespace: awx
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  # Strictement ce qu'il faut : constater l'existence, créer si absent.
  # Pas d'`update`, pas de `delete` : un second passage ne PEUT PAS écraser des
  # identifiants en service (la panne silencieuse classique).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awx-bootstrap
  namespace: awx
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: awx-bootstrap }
subjects:
  - { kind: ServiceAccount, name: awx-bootstrap, namespace: awx }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: awx-bootstrap-credentials
  namespace: awx
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: awx-bootstrap-credentials } }
    spec:
      restartPolicy: Never
      serviceAccountName: awx-bootstrap
      priorityClassName: platform-high
      volumes:
        - name: keys
          emptyDir: { medium: Memory }
      # La paire SSH de la cible témoin est produite ici : `alpine/k8s` n'embarque
      # PAS ssh-keygen (vérifié : `command -v ssh-keygen` vide).
      # RSA 4096 en PEM classique et non ed25519 : c'est le format que le validateur
      # d'identifiants d'AWX accepte sans discussion — et c'est de circonstance pour
      # une cible « legacy ».
      initContainers:
        - name: keygen
          image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          volumeMounts: [{ name: keys, mountPath: /keys }]
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              apk add --no-cache openssh-keygen >/dev/null
              ssh-keygen -q -t rsa -b 4096 -m PEM -N '' -C 'awx@legacy-vm' -f /keys/id_rsa
              # Seules les TAILLES sont affichées, jamais le contenu.
              echo "paire SSH générée : privée $(wc -c < /keys/id_rsa) octets, publique $(wc -c < /keys/id_rsa.pub) octets"
      containers:
        - name: bootstrap
          image: alpine/k8s@sha256:097aa60cbef561146757c7494468e9d7b04d843597ad1a1515ed09d0708c8014 # alpine/k8s:1.35.3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts: [{ name: keys, mountPath: /keys }]
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              # Alphanumérique uniquement : ces valeurs traversent une URL de connexion
              # PostgreSQL et un fichier de configuration Python. La documentation
              # awx-operator l'exige d'ailleurs explicitement pour le mot de passe base
              # (« should not contain quotes or backslashes »). 32 caractères ≈ 190 bits.
              gen() { LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom 2>/dev/null | head -c 32 || true; }
              chk() { [ "${#1}" -eq 32 ] || { echo "ERREUR: génération aléatoire incomplète"; exit 1; }; }

              # ── 1. Mot de passe de l'administrateur AWX ──────────────────────────
              if kubectl -n awx get secret awx-admin-password >/dev/null 2>&1; then
                echo "awx-admin-password déjà présent → inchangé (idempotent)."
              else
                P_ADMIN=$(gen); chk "$P_ADMIN"
                kubectl -n awx create secret generic awx-admin-password \
                  --from-literal=password="$P_ADMIN" >/dev/null
                echo "awx-admin-password créé."
              fi

              # ── 2 & 3. Le couple base de données, traité comme UN TOUT ───────────
              # Les deux Secrets portent le MÊME mot de passe : l'un sert à CNPG pour
              # créer le rôle, l'autre à AWX pour s'y connecter. Les créer séparément
              # ferait diverger les deux au moindre passage partiel — d'où le garde-fou.
              HAS_DB=0; HAS_PG=0
              kubectl -n awx get secret awx-db-credentials      >/dev/null 2>&1 && HAS_DB=1 || true
              kubectl -n awx get secret awx-postgres-configuration >/dev/null 2>&1 && HAS_PG=1 || true
              if [ "$HAS_DB" -ne "$HAS_PG" ]; then
                echo "ERREUR: état incohérent (awx-db-credentials=$HAS_DB, awx-postgres-configuration=$HAS_PG)."
                echo "Les deux portent le même mot de passe : il faut supprimer celui qui reste et rejouer."
                exit 1
              fi
              if [ "$HAS_DB" -eq 1 ]; then
                echo "couple base de données déjà présent → inchangé (idempotent)."
              else
                P_DB=$(gen); chk "$P_DB"
                kubectl -n awx create secret generic awx-db-credentials \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username=awx \
                  --from-literal=password="$P_DB" >/dev/null
                kubectl -n awx create secret generic awx-postgres-configuration \
                  --from-literal=host=awx-db-rw.awx.svc.cluster.local \
                  --from-literal=port=5432 \
                  --from-literal=database=awx \
                  --from-literal=username=awx \
                  --from-literal=password="$P_DB" \
                  --from-literal=sslmode=prefer \
                  --from-literal=type=unmanaged >/dev/null
                echo "awx-db-credentials + awx-postgres-configuration créés (même mot de passe)."
              fi

              # ── 4. La clé SSH de la cible témoin ─────────────────────────────────
              # La privée alimentera l'identifiant machine d'AWX, la publique le
              # authorized_keys du pod « VM legacy ». Aucune des deux n'est affichée.
              if kubectl -n awx get secret awx-legacy-ssh >/dev/null 2>&1; then
                echo "awx-legacy-ssh déjà présent → inchangé (idempotent)."
              else
                kubectl -n awx create secret generic awx-legacy-ssh \
                  --from-file=ssh-privatekey=/keys/id_rsa \
                  --from-file=ssh-publickey=/keys/id_rsa.pub >/dev/null
                echo "awx-legacy-ssh créé (2 clés, aucune valeur affichée)."
              fi
              echo "Amorçage terminé."
