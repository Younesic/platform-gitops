# ── LE CONTENU ANSIBLE, ET SA DISTRIBUTION À AWX ─────────────────────────────
#
# Chez le client, un projet AWX pointe vers son GitLab. Ici les dépôts de la
# plateforme sont privés (clés de déploiement) et l'instance AWX est une doublure :
# on distribue le playbook par ARCHIVE HTTP servie dans le cluster (type de projet
# « Remote Archive », natif AWX). Zéro identifiant, zéro dépendance sortante,
# et le contenu reste dans Git — ici même.
#
# ⚠️ En modifiant le playbook, incrémenter `playbooks-revision` dans le modèle de
# pod ci-dessous : c'est ce qui force la reconstruction de l'archive.
apiVersion: v1
kind: ConfigMap
metadata:
  name: awx-playbooks-src
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  legacy-marker.yml: |
    ---
    # Produit « service legacy » : configure un service sur une cible qui n'a
    # AUCUNE API déclarative — on n'y accède qu'en SSH.
    #
    # Trois propriétés, et ce sont elles qui comptent :
    #   · idempotent      — rejoué, il ne change rien (changed=0) ;
    #   · paramétré       — les valeurs viennent du sondage / des extra_vars ;
    #   · réversible      — marker_state=absent dé-provisionne réellement.
    # La troisième est ce qui permettra au finalizer d'un opérateur de faire
    # disparaître l'effet, au lieu de laisser un objet orphelin sur la cible.
    - name: Service legacy sur cible sans API declarative
      hosts: all
      # L'automate entre sous un compte de service : les gestes système
      # (compte, sudoers, /opt) passent donc par sudo. Le cadrage n'est pas ici,
      # il est au-dessus : quel job template, sur quel inventaire, avec quel jeton.
      become: true
      gather_facts: false
      vars:
        service_name: legacy-app
        marker_content: "gere par la plateforme"
        marker_state: present
      tasks:
        - name: Amorcer l'interpreteur Python (cible legacy)
          # Le geste classique face à une cible qui n'a rien : `raw` ne demande
          # pas d'interpréteur. changed_when: false — c'est un constat, pas un
          # changement, et l'idempotence de la lecture ne doit pas être polluée.
          ansible.builtin.raw: command -v python3 >/dev/null || apk add --no-cache python3
          changed_when: false

        - name: Repertoire d'installation
          ansible.builtin.file:
            path: /opt/legacy
            state: directory
            mode: "0755"
          when: marker_state == "present"

        - name: Fichier de configuration du service
          ansible.builtin.copy:
            dest: "/opt/legacy/{{ service_name }}.conf"
            mode: "0644"
            content: |
              # genere par la plateforme - ne pas editer a la main
              service={{ service_name }}
              message={{ marker_content }}
          when: marker_state == "present"

        - name: Retrait du service (de-provisionnement)
          ansible.builtin.file:
            path: "/opt/legacy/{{ service_name }}.conf"
            state: absent
          when: marker_state == "absent"

        - name: Etat constate sur la cible
          ansible.builtin.stat:
            path: "/opt/legacy/{{ service_name }}.conf"
          register: marker

        - name: Resultat
          ansible.builtin.debug:
            msg: "{{ service_name }} : fichier {{ 'PRESENT' if marker.stat.exists else 'ABSENT' }} sur {{ inventory_hostname }}"
  legacy-motd.yml: |
    ---
    # Second produit du parc legacy : la banniere de connexion (/etc/motd).
    # Meme forme que legacy-marker (parametre, idempotent, reversible) mais un
    # AUTRE job template, un AUTRE fournisseur : c'est ce qui permet de prouver
    # qu'un produit ne peut pas lancer l'automatisation d'un autre.
    - name: Banniere de connexion sur cible sans API declarative
      hosts: all
      # L'automate entre sous un compte de service : les gestes système
      # (compte, sudoers, /opt) passent donc par sudo. Le cadrage n'est pas ici,
      # il est au-dessus : quel job template, sur quel inventaire, avec quel jeton.
      become: true
      gather_facts: false
      vars:
        banner_text: "Acces reserve - plateforme"
        marker_state: present
      tasks:
        - name: Amorcer l'interpreteur Python (cible legacy)
          ansible.builtin.raw: command -v python3 >/dev/null || apk add --no-cache python3
          changed_when: false

        - name: Poser la banniere
          ansible.builtin.copy:
            dest: /opt/legacy/motd
            mode: "0644"
            content: |
              {{ banner_text }}
          when: marker_state == "present"

        - name: Retirer la banniere (de-provisionnement)
          ansible.builtin.file:
            path: /opt/legacy/motd
            state: absent
          when: marker_state == "absent"

        - name: Etat constate
          ansible.builtin.stat:
            path: /opt/legacy/motd
          register: motd

        - name: Resultat
          ansible.builtin.debug:
            msg: "banniere {{ 'PRESENTE' if motd.stat.exists else 'ABSENTE' }} sur {{ inventory_hostname }}"

  compte-service.yml: |
    ---
    # Produit « compte de service applicatif » — la PREMIÈRE offre Ansible réelle.
    #
    # Le cas d'école bancaire : une application a besoin d'un compte technique sur
    # un serveur du parc. Aujourd'hui c'est un ticket, un échange, un accès posé à
    # la main, et personne ne sait six mois plus tard qui l'a demandé ni pourquoi.
    # Ici : une demande dans le portail, une approbation, un accès posé — et
    # surtout, RETIRÉ pour de bon quand la demande disparaît.
    #
    # Les trois propriétés qui comptent (les mêmes que le témoin) :
    #   · idempotent  — rejoué toutes les 2 minutes par l'opérateur, il ne change rien ;
    #   · paramétré   — tout vient du sondage / des extra_vars, rien n'est en dur ;
    #   · réversible  — account_state=absent supprime le compte, sa clé et son sudo.
    #
    # ⚠️ Les noms de variables sont AUSSI ceux de `meta/argument_specs.yml` et du
    # sondage AWX. Les trois doivent coïncider : AN3 a montré qu'un écart rend le
    # produit inutilisable, puis INDESTRUCTIBLE (son finalizer échoue en boucle).
    - name: Compte de service applicatif sur une cible sans API declarative
      hosts: all
      # L'automate entre sous un compte de service : les gestes système
      # (compte, sudoers, /opt) passent donc par sudo. Le cadrage n'est pas ici,
      # il est au-dessus : quel job template, sur quel inventaire, avec quel jeton.
      become: true
      gather_facts: false
      vars:
        account_name: ""
        ssh_public_key: ""
        sudo_command: ""
        account_state: present
      tasks:
        - name: Amorcer l'interpreteur et l'outillage de comptes (cible legacy)
          # `raw` ne demande pas d'interpreteur — le geste face a une cible nue.
          # Alpine n'a pas useradd : il vient du paquet shadow. changed_when:false,
          # c'est un amorcage, pas un changement du service rendu.
          ansible.builtin.raw: >-
            command -v python3 >/dev/null || apk add --no-cache python3;
            command -v useradd >/dev/null || apk add --no-cache shadow;
            command -v visudo  >/dev/null || apk add --no-cache sudo
          changed_when: false

        - name: Refuser une demande sans nom de compte
          # Garde-fou de derniere ligne : le contrat et le CRD l'exigent deja,
          # mais un playbook qui creerait un compte vide est pire qu'un echec.
          ansible.builtin.assert:
            that: account_name | length > 0
            fail_msg: "account_name est vide — demande refusee"

        # ── Dire NON tot, et le dire en francais ──────────────────────────────
        # Ces deux verifications existaient de fait, mais TROP TARD et TROP BAS :
        # sudo refusait la commande par un vidage de visudo au milieu du journal,
        # et une cle bidon passait SANS BRONCHER. Vecu : « ls -a » (au lieu de
        # /bin/ls -a) a fait echouer la ressource avec « expected a
        # fully-qualified path name » — exact, mais illisible pour le demandeur.
        - name: Refuser une commande sudo qui n'est pas un chemin absolu
          # sudo EXIGE un chemin absolu : « ls -a » ne veut rien dire pour lui,
          # car le PATH du compte deciderait quel binaire tourne — c'est
          # precisement le trou qu'un droit sudo etroit cherche a fermer.
          ansible.builtin.assert:
            that: sudo_command is match('^/')
            fail_msg: >-
              la commande sudo doit etre un CHEMIN ABSOLU (recu : « {{ sudo_command }} »).
              Exemple : « /bin/ls -a » et non « ls -a ». sudo refuse un nom court,
              car le PATH du compte deciderait alors quel binaire est execute.
          when: account_state == "present" and sudo_command | length > 0

        - name: Refuser une cle publique qui n'en est pas une
          # Une cle invalide s'ecrivait sans erreur : le compte paraissait
          # correct, et PERSONNE ne pouvait s'y connecter. Un echec franc vaut
          # mieux qu'un succes qui ment.
          ansible.builtin.assert:
            that: ssh_public_key is match('^(ssh-(rsa|dss|ed25519)|ecdsa-sha2-|sk-)')
            fail_msg: >-
              la cle publique ne ressemble pas a une cle SSH (recu : « {{ ssh_public_key[:20] }}… »).
              Elle doit commencer par ssh-rsa, ssh-ed25519, ecdsa-sha2-… — c'est le
              contenu d'un fichier .pub, jamais une cle privee.
          when: account_state == "present" and ssh_public_key | length > 0

        - name: Compte de service
          ansible.builtin.user:
            name: "{{ account_name }}"
            shell: /bin/sh
            create_home: true
            comment: "compte de service - gere par la plateforme"
            state: "{{ 'present' if account_state == 'present' else 'absent' }}"
            remove: "{{ account_state != 'present' }}"

        - name: Repertoire des cles
          ansible.builtin.file:
            path: "/home/{{ account_name }}/.ssh"
            state: directory
            owner: "{{ account_name }}"
            mode: "0700"
          when: account_state == "present"

        - name: Cle publique autorisee
          ansible.builtin.copy:
            dest: "/home/{{ account_name }}/.ssh/authorized_keys"
            content: "{{ ssh_public_key }}\n"
            owner: "{{ account_name }}"
            mode: "0600"
          when: account_state == "present" and ssh_public_key | length > 0

        - name: Droit sudo limite a UNE commande
          # Le principe du moindre privilege, ecrit dans le fichier : pas de
          # « ALL », une seule commande, et visudo VALIDE avant d'ecrire — un
          # sudoers casse rend la machine inadministrable.
          ansible.builtin.copy:
            dest: "/etc/sudoers.d/{{ account_name }}"
            content: "{{ account_name }} ALL=(ALL) NOPASSWD: {{ sudo_command }}\n"
            mode: "0440"
            validate: "visudo -cf %s"
          when: account_state == "present" and sudo_command | length > 0

        - name: Retrait du droit sudo
          # Joue AUSSI au provisionnement quand le demandeur n'a pas demande de
          # sudo : retirer une demande de sudo doit retirer le droit, pas le laisser.
          ansible.builtin.file:
            path: "/etc/sudoers.d/{{ account_name }}"
            state: absent
          when: account_state != "present" or sudo_command | length == 0

        - name: Etat constate sur la cible
          ansible.builtin.command: "id {{ account_name }}"
          register: constat
          failed_when: false
          changed_when: false

        - name: Resultat
          ansible.builtin.debug:
            msg: >-
              compte {{ account_name }} :
              {{ 'PRESENT' if constat.rc == 0 else 'ABSENT' }} sur {{ inventory_hostname }}
              {{ '(sudo : ' ~ sudo_command ~ ')' if (account_state == 'present' and sudo_command | length > 0) else '' }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awx-playbooks
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels: { app: awx-playbooks }
spec:
  replicas: 1
  selector:
    matchLabels: { app: awx-playbooks }
  template:
    metadata:
      labels: { app: awx-playbooks }
      annotations:
        # Incrémenter à chaque modification du playbook ci-dessus : ArgoCD ne
        # redémarre pas un pod parce qu'une ConfigMap a changé.
        playbooks-revision: "5"
    spec:
      priorityClassName: platform-high
      volumes:
        - name: src
          configMap: { name: awx-playbooks-src }
        - name: www
          emptyDir: {}
      initContainers:
        - name: pack
          image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: src, mountPath: /src, readOnly: true }
            - { name: www, mountPath: /www }
          # MÊME valeur que l'annotation `playbooks-revision` du modèle de pod :
          # elle redémarre le pod ET nomme l'archive. Un seul chiffre à bouger.
          env:
            - { name: REVISION, value: "5" }
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              # Copie explicite puis archive : un montage de ConfigMap est un jeu
              # de liens symboliques vers ..data/, `tar .` embarquerait ces
              # répertoires internes.
              mkdir -p /work && cp -L /src/*.yml /work/
              # ⚠️ VÉCU : servir une archive qui CHANGE sous un nom FIXE ne suffit
              # pas. AWX a bien re-téléchargé la nouvelle archive, mais n'a PAS
              # ré-extrait : les playbooks sur disque restaient ceux de la veille,
              # et une correction poussée ne changeait rien à ce qui tournait —
              # sans une ligne d'erreur nulle part. Le nom porte donc la révision :
              # une URL neuve, AWX n'a plus le choix.
              tar czf "/www/legacy-playbooks-${REVISION}.tar.gz" -C /work .
              # Le nom fixe reste servi : la sonde de disponibilité s'y appuie, et
              # un projet AWX pas encore réaligné continue de trouver quelque chose.
              cp "/www/legacy-playbooks-${REVISION}.tar.gz" /www/legacy-playbooks.tar.gz
              echo "archive revision ${REVISION}: $(wc -c < /www/legacy-playbooks-${REVISION}.tar.gz) octets, contenu:"
              tar tzf "/www/legacy-playbooks-${REVISION}.tar.gz"
      containers:
        - name: nginx
          image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 # nginx:1.27-alpine
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 80, name: http }]
          volumeMounts:
            - { name: www, mountPath: /usr/share/nginx/html, readOnly: true }
          readinessProbe:
            httpGet: { path: /legacy-playbooks.tar.gz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: awx-playbooks
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector: { app: awx-playbooks }
  ports:
    - { name: http, port: 80, targetPort: 80 }
