# ─────────────────────────────────────────────────────────────────────────────
# GATE `WatchListClient` SUR LE KUBELET DE CHAQUE NŒUD
#
# POURQUOI. Sur ce cluster, les reflectors en watch-list (client-go >= 0.36) ne
# synchronisent jamais leur cache : ils PENDENT sans erreur. On l'a déjà payé sur
# cilium, CNPG, le manager Kratix et le source-controller — à chaque fois le
# remède a été la variable d'environnement `KUBE_FEATURE_WatchListClient=false`.
#
# Le KUBELET souffre du même mal, et c'est le plus coûteux : son gestionnaire de
# secrets/configmaps ne se synchronise plus, donc TOUT montage échoue avec
# « MountVolume.SetUp failed … failed to sync {secret,configmap} cache: timed
# out » — y compris `kube-api-access`. Le nœud reste Ready (son Lease part bien,
# c'est une écriture courte), il continue de faire tourner ce qu'il connaît
# déjà, mais il n'accepte plus AUCUN pod nouveau. Un nœud à moitié mort qui
# s'annonce sain.
#
# ⚠️ Scaleway REFUSE `kubelet-args.feature-gates` (« not available for this
# version ») : le seul chemin est l'environnement systemd du kubelet, donc un
# DaemonSet privilégié. Le drop-in ne survit pas au recyclage d'un nœud — d'où
# un DaemonSet plutôt qu'un geste manuel : tout nœud neuf est traité à sa
# naissance, sans intervention.
#
# ⚠️⚠️ IDEMPOTENCE, ET POURQUOI ELLE EST VITALE ICI : on ne redémarre le kubelet
# QUE si le gate n'est pas déjà dans son environnement. Un restart inutile n'est
# pas neutre — un kubelet qui redémarre SANS le gate déjà en place devient
# aveugle (constaté : il ne prend plus aucun pod, et on ne peut alors même plus
# y poser le correctif). Le drop-in est donc TOUJOURS écrit AVANT tout restart,
# et le restart est conditionné à sa prise en compte.
#
# ⚠️ Le pod ne monte AUCUN volume (`automountServiceAccountToken: false`) : c'est
# ce qui lui permet de démarrer sur un nœud dont les montages sont justement
# cassés. Ne pas y ajouter de secret, de configmap ni de token.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubelet-watchlist-gate
  namespace: kube-system
  labels: { app: kubelet-watchlist-gate }
spec:
  selector:
    matchLabels: { app: kubelet-watchlist-gate }
  template:
    metadata:
      labels: { app: kubelet-watchlist-gate }
    spec:
      hostPID: true
      hostNetwork: true
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: gate
          image: busybox:1.36
          securityContext: { privileged: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          command: ["nsenter", "-t", "1", "-m", "-u", "-i", "-n", "-p", "--", "sh", "-c"]
          args:
            - |
              DROPIN=/etc/systemd/system/kubelet.service.d/99-watchlist.conf
              VOULU='[Service]
              Environment="KUBE_FEATURE_WatchListClient=false"'
              while true; do
                # 1) le drop-in est écrit AVANT toute décision de restart
                if [ ! -f "$DROPIN" ] || ! grep -q 'KUBE_FEATURE_WatchListClient=false' "$DROPIN"; then
                  mkdir -p /etc/systemd/system/kubelet.service.d
                  printf '[Service]\nEnvironment="KUBE_FEATURE_WatchListClient=false"\n' > "$DROPIN"
                  systemctl daemon-reload
                  echo "$(date -Iseconds) drop-in ecrit"
                fi
                # 2) restart SEULEMENT si le kubelet ne porte pas encore le gate
                # ⚠️ On lit l'environnement du PROCESSUS EN COURS (/proc/<pid>/environ),
                #    PAS `systemctl show` : après un `daemon-reload`, systemd annonce
                #    déjà la variable au niveau de l'UNITÉ alors que le kubelet tourne
                #    encore sans elle. La sonde concluait « gate déjà actif » et ne
                #    redémarrait jamais — un contrôle qui mesurait autre chose que ce
                #    qu'il prétendait mesurer.
                KPID=$(pidof kubelet 2>/dev/null | tr ' ' '\n' | head -1)
                if [ -n "$KPID" ] && tr '\0' '\n' < "/proc/$KPID/environ" 2>/dev/null | grep -q 'KUBE_FEATURE_WatchListClient=false'; then
                  # 3) LE GATE NE SUFFIT PAS : GUÉRIR AUSSI UN KUBELET GELÉ MALGRÉ LUI.
                  #
                  # ⚠️⚠️ CONSTATÉ LE 2026-08-05 sur 853472cb : kubelet né AVEC le gate,
                  # et pourtant gelé 8 h — « failed to sync {secret,configmap} cache »
                  # en continu (118 occurrences / 5 min), AUCUNE erreur de watch ni de
                  # connexion dans le journal, mémoire et disque sains. Les reflectors
                  # du gestionnaire d'objets pendent SANS erreur (connexions zombies) ;
                  # le gate empêche la récidive du bug watch-list, il ne dégèle pas un
                  # kubelet déjà figé. Cette branche disait « aucun restart » et le
                  # nœud n'était donc JAMAIS soigné — le remède restait un geste
                  # manuel, découvert des heures plus tard par les pods bloqués.
                  #
                  # DÉTECTION PAR LA SIGNATURE, PAS PAR UNE HUMEUR : des erreurs de
                  # sync FRAÎCHES (3 dernières minutes) au-dessus d'un seuil qui ignore
                  # le blip isolé (un nœud gelé en produit ~100/5 min ; un incident
                  # passager, 1 ou 2). Le restart est PROUVÉ comme remède (37ce45fa le
                  # 2026-08-04 : montage KO avant, OK 20 s après ; 853472cb ce jour :
                  # MONTAGE-OK 8 s après) et bénin pour les charges (les conteneurs
                  # continuent, le kubelet se rattache).
                  #
                  # GARDE-FOU ANTI-BOUCLE : au plus un restart toutes les 20 min
                  # (marqueur epoch à côté du drop-in — il survit au restart du
                  # kubelet ; un recyclage du nœud le remet à zéro, comme tout le
                  # reste). Si un nœud gèle plus vite que ça, le journal du DaemonSet
                  # le DIT à chaque tour au lieu de marteler des restarts.
                  MARQUEUR=/etc/systemd/system/kubelet.service.d/.derniere-guerison
                  RECENTES=$(journalctl -u kubelet --since "3 minutes ago" --no-pager 2>/dev/null | grep -c 'failed to sync secret cache\|failed to sync configmap cache')
                  if [ "${RECENTES:-0}" -ge 5 ]; then
                    MAINTENANT=$(date +%s); DERNIERE=$(cat "$MARQUEUR" 2>/dev/null || echo 0)
                    if [ $((MAINTENANT - DERNIERE)) -ge 1200 ]; then
                      echo "$(date -Iseconds) GEL DETECTE ($RECENTES erreurs de sync en 3 min, gate pourtant actif) — restart de guerison"
                      echo "$MAINTENANT" > "$MARQUEUR"
                      systemctl restart kubelet
                      sleep 15
                      echo "$(date -Iseconds) kubelet=$(systemctl is-active kubelet)"
                    else
                      echo "$(date -Iseconds) GEL DETECTE ($RECENTES erreurs) mais guerison recente ($((MAINTENANT - DERNIERE)) s < 1200) — on attend, un noeud qui regele si vite merite des yeux humains"
                    fi
                  else
                    echo "$(date -Iseconds) gate actif, aucun gel ($RECENTES erreur(s) recente(s))"
                  fi
                else
                  echo "$(date -Iseconds) gate absent de l environnement — restart du kubelet"
                  systemctl restart kubelet
                  sleep 15
                  echo "$(date -Iseconds) kubelet=$(systemctl is-active kubelet)"
                fi
                sleep 300
              done
