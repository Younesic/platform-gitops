# Crossplane core — Helm (crossplane-stable/crossplane). Resources + priorityClass.
replicas: 1
priorityClassName: platform-high

resourcesCrossplane:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

resourcesRBACManager:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 250m, memory: 256Mi }

# Les providers (ex. provider-keycloak) sont installés séparément en tant que CR Provider
# (phase d'adoption identity-as-code), pas en pré-chargement ici.
provider:
  packages: []

# ⚠️ Gate WatchList (client-go >=0.36 / apiserver Kapsule) : sans lui, après un cycle
# de l'apiserver, les reflectors watch-list PENDENT sans erreur — manager « Running »
# zombie, XRD jamais Established, nouveaux contrôleurs jamais démarrés (vécu 2026-07-31
# sur le banc AU4 ; même signature que Kratix/BR1, source-controller, Cilium, CNPG).
# La règle du cluster : TOUT contrôleur porte ce gate.
extraEnvVarsCrossplane:
  KUBE_FEATURE_WatchListClient: "false"
extraEnvVarsRBACManager:
  KUBE_FEATURE_WatchListClient: "false"
